name: IW4C motion diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MarkusSela/IW4-Pocket
          ref: 1004fdcc388a515bb4600830af68c386aa5ee968
      - name: Add bounded movement diagnostics to 0.3.9
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          root=Path('.')
          source=root/'crates/bootstrap/src'
          (source/'motion_trace.rs').write_text("use bevy::prelude::*;\n\npub(crate) fn register(app: &mut App) {\n    if diag::detail::detailed() {\n        app.add_systems(Last, record);\n    }\n}\n\nfn record(\n    time: Res<Time<Real>>,\n    screen: Option<Res<frame::AppScreen>>,\n    prediction: Option<Res<net::ClientPredictionState>>,\n    presented: Option<Res<net::PresentedSnapshot>>,\n    local: Option<Res<net::LocalPresentClient>>,\n    clock: Option<Res<net::FrameClock>>,\n    command: Option<Res<net::ClientCmdTemplate>>,\n    cameras: Query<(&Camera, &GlobalTransform), With<Camera3d>>,\n    mut elapsed: Local<f64>,\n    mut number: Local<u32>,\n) {\n    if screen.as_deref() != Some(&frame::AppScreen::InGame) {\n        *elapsed = 0.0;\n        *number = 0;\n        return;\n    }\n    *elapsed += time.delta_secs_f64();\n    if *elapsed > 20.0 {\n        return;\n    }\n    *number += 1;\n    let predicted = prediction.as_ref().and_then(|p| p.0.predicted_local());\n    let visible = presented.as_ref().zip(local.as_ref()).and_then(|(p, id)| p.player(id.0));\n    let camera = cameras.iter().find(|(c, _)| c.is_active).map(|(_, t)| t.compute_transform());\n    diag::info!(Launch,\n        \"motion trace: n={} wall={:.6} dt={:.3} cg={:?} cmd={:?} pred={:?} shown={:?} camera={:?}\",\n        *number, time.elapsed_secs_f64(), time.delta_secs_f64() * 1000.0,\n        clock.as_ref().map(|c| (c.time(), c.old_time(), c.frametime())),\n        command.as_ref().map(|c| (c.cmd.server_time, c.cmd.forwardmove, c.cmd.rightmove)),\n        predicted.map(|p| (p.command_time, p.origin, p.viewangles)),\n        visible.map(|p| (p.command_time, p.origin, p.viewangles)),\n        camera.map(|t| (t.translation.to_array(), t.rotation.to_array()))\n    );\n}\n")
          p=source/'lib.rs'; s=p.read_text(); assert 'mod match_summary;' in s; p.write_text(s.replace('mod match_summary;','mod match_summary;\nmod motion_trace;'))
          p=source/'plugins.rs'; s=p.read_text(); assert 'crate::match_summary::register(app);' in s; p.write_text(s.replace('crate::match_summary::register(app);','crate::match_summary::register(app);\n    crate::motion_trace::register(app);'))
          p=root/'ios/Info.plist'; info=plistlib.loads(p.read_bytes()); info.update(CFBundleIdentifier='com.juxh02tech.iw4c',CFBundleName='IW4C',CFBundleDisplayName='IW4C',CFBundleVersion='26'); p.write_bytes(plistlib.dumps(info))
          PY
      - run: rustup toolchain install stable --profile minimal && rustup target add aarch64-apple-ios
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: iw4c-motion-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ios-ipa-
      - name: Build iPhone runtime
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: |
          set -o pipefail
          cargo build --profile ios --target aarch64-apple-ios -p launcher --bin iw4l 2>&1 | tee build.log
      - name: Package
        run: |
          mkdir -p Payload/IW4L.app
          cp target/aarch64-apple-ios/ios/iw4l Payload/IW4L.app/iw4l
          cp ios/Info.plist Payload/IW4L.app/Info.plist
          cp ios/icons/AppIcon60x60* ios/icons/AppIcon76x76* ios/icons/AppIcon83.5x83.5* Payload/IW4L.app/
          zip -qr IW4C.ipa Payload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IW4C-motion
          path: |
            IW4C.ipa
            build.log
