Vec<(ExactPipelineSlot, RenderPipeline)>,\n}\n\n#[derive(Resource, Default)]\npub(super) struct ExactPipelineRegistry {\n    world: frame::WorldStamp,\n    slots: Vec<SlotState>,\n    by_key: HashMap<super::colour_submit::ExactColourPipelineKey, ExactPipelineSlot>,\n    modules: HashMap<ModuleKey, Arc<ShaderModule>>,\n\n    queued: HashMap<\n        ModuleKey,\n        (\n            ExactModuleSource,\n            Vec<(ExactPipelineSlot, ExactPipelinePlan)>,\n        ),\n    >,\n    jobs: Vec<Task<PortBuild>>,\n    budget: super::build_budget::BuildBudget<ModuleKey>,\n\n    layouts: Mutex<HashMap<BindGroupLayoutDescriptor, BindGroupLayout>>,\n\n    discovered: Mutex<Vec<super::colour_submit::ExactColourPipelineKey>>,\n}\n\nimpl ExactPipelineRegistry {\n    pub(super) fn set_world(&mut self, world: frame::WorldStamp) -> bool {\n        if self.world == world {\n            return false;\n        }\n        *self = Self {\n            world,\n            ..Self::default()\n        };\n        true\n    }\n\n    pub(super) fn bind_group_layout(\n        &self,\n        device: &RenderDevice,\n        descriptor: &BindGroupLayoutDescriptor,\n    ) -> BindGroupLayout {\n        self.layouts\n            .lock()\n            .expect("exact pipeline layout cache is never poisoned")\n            .entry(descriptor.clone())\n            .or_insert_with_key(|descriptor| {\n                device.create_bind_group_layout(descriptor.label.as_ref(), &descriptor.entries)\n            })\n            .clone()\n    }\n\n    pub(super) fn discover(&self, key: super::colour_submit::ExactColourPipelineKey) {\n        self.discovered\n            .lock()\n            .expect("exact pipeline discovery list is never poisoned")\n            .push(key);\n    }\n\n    pub(super) fn take_discovered(&mut self) -> Vec<super::colour_submit::ExactColourPipelineKey> {\n        std::mem::take(\n            &mut *self\n                .discovered\n                .lock()\n                .expect("exact pipeline discovery list is never poisoned"),\n        )\n    }\n\n    pub(super) fn slot(\n        &self,\n        key: &super::colour_submit::ExactColourPipelineKey,\n    ) -> Option<ExactPipelineSlot> {\n        self.by_key.get(key).copied()\n    }\n\n    pub(super) fn ready(&self, slot: ExactPipelineSlot) -> Option<&RenderPipeline> {\n        match self.slots.get(slot.0 as usize) {\n            Some(SlotState::Ready(pipeline)) => Some(pipeline),\n            _ => None,\n        }\n    }\n\n    pub(super) fn is_ready(&self, slot: ExactPipelineSlot) -> bool {\n        matches!(self.slots.get(slot.0 as usize), Some(SlotState::Ready(_)))\n    }\n\n    pub(super) fn request(\n        &mut self,\n        key: super::colour_submit::ExactColourPipelineKey,\n        source: ExactModuleSource,\n        plan: ExactPipelinePlan,\n    ) -> ExactPipelineSlot {\n        if let Some(slot) = self.by_key.get(&key).copied() {\n            return slot;\n        }\n        let slot = ExactPipelineSlot(\n            u32::try_from(self.slots.len()).expect("exact pipeline slot count fits u32"),\n        );\n        self.slots.push(SlotState::Building);\n        self.by_key.insert(key, slot);\n\n        let module = ModuleKey {\n            port: key.port,\n            cached_lighting: matches!(source, ExactModuleSource::CachedLighting(_)),\n        };\n        self.queued\n            .entry(module)\n            .or_insert_with(|| (source, Vec::new()))\n            .1\n            .push((slot, plan));\n        slot\n    }\n\n    pub(super) fn flush(&mut self, device: &RenderDevice) {\n        if self.queued.is_empty() {\n            return;\n        }\n\n        let pool = assets::load_pool();\n        // Keep queued plans until a compiler slot is free. In particular, do\n        // not start a second compiler for a module already being prepared.\n        let selected: Vec<_> = self.queued.keys().copied()\n            .filter(|module| !self.budget.contains(*module))\n            .take(self.budget.available()).collect();\n        for module in selected {\n            if !self.budget.start(module) { continue; }\n            let Some((source, plans)) = self.queued.remove(&module) else {\n                self.budget.finish(module); continue;\n            };\n            let device = device.clone();\n            let existing = self.modules.get(&module).cloned();\n            self.jobs.push(\n                pool.spawn(async move { build_port(&device, module, source, existing, plans) }),\n            );\n        }\n    }\n\n    pub(super) fn poll(&mut self) {\n        let mut index = 0;\n        while index < self.jobs.len() {\n            let Some(build) = future::block_on(future::poll_once(&mut self.jobs[index])) else {\n                index += 1;\n                continue;\n            };\n\n            drop(self.jobs.swap_remove(index));\n            self.budget.finish(build.module);\n            // Ready Metal pipelines own what they need. Keeping every shader\n            // module\'s compiler representation duplicates memory on iPhone.\n            if let Some(created) = build.created {\n                if !cfg!(target_os = "ios") { self.modules.insert(build.module, created); }\n            }\n            for (slot, pipeline) in build.pipelines {\n                self.slots[slot.0 as usize] = SlotState::Ready(pipeline);\n            }\n        }\n    }\n\n    pub(super) fn module_n(&self) -> usize {\n        self.modules.len()\n    }\n\n    pub(super) fn building_n(&self) -> usize {\n        self.jobs.len()\n    }\n}\n\nfn build_port(\n    device: &RenderDevice,\n    module: ModuleKey,\n    source: ExactModuleSource,\n    existing: Option<Arc<ShaderModule>>,\n    plans: Vec<(ExactPipelineSlot, ExactPipelinePlan)>,\n) -> PortBuild {\n    let label = format!(\n        "iw4_exact_colour/{:016x}/{}{}",\n        module.port.vertex_program_hash,\n        module.port.vertex_type,\n        if module.cached_lighting {\n            "/cached"\n        } else {\n            ""\n        }\n    );\n\n    let (shader, created) = match existing {\n        Some(shader) => (shader, None),\n        None => {\n            let shader = Arc::new(unsafe {\n                device.create_shader_module(ShaderModuleDescriptor {\n                    label: Some(&label),\n                    source: ShaderSource::Wgsl(std::borrow::Cow::Borrowed(source.wgsl())),\n                })\n            });\n            (shader.clone(), Some(shader))\n        }\n    };\n    let pipelines = plans\n        .into_iter()\n        .map(|(slot, plan)| (slot, build_pipeline(device, &shader, &plan)))\n        .collect();\n    PortBuild {\n        module,\n        created,\n        pipelines,\n    }\n}\n\nfn build_pipeline(\n    device: &RenderDevice,\n    shader: &ShaderModule,\n    plan: &ExactPipelinePlan,\n) -> RenderPipeline {\n    let layout = device.create_pipeline_layout(&PipelineLayoutDescriptor {\n        label: Some(&plan.label),\n        bind_group_layouts: &[Some(&plan.constants_layout), Some(&plan.textures_layout)],\n        immediate_size: 0,\n    });\n    let buffers: Vec<Option<RawVertexBufferLayout>> = plan\n        .vertex_buffers\n        .iter()\n        .map(|buffer| {\n            Some(RawVertexBufferLayout {\n                array_stride: buffer.array_stride,\n                attributes: &buffer.attributes,\n                step_mode: buffer.step_mode,\n            })\n        })\n        .collect();\n    let compilation_options = PipelineCompilationOptions {\n        constants: &[],\n        zero_initialize_workgroup_memory: false,\n    };\n    device.create_render_pipeline(&RawRenderPipelineDescriptor {\n        label: Some(&plan.label),\n        layout: Some(&layout),\n        vertex: RawVertexState {\n            module: shader,\n            entry_point: Some(PASS_VERTEX_ENTRY),\n            buffers: &buffers,\n            compilation_options: compilation_options.clone(),\n        },\n        fragment: Some(RawFragmentState {\n            module: shader,\n            entry_point: Some(&plan.fragment_entry),\n            targets: &plan.targets,\n            compilation_options,\n        }),\n        primitive: plan.primitive,\n        depth_stencil: Some(plan.depth_stencil.clone()),\n        multisample: plan.multisample,\n        multiview_mask: None,\n        cache: None,\n    })\n}\n')
          (target/'crates/render_gpu/src/drawsurf/build_budget.rs').write_text('//! Bound native shader compiler scratch memory; queue entries remain pending.\nuse std::collections::HashSet;\nuse std::hash::Hash;\npub(super) struct BuildBudget<K> { active: HashSet<K>, limit: usize }\nimpl<K: Eq + Hash + Copy> Default for BuildBudget<K> {\n    fn default() -> Self { Self::new(if cfg!(target_os = "ios") { 1 } else { usize::MAX }) }\n}\nimpl<K: Eq + Hash + Copy> BuildBudget<K> {\n    fn new(limit: usize) -> Self { Self { active: HashSet::new(), limit } }\n    pub(super) fn available(&self) -> usize { self.limit.saturating_sub(self.active.len()) }\n    pub(super) fn contains(&self, key: K) -> bool { self.active.contains(&key) }\n    pub(super) fn start(&mut self, key: K) -> bool {\n        if self.available() == 0 || self.contains(key) { return false; }\n        self.active.insert(key)\n    }\n    pub(super) fn finish(&mut self, key: K) { self.active.remove(&key); }\n}\n#[cfg(test)] mod tests {\n    use super::*;\n    #[test] fn mobile_jobs_wait_without_loss_or_duplicate_compilers() {\n        let mut budget=BuildBudget::new(1);\n        let mut pending=std::collections::VecDeque::from([1,2,3,4]);\n        let mut completed=Vec::new();\n        while let Some(job)=pending.pop_front() {\n            assert!(budget.start(job)); assert_eq!(budget.available(),0);\n            assert!(!budget.start(job)); assert!(!budget.start(99));\n            assert!(budget.contains(job)); budget.finish(job); completed.push(job);\n            assert_eq!(budget.available(),1);\n        }\n        assert_eq!(completed,[1,2,3,4]);\n    }\n    #[test] fn completed_jobs_release_only_their_own_slot() {\n        let mut budget=BuildBudget::new(2);\n        assert!(budget.start(1));assert!(budget.start(2));assert!(!budget.start(3));\n        budget.finish(1);budget.finish(1);assert_eq!(budget.available(),1);\n        assert!(budget.start(3));assert!(budget.contains(2));assert_eq!(budget.available(),0);\n    }\n}\n')
          
          
