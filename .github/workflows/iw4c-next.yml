          # Share each identical geometry stream independently, including map models.
          (target/'crates/asset_model/src/shared_stream.rs').write_text('//! Share independently identical model streams without keeping dead maps alive.\nuse std::{collections::HashMap, sync::{Arc, Weak}};\n#[derive(Clone, Debug)]\npub(super) struct SharedStream<T> {\n    entries: HashMap<u64, Vec<Weak<[T]>>>,\n    pub saved_bytes: usize,\n}\nimpl<T> Default for SharedStream<T> {\n    fn default() -> Self { Self { entries: HashMap::new(), saved_bytes: 0 } }\n}\nimpl<T> SharedStream<T> {\n    pub fn intern(&mut self, value: Arc<[T]>, hash: u64, equal: impl Fn(&[T], &[T]) -> bool) -> Arc<[T]> {\n        let candidates = self.entries.entry(hash).or_default();\n        candidates.retain(|candidate| candidate.strong_count() != 0);\n        for candidate in candidates.iter().filter_map(Weak::upgrade) {\n            if equal(&value, &candidate) {\n                if !Arc::ptr_eq(&value, &candidate) {\n                    self.saved_bytes += value.len() * std::mem::size_of::<T>();\n                }\n                return candidate;\n            }\n        }\n        candidates.push(Arc::downgrade(&value));\n        value\n    }\n}\n#[cfg(test)] mod tests {\n    use super::*;\n    #[test] fn changed_uvs_do_not_prevent_sharing_identical_indices() {\n        let mut indices = SharedStream::default();\n        let mut vertices = SharedStream::default();\n        let a=indices.intern(Arc::from([0u32,1,2]),7,|a,b|a==b);\n        let b=indices.intern(Arc::from([0u32,1,2]),7,|a,b|a==b);\n        let va=vertices.intern(Arc::from([1u8,2,3]),8,|a,b|a==b);\n        let vb=vertices.intern(Arc::from([1u8,9,3]),8,|a,b|a==b);\n        assert!(Arc::ptr_eq(&a,&b)); assert!(!Arc::ptr_eq(&va,&vb));\n        assert_eq!(indices.saved_bytes,12);\n    }\n    #[test] fn hash_collisions_do_not_merge_different_geometry() {\n        let mut pool=SharedStream::default();\n        let a=pool.intern(Arc::from([1u32,2]),0,|a,b|a==b);\n        let b=pool.intern(Arc::from([2u32,1]),0,|a,b|a==b);\n        assert!(!Arc::ptr_eq(&a,&b)); assert_eq!(pool.saved_bytes,0);\n    }\n    #[test] fn weak_cache_does_not_retain_unloaded_maps() {\n        let mut pool=SharedStream::default();\n        let a=pool.intern(Arc::from([1u32]),0,|a,b|a==b);\n        let weak=Arc::downgrade(&a);drop(a);assert!(weak.upgrade().is_none());\n        let b=pool.intern(Arc::from([1u32]),0,|a,b|a==b);\n        assert_eq!(&*b,&[1]);assert_eq!(pool.saved_bytes,0);\n    }\n    #[test] fn floating_point_streams_compare_exact_bits() {\n        let mut pool=SharedStream::default();\n        let equal=|a:&[f32],b:&[f32]| a.len()==b.len() && a.iter().zip(b).all(|(a,b)|a.to_bits()==b.to_bits());\n        let a=pool.intern(Arc::from([0.0f32]),0,equal);\n        let b=pool.intern(Arc::from([-0.0f32]),0,equal);\n        assert!(!Arc::ptr_eq(&a,&b));\n        let nan=f32::from_bits(0x7fc00001);\n        let c=pool.intern(Arc::from([nan]),0,equal);\n        let d=pool.intern(Arc::from([nan]),0,equal);\n        assert!(Arc::ptr_eq(&c,&d));\n    }\n}\n',encoding='utf-8')
          (target/'crates/asset_model/src/model_skel.rs').write_text('use std::{\n    collections::{HashMap, hash_map::DefaultHasher},\n    hash::{Hash, Hasher},\n    sync::Arc,\n};\n\nuse asset_iw4::size as sz;\nuse bevy::prelude::{Quat, Vec3};\nuse fastfile_iw4::{Ptr, ScriptStrings, XModelGeometry, ZonePtr, ZoneStream};\n\nuse crate::{\n    ModelKind, dobj::ModelPoseSrc, fpv_catalog::TagViewBind, model_kind, normalize_or_up,\n    unpack_color, unpack_packed_tex_coords, unpack_unit_vec,\n};\nuse asset_material::MaterialCatalog;\npub use xmodel_runtime::BoneCollision;\n\nconst BONE_STRIDE: u16 = 64;\n\npub fn lod_surface_range(span: [(u16, u16); 4], total: usize, lod: u8) -> core::ops::Range<usize> {\n    let i = usize::from(lod).min(3);\n    if span.iter().all(|&(_, count)| count == 0) {\n        return if i == 0 { 0..total } else { 0..0 };\n    }\n    let (start, count) = span[i];\n    let start = usize::from(start).min(total);\n    let end = start.saturating_add(usize::from(count)).min(total);\n    start..end\n}\n\npub fn xmodel_lod_for_dist(num_lods: u8, lod_dist: [f32; 4], dist: f32) -> Option<u8> {\n    if num_lods == 0 {\n        return Some(0);\n    }\n    let n = usize::from(num_lods).min(4);\n    for lod in 0..n {\n        let d = lod_dist[lod];\n        if d == 0.0 || d > dist {\n            return Some(lod as u8);\n        }\n    }\n    None\n}\n\npub fn has_lod_for_dist(submodels: impl IntoIterator<Item = (u8, [f32; 4])>, dist: f32) -> bool {\n    let mut saw = false;\n    for (num_lods, lod_dist) in submodels {\n        saw = true;\n        if xmodel_lod_for_dist(num_lods, lod_dist, dist).is_some() {\n            return true;\n        }\n    }\n    !saw\n}\n\n#[derive(Clone, Debug)]\npub struct ModelSkel {\n    pub name: String,\n    pub bones: Vec<BoneBind>,\n\n    pub bone_collision: Vec<Option<BoneCollision>>,\n\n    pub bone_names: Vec<String>,\n    pub tag_view: Option<usize>,\n    pub tag_weapon: Option<usize>,\n\n    pub pose: Option<ModelPoseSrc>,\n    pub positions: Arc<[[f32; 3]]>,\n    pub indices: Arc<[u32]>,\n\n    pub surface_materials: Vec<Option<crate::WalkLocalMaterialIndex>>,\n\n    pub surface_vertex_ranges: Vec<(usize, usize)>,\n\n    pub surface_index_ranges: Vec<(usize, usize)>,\n\n    pub surface_part_bits: Vec<[u32; 6]>,\n\n    pub surface_deformed: Vec<Option<bool>>,\n\n    pub surface_vert_list_count: Vec<Option<u32>>,\n\n    pub vert_skin: Arc<[VertSkin]>,\n    pub rigid_verts: usize,\n    pub blend_verts: usize,\n\n    pub packed_vertices: Arc<[[u8; sz::GFX_PACKED_VERTEX]]>,\n\n    pub radius: Option<f32>,\n\n    pub bounds: Option<([f32; 3], [f32; 3])>,\n\n    pub contents: Option<u32>,\n\n    pub coll_lod: i16,\n\n    pub coll_surfs: Vec<xmodel_runtime::CollSurfCollision>,\n\n    pub movement_brushes: Vec<xmodel_runtime::ModelMovementBrush>,\n\n    pub mount_tag: Option<String>,\n\n    pub lod: Option<crate::ModelLodSelector>,\n\n    pub lod_smc: Option<[[u8; 4]; 4]>,\n\n    pub lod_part_bits: Option<[[u32; 6]; 4]>,\n\n    pub lod_surf_span: [(u16, u16); 4],\n}\n\nfn vertex_word(vertex: &[u8; sz::GFX_PACKED_VERTEX], offset: usize) -> u32 {\n    u32::from_le_bytes(vertex[offset..offset + 4].try_into().unwrap())\n}\n\nfn vertex_normal(vertex: &[u8; sz::GFX_PACKED_VERTEX]) -> [f32; 3] {\n    normalize_or_up(unpack_unit_vec(vertex_word(vertex, 24)))\n}\n\nimpl ModelSkel {\n    pub fn has_same_vertex_attributes(&self, other: &Self) -> bool {\n        self.packed_vertices.len() == other.packed_vertices.len()\n            && self\n                .packed_vertices\n                .iter()\n                .zip(other.packed_vertices.iter())\n                .all(|(a, b)| {\n                    let uv = vertex_word(a, 20);\n                    let other_uv = vertex_word(b, 20);\n                    let half_is_nan = |bits: u32| bits & 0x7c00 == 0x7c00 && bits & 0x03ff != 0;\n                    vertex_word(a, 16) == vertex_word(b, 16)\n                        && (vertex_word(a, 24) == vertex_word(b, 24)\n                            || vertex_normal(a) == vertex_normal(b))\n                        && if uv == other_uv {\n                            // Identical NaN encodings must still fail decoded float equality.\n                            !half_is_nan(uv) && !half_is_nan(uv >> 16)\n                        } else {\n                            unpack_packed_tex_coords(uv) == unpack_packed_tex_coords(other_uv)\n                        }\n                })\n    }\n\n    pub fn normal(&self, index: usize) -> Option<[f32; 3]> {\n        self.packed_vertices.get(index).map(vertex_normal)\n    }\n\n    pub fn normals(&self) -> impl ExactSizeIterator<Item = [f32; 3]> + \'_ {\n        self.packed_vertices.iter().map(vertex_normal)\n    }\n\n    pub fn colors(&self) -> impl ExactSizeIterator<Item = [f32; 4]> + \'_ {\n        self.packed_vertices\n            .iter()\n            .map(|v| unpack_color(vertex_word(v, 16)))\n    }\n\n    pub fn uvs(&self) -> impl ExactSizeIterator<Item = [f32; 2]> + \'_ {\n        self.packed_vertices\n            .iter()\n            .map(|v| unpack_packed_tex_coords(vertex_word(v, 20)))\n    }\n\n    pub fn retained_capability(&self) -> Option<xmodel_runtime::RetainedModelCapability> {\n        Some(xmodel_runtime::RetainedModelCapability {\n            key: self.name.clone(),\n            pose: self.pose.clone()?,\n            bone_collision: self.bone_collision.clone(),\n            contents: self.contents,\n            coll_lod: self.coll_lod,\n            coll_surfs: self.coll_surfs.clone(),\n            movement_brushes: self.movement_brushes.clone(),\n            bounds: self.bounds,\n            radius: self.radius,\n        })\n    }\n\n    pub fn parent_of(&self, bone: usize) -> Option<usize> {\n        let pose = self.pose.as_ref()?;\n        if bone < pose.num_root_bones {\n            return None;\n        }\n        let child = bone - pose.num_root_bones;\n        let step = *pose.parent_list.get(child)? as usize;\n        bone.checked_sub(step).filter(|p| *p < bone && step > 0)\n    }\n\n    pub fn tag_camera(&self) -> Option<usize> {\n        self.bone_names\n            .iter()\n            .position(|n| n.eq_ignore_ascii_case("tag_camera"))\n    }\n\n    pub fn surfaces_for_lod(&self, lod: u8) -> core::ops::Range<usize> {\n        lod_surface_range(self.lod_surf_span, self.surface_vertex_ranges.len(), lod)\n    }\n\n    #[must_use]\n    pub fn posed_bounds_part_bits(&self, lod: u8) -> [u32; 6] {\n        if let Some(rows) = self.lod_part_bits {\n            return rows[usize::from(lod).min(3)];\n        }\n        let mut local = [0u32; 6];\n        for surf in self.surfaces_for_lod(lod) {\n            if let Some(bits) = self.surface_part_bits.get(surf) {\n                for (dst, src) in local.iter_mut().zip(bits.iter()) {\n                    *dst |= *src;\n                }\n            }\n        }\n        local\n    }\n}\n\npub type FpvSkel = ModelSkel;\n\n#[derive(Clone, Copy, Debug, PartialEq, Eq, Hash)]\npub struct VertSkin {\n    pub bones: [u8; 4],\n    extra_weights: [u16; 3],\n    weight_flags: u8,\n}\n\nimpl Default for VertSkin {\n    fn default() -> Self {\n        Self {\n            bones: [0; 4],\n            extra_weights: [0; 3],\n            weight_flags: 1 << 4,\n        }\n    }\n}\n\nimpl VertSkin {\n    pub(crate) fn rigid(bone: u8) -> Self {\n        Self {\n            bones: [bone, 0, 0, 0],\n            weight_flags: 1 << 5,\n            ..Self::default()\n        }\n    }\n\n    pub fn has_extra_weight(&self, index: usize) -> bool {\n        self.weight_flags & (1 << index) != 0\n    }\n\n    pub fn primary_is_zero(&self) -> bool {\n        self.weight_flags & (1 << 4) != 0\n    }\n\n    fn weight_is_nonzero(&self, index: usize) -> bool {\n        if index == 0 {\n            !self.primary_is_zero()\n        } else {\n            self.has_extra_weight(index)\n        }\n    }\n\n    pub fn has_only_primary_weight(&self) -> bool {\n        self.weight_flags & 0x2e == 0x20\n    }\n\n    pub(crate) fn is_rigid(&self) -> bool {\n        self.weight_flags & (1 << 5) != 0 && !self.has_extra_weight(1)\n    }\n\n    pub fn extra_weight(&self, index: usize) -> u16 {\n        self.extra_weights[index - 1]\n    }\n\n    pub(crate) fn set_extra_weight(&mut self, index: usize, raw: u16) {\n        self.extra_weights[index - 1] = raw;\n    }\n\n    pub(crate) fn set_weight(&mut self, index: usize, weight: f32) {\n        if index == 0 {\n            self.weight_flags = (self.weight_flags & 0x0f)\n                | (u8::from(weight == 0.0) << 4)\n                | (u8::from(weight == 1.0) << 5);\n        } else {\n            self.weight_flags =\n                (self.weight_flags & !(1 << index)) | (u8::from(weight > 0.0) << index);\n        }\n    }\n}\n\n#[derive(Clone, Copy, Debug)]\npub struct BoneBind {\n    pub quat: [f32; 4],\n    pub trans: [f32; 3],\n}\n\nimpl BoneBind {\n    pub fn to_mat4(self) -> bevy::math::Mat4 {\n        let q = Quat::from_xyzw(self.quat[0], self.quat[1], self.quat[2], self.quat[3]);\n        bevy::math::Mat4::from_rotation_translation(q, Vec3::from_array(self.trans))\n    }\n}\n\nimpl From<BoneBind> for TagViewBind {\n    fn from(b: BoneBind) -> Self {\n        TagViewBind {\n            quat: b.quat,\n            trans: b.trans,\n        }\n    }\n}\n\n#[path = "shared_stream.rs"]\nmod shared_stream;\nuse shared_stream::SharedStream;\n\n#[derive(Clone, Debug, Default)]\nstruct SharedGeometry {\n    packed: SharedStream<[u8; sz::GFX_PACKED_VERTEX]>,\n    positions: SharedStream<[f32; 3]>,\n    indices: SharedStream<u32>,\n    skin: SharedStream<VertSkin>,\n    models: usize,\n}\n\n#[derive(Clone, Debug, Default)]\npub struct SharedXModelSurfaces(\n    pub std::collections::BTreeMap<String, (Arc<ModelSkel>, usize)>,\n    SharedGeometry,\n);\n\nfn stream_hash<T: Hash>(stream: &[T]) -> u64 {\n    let mut hash = DefaultHasher::new();\n    stream.hash(&mut hash);\n    hash.finish()\n}\n\nimpl SharedXModelSurfaces {\n    pub fn share_geometry(&mut self, mut skel: ModelSkel) -> Arc<ModelSkel> {\n        // Camouflage or skin differences in one stream must not duplicate the\n        // other streams. Equality is checked after hashing, including float bits.\n        let key = stream_hash(&skel.packed_vertices);\n        skel.packed_vertices = self.1.packed.intern(skel.packed_vertices, key, |a,b| a==b);\n        let mut hash = DefaultHasher::new();\n        skel.positions.len().hash(&mut hash);\n        for vertex in skel.positions.iter() { vertex.map(f32::to_bits).hash(&mut hash); }\n        skel.positions = self.1.positions.intern(skel.positions, hash.finish(), |a,b| {\n            a.len()==b.len() && a.iter().zip(b).all(|(a,b)| a.map(f32::to_bits)==b.map(f32::to_bits))\n        });\n        let key = stream_hash(&skel.indices);\n        skel.indices = self.1.indices.intern(skel.indices, key, |a,b| a==b);\n        let key = stream_hash(&skel.vert_skin);\n        skel.vert_skin = self.1.skin.intern(skel.vert_skin, key, |a,b| a==b);\n        self.1.models += 1;\n        if self.1.models % 128 == 0 {\n            diag::info!(World, "model stream sharing: models={} avoided_duplicate_MiB={:.1}",\n                self.1.models, (self.1.packed.saved_bytes + self.1.positions.saved_bytes\n                    + self.1.indices.saved_bytes + self.1.skin.saved_bytes) as f64 / 1048576.0);\n        }\n        Arc::new(skel)\n    }\n\n    pub fn retain(\n        &mut self,\n        stream: &ZoneStream<\'_>,\n        geometry: XModelGeometry,\n        skel: std::sync::Arc<ModelSkel>,\n    ) {\n        for lod in 0..4 {\n            if geometry.lod_xsurfaces[lod].is_some()\n                && let Some(name) =\n                    geometry.lod_surface_names[lod].and_then(|p| stream.cstr(p).ok())\n                && !name.starts_with(\',\')\n            {\n                self.0.insert(name.to_owned(), (skel.clone(), lod));\n            }\n        }\n    }\n\n    pub fn retain_iw5(\n        &mut self,\n        stream: &fastfile_iw5::ZoneStream<\'_>,\n        geometry: fastfile_iw5::XModelGeometry,\n        skel: std::sync::Arc<ModelSkel>,\n    ) {\n        if geometry.surfaces.is_some()\n            && let Some(name) = geometry.surfaces_name.and_then(|p| stream.cstr(p).ok())\n            && !name.starts_with(\',\')\n        {\n            self.0.insert(name.to_owned(), (skel, 0));\n        }\n    }\n}\n\npub fn capture_xmodel_skel_with_shared(\n    stream: &ZoneStream<\'_>,\n    strings: &ScriptStrings,\n    geometry: XModelGeometry,\n    materials: Option<&MaterialCatalog>,\n    shared: &SharedXModelSurfaces,\n) -> Option<ModelSkel> {\n    let name = geometry.name.and_then(|p| stream.cstr(p).ok())?.to_owned();\n    capture_model_skel_iw4(stream, strings, geometry, name, materials, Some(shared))\n}\n\npub fn capture_xmodel_skel(\n    stream: &ZoneStream<\'_>,\n    strings: &ScriptStrings,\n    geometry: XModelGeometry,\n    materials: Option<&MaterialCatalog>,\n) -> Option<ModelSkel> {\n    let name = geometry.name.and_then(|p| stream.cstr(p).ok())?.to_owned();\n    capture_model_skel_iw4(stream, strings, geometry, name, materials, None)\n}\n\npub fn capture_fpv_skel(\n    stream: &ZoneStream<\'_>,\n    strings: &ScriptStrings,\n    geometry: XModelGeometry,\n    materials: Option<&MaterialCatalog>,\n) -> Option<ModelSkel> {\n    let name = geometry.name.and_then(|p| stream.cstr(p).ok())?.to_owned();\n    if model_kind(&name) != Some(ModelKind::Fpv) {\n        return None;\n    }\n    capture_model_skel_iw4(stream, strings, geometry, name, materials, None)\n}\n\npub fn capture_body_skel(\n    stream: &ZoneStream<\'_>,\n    strings: &ScriptStrings,\n    geometry: XModelGeometry,\n    materials: Option<&MaterialCatalog>,\n) -> Option<ModelSkel> {\n    let name = geometry.name.and_then(|p| stream.cstr(p).ok())?.to_owned();\n    if model_kind(&name) != Some(ModelKind::Soldier) {\n        return None;\n    }\n    capture_model_skel_iw4(stream, strings, geometry, name, materials, None)\n}\n\npub fn capture_world_weapon_skel(\n    stream: &ZoneStream<\'_>,\n    strings: &ScriptStrings,\n    geometry: XModelGeometry,\n    materials: Option<&MaterialCatalog>,\n) -> Option<ModelSkel> {\n    let name = geometry.name.and_then(|p| stream.cstr(p).ok())?.to_owned();\n    if model_kind(&name) != Some(ModelKind::WorldWeapon) {\n        return None;\n    }\n    capture_model_skel_iw4(stream, strings, geometry, name, materials, None)\n}\n\npub fn capture_untyped_skel(\n    stream: &ZoneStream<\'_>,\n    strings: &ScriptStrings,\n    geometry: XModelGeometry,\n    materials: Option<&MaterialCatalog>,\n) -> Option<ModelSkel> {\n    let name = geometry.name.and_then(|p| stream.cstr(p).ok())?.to_owned();\n    capture_model_skel_iw4(stream, strings, geometry, name, materials, None)\n}\n\nfn capture_model_skel_iw4(\n    stream: &ZoneStream<\'_>,\n    strings: &ScriptStrings,\n    geometry: XModelGeometry,\n    name: String,\n    materials: Option<&MaterialCatalog>,\n    shared: Option<&SharedXModelSurfaces>,\n) -> Option<ModelSkel> {\n    let bone_names = geometry.bone_names?;\n    let base_mat = geometry.base_mat?;\n\n    let mut bones = Vec::with_capacity(geometry.num_bones);\n    let mut bone_name_strs = Vec::with_capacity(geometry.num_bones);\n    let mut tag_view = None;\n    let mut tag_weapon = None;\n    for i in 0..geometry.num_bones {\n        let id = stream.u16_at(bone_names, i * 2).ok()?;\n        let bone_name = strings.get(stream, id).unwrap_or("").to_owned();\n        if bone_name == "tag_view" && tag_view.is_none() {\n            tag_view = Some(i);\n        }\n        if bone_name == "tag_weapon" && tag_weapon.is_none() {\n            tag_weapon = Some(i);\n        }\n        bone_name_strs.push(bone_name);\n        let m = base_mat.at(i * sz::DOBJ_ANIM_MAT);\n        bones.push(BoneBind {\n            quat: [\n                stream.f32_at(m, 0).ok()?,\n                stream.f32_at(m, 4).ok()?,\n                stream.f32_at(m, 8).ok()?,\n                stream.f32_at(m, 12).ok()?,\n            ],\n            trans: [\n                stream.f32_at(m, 16).ok()?,\n                stream.f32_at(m, 20).ok()?,\n                stream.f32_at(m, 24).ok()?,\n            ],\n        });\n    }\n\n    let num_child = geometry.num_bones.saturating_sub(geometry.num_root_bones);\n    let pose = capture_pose_src(stream, &geometry, &bone_name_strs, &bones, num_child);\n    let bone_collision = capture_bone_collision(stream, geometry, geometry.num_bones);\n\n    let mut positions = Vec::new();\n    let mut indices = Vec::new();\n    let mut surface_materials = Vec::new();\n    let mut surface_vertex_ranges = Vec::new();\n    let mut surface_index_ranges = Vec::new();\n    let mut surface_part_bits = Vec::new();\n    let mut surface_deformed = Vec::new();\n    let mut surface_vert_list_count = Vec::new();\n    let mut vert_skin = Vec::new();\n    let mut rigid_verts = 0usize;\n    let mut blend_verts = 0usize;\n    let mut packed_vertices = Vec::new();\n    let mut lod_surf_span = [(0u16, 0u16); 4];\n    let mut any_surf = false;\n\n    for lod in 0..4 {\n        let Some(surfaces) = geometry.lod_xsurfaces[lod] else {\n            let count = usize::from(geometry.lod_numsurfs[lod]);\n            if count == 0 {\n                continue;\n            }\n            let name = stream\n                .cstr(geometry.lod_surface_names[lod]?)\n                .ok()?\n                .trim_start_matches(\',\');\n            let (source, source_lod) = shared?.0.get(name)?;\n            let (first, source_count) = source.lod_surf_span[*source_lod];\n            if usize::from(source_count) != count {\n                return None;\n            }\n            let start_surface = surface_vertex_ranges.len();\n            for offset in 0..count {\n                let n = usize::from(first) + offset;\n                let (v, vn) = source.surface_vertex_ranges[n];\n                let (ix, ixn) = source.surface_index_ranges[n];\n                if source.vert_skin[v..v + vn].iter().any(|skin| {\n                    skin.bones.iter().enumerate().any(|(index, bone)| {\n                        skin.weight_is_nonzero(index) && usize::from(*bone) >= geometry.num_bones\n                    })\n                }) {\n                    return None;\n                }\n                let base = positions.len();\n                let index_start = indices.len();\n                positions.extend_from_slice(&source.positions[v..v + vn]);\n\n                packed_vertices.extend_from_slice(&source.packed_vertices[v..v + vn]);\n                for skin in &source.vert_skin[v..v + vn] {\n                    if skin.is_rigid() {\n                        rigid_verts += 1;\n                    } else {\n                        blend_verts += 1;\n                    }\n                    vert_skin.push(*skin);\n                }\n                indices.extend(\n                    source.indices[ix..ix + ixn]\n                        .iter()\n                        .map(|index| base as u32 + *index - v as u32),\n                );\n                surface_vertex_ranges.push((base, vn));\n                surface_index_ranges.push((index_start, ixn));\n                surface_part_bits.push(source.surface_part_bits[n]);\n                surface_deformed.push(source.surface_deformed[n]);\n                surface_vert_list_count.push(source.surface_vert_list_count[n]);\n                let handle_slot = usize::from(geometry.lod_surf_index[lod]) + offset;\n                surface_materials.push(geometry.material_handles.and_then(|handles| {\n                    materials?.material_index(handles.at(handle_slot * stream.pointer_bytes()))\n                }));\n            }\n            lod_surf_span[lod] = (u16::try_from(start_surface).ok()?, source_count);\n            any_surf = true;\n            continue;\n        };\n        let count = usize::from(geometry.lod_numsurfs[lod]);\n        if count == 0 {\n            continue;\n        }\n        let start = surface_vertex_ranges.len();\n        let handle_base = usize::from(geometry.lod_surf_index[lod]);\n        for surface_index in 0..count {\n            let surface = surfaces.at(surface_index * stream.layout(sz::XSURFACE, 88));\n            let vertex_count = stream.u16_at(surface, 2).ok()? as usize;\n            let tri_count = stream.u16_at(surface, 4).ok()? as usize;\n            let deformed = stream.u8_at(surface, 1).ok()? != 0;\n            let vert_list_count = stream.u32_at(surface, stream.layout(32, 48)).ok()? as usize;\n            let mut part_bits = [0u32; 6];\n            for (i, word) in part_bits.iter_mut().enumerate() {\n                *word = stream.u32_at(surface, stream.layout(40, 64) + i * 4).ok()?;\n            }\n            let vertices = match stream.ptr_at(surface, stream.layout(28, 40)).ok()? {\n                ZonePtr::Offset(p) => stream.resolve_alias(p),\n                _ => return None,\n            };\n            let triangles = match stream.ptr_at(surface, stream.layout(12, 16)).ok()? {\n                ZonePtr::Offset(p) => stream.resolve_alias(p),\n                _ => return None,\n            };\n\n            let base = positions.len();\n            let index_start = indices.len();\n            let surface_skins = decode_surface_skin(\n                stream,\n                surface,\n                vertex_count,\n                vert_list_count,\n                geometry.num_bones,\n            )?;\n\n            for vertex_index in 0..vertex_count {\n                let vertex = vertices.at(vertex_index * sz::GFX_PACKED_VERTEX);\n                packed_vertices.push(copy_packed_vertex_iw4(stream, vertex)?);\n                positions.push([\n                    stream.f32_at(vertex, 0).ok()?,\n                    stream.f32_at(vertex, 4).ok()?,\n                    stream.f32_at(vertex, 8).ok()?,\n                ]);\n\n                let skin = surface_skins[vertex_index];\n                if skin.is_rigid() {\n                    rigid_verts += 1;\n                } else {\n                    blend_verts += 1;\n                }\n                vert_skin.push(skin);\n            }\n            for index_offset in 0..tri_count * 3 {\n                let index = stream.u16_at(triangles, index_offset * 2).ok()?;\n                if usize::from(index) >= vertex_count {\n                    return None;\n                }\n                indices.push(base as u32 + u32::from(index));\n            }\n            surface_vertex_ranges.push((base, vertex_count));\n            surface_index_ranges.push((index_start, indices.len() - index_start));\n            surface_part_bits.push(part_bits);\n            surface_deformed.push(Some(deformed));\n            surface_vert_list_count.push(Some(u32::try_from(vert_list_count).unwrap_or(u32::MAX)));\n            let handle_slot = handle_base.saturating_add(surface_index);\n            surface_materials.push(if handle_slot < geometry.material_handle_count {\n                geometry.material_handles.and_then(|handles| {\n                    materials?.material_index(handles.at(handle_slot * stream.pointer_bytes()))\n                })\n            } else {\n                None\n            });\n        }\n        let n = surface_vertex_ranges.len().saturating_sub(start);\n        lod_surf_span[lod] = (u16::try_from(start).ok()?, u16::try_from(n).ok()?);\n        any_surf = any_surf || n > 0;\n    }\n    if !any_surf {\n        return None;\n    }\n\n    Some(ModelSkel {\n        name,\n        bones,\n        bone_collision,\n        bone_names: bone_name_strs,\n        tag_view,\n        tag_weapon,\n        pose,\n        positions: positions.into(),\n        indices: indices.into(),\n        surface_materials,\n        surface_vertex_ranges,\n        surface_index_ranges,\n        surface_part_bits,\n        surface_deformed,\n        surface_vert_list_count,\n        vert_skin: vert_skin.into(),\n        rigid_verts,\n        blend_verts,\n        packed_vertices: packed_vertices.into(),\n        radius: geometry.radius,\n        bounds: match (geometry.bounds_mid, geometry.bounds_half) {\n            (Some(mid), Some(half))\n                if mid.iter().all(|v| v.is_finite())\n                    && half.iter().all(|v| v.is_finite() && *v >= 0.0) =>\n            {\n                Some((mid, half))\n            }\n            _ => None,\n        },\n        contents: Some(geometry.contents),\n        coll_lod: geometry.coll_lod,\n        coll_surfs: capture_coll_surfs(stream, geometry),\n        movement_brushes: Vec::new(),\n\n        mount_tag: None,\n        lod: Some(crate::ModelLodSelector::Iw4 {\n            lod_start: geometry.lod_start,\n            num_lods: geometry.num_lods,\n            lod_dist: geometry.lod_dist,\n        }),\n        lod_smc: Some(geometry.lod_smc),\n        lod_part_bits: Some(geometry.lod_part_bits),\n        lod_surf_span,\n    })\n}\n\nfn capture_bone_collision(\n    stream: &ZoneStream<\'_>,\n    geometry: XModelGeometry,\n    num_bones: usize,\n) -> Vec<Option<BoneCollision>> {\n    let (Some(info), Some(classes)) = (geometry.bone_info, geometry.part_classification) else {\n        return Vec::new();\n    };\n    (0..num_bones)\n        .map(|bone| {\n            let row = info.at(bone * sz::XBONE_INFO);\n            let radius_sq = stream.f32_at(row, 24).ok()?;\n            if radius_sq == 0.0 {\n                return None;\n            }\n            let midpoint = [\n                stream.f32_at(row, 0).ok()?,\n                stream.f32_at(row, 4).ok()?,\n                stream.f32_at(row, 8).ok()?,\n            ];\n            let half_size = [\n                stream.f32_at(row, 12).ok()?,\n                stream.f32_at(row, 16).ok()?,\n                stream.f32_at(row, 20).ok()?,\n            ];\n            let finite = radius_sq.is_finite()\n                && radius_sq > 0.0\n                && midpoint.iter().all(|value| value.is_finite())\n                && half_size\n                    .iter()\n                    .all(|value| value.is_finite() && *value >= 0.0);\n            let part_classification = stream.u8_at(classes, bone).ok()?;\n            finite.then_some(BoneCollision {\n                midpoint,\n                half_size,\n                radius_sq,\n                part_classification,\n            })\n        })\n        .collect()\n}\n\nfn capture_coll_surfs(\n    stream: &ZoneStream<\'_>,\n    geometry: XModelGeometry,\n) -> Vec<xmodel_runtime::CollSurfCollision> {\n    let Some(arr) = geometry.coll_surfs else {\n        return Vec::new();\n    };\n    (0..geometry.num_coll_surfs.max(0) as usize)\n        .filter_map(|i| {\n            let row = arr.at(i * stream.layout(sz::XMODEL_COLL_SURF, 48));\n            let midpoint = [\n                stream.f32_at(row, stream.layout(8, 12)).ok()?,\n                stream.f32_at(row, stream.layout(12, 16)).ok()?,\n                stream.f32_at(row, stream.layout(16, 20)).ok()?,\n            ];\n            let half_size = [\n                stream.f32_at(row, stream.layout(20, 24)).ok()?,\n                stream.f32_at(row, stream.layout(24, 28)).ok()?,\n                stream.f32_at(row, stream.layout(28, 32)).ok()?,\n            ];\n            if !midpoint.iter().all(|v| v.is_finite())\n                || !half_size.iter().all(|v| v.is_finite() && *v >= 0.0)\n            {\n                return None;\n            }\n            let bone = u16::try_from(stream.i32_at(row, stream.layout(32, 36)).ok()?).ok()?;\n            let contents = stream.u32_at(row, stream.layout(36, 40)).ok()?;\n            let surf_flags = stream.u32_at(row, stream.layout(40, 44)).ok()?;\n            let tris = capture_coll_tris(stream, row)?;\n            Some(xmodel_runtime::CollSurfCollision {\n                bone,\n                contents,\n                surf_flags,\n                midpoint,\n                half_size,\n                tris,\n            })\n        })\n        .collect()\n}\n\nfn capture_coll_tris(stream: &ZoneStream<\'_>, surf: Ptr) -> Option<Vec<xmodel_runtime::CollTri>> {\n    let num = stream.i32_at(surf, stream.layout(4, 8)).ok()?.max(0) as usize;\n    let arr = match stream.ptr_at(surf, 0).ok()? {\n        ZonePtr::Offset(p) => stream.resolve_alias(p),\n        ZonePtr::Null if num == 0 => return Some(Vec::new()),\n        _ => return Some(Vec::new()),\n    };\n    (0..num)\n        .map(|i| {\n            let t = arr.at(i * sz::XMODEL_COLL_TRI);\n            let f = |off: usize| stream.f32_at(t, off).ok();\n            Some(xmodel_runtime::CollTri {\n                plane: [f(0)?, f(4)?, f(8)?, f(12)?],\n                svec: [f(16)?, f(20)?, f(24)?, f(28)?],\n                tvec: [f(32)?, f(36)?, f(40)?, f(44)?],\n            })\n        })\n        .collect()\n}\n\nfn copy_packed_vertex_iw4(\n    stream: &ZoneStream<\'_>,\n    vertex: Ptr,\n) -> Option<[u8; sz::GFX_PACKED_VERTEX]> {\n    let bytes = stream.slice_at(vertex, 0, sz::GFX_PACKED_VERTEX).ok()?;\n    let mut packed = [0u8; sz::GFX_PACKED_VERTEX];\n    packed.copy_from_slice(bytes);\n    Some(packed)\n}\n\nfn copy_packed_vertex_t5(\n    stream: &fastfile_t5::ZoneStream<\'_>,\n    vertex: fastfile_t5::Ptr,\n) -> Option<[u8; sz::GFX_PACKED_VERTEX]> {\n    let bytes = stream.slice_at(vertex, 0, sz::GFX_PACKED_VERTEX).ok()?;\n    let mut packed = [0u8; sz::GFX_PACKED_VERTEX];\n    packed.copy_from_slice(bytes);\n    Some(packed)\n}\n\nfn copy_packed_vertex_iw5(\n    stream: &fastfile_iw5::ZoneStream<\'_>,\n    vertex: fastfile_iw5::Ptr,\n) -> Option<[u8; sz::GFX_PACKED_VERTEX]> {\n    let bytes = stream.slice_at(vertex, 0, sz::GFX_PACKED_VERTEX).ok()?;\n    let mut packed = [0u8; sz::GFX_PACKED_VERTEX];\n    packed.copy_from_slice(bytes);\n    Some(packed)\n}\n\nfn capture_pose_src(\n    stream: &ZoneStream<\'_>,\n    geometry: &XModelGeometry,\n    bone_names: &[String],\n    bones: &[BoneBind],\n    num_child: usize,\n) -> Option<ModelPoseSrc> {\n    let parent_list = if num_child == 0 {\n        Vec::new()\n    } else {\n        let arr = geometry.parent_list?;\n        (0..num_child)\n            .map(|i| stream.u8_at(arr, i).ok())\n            .collect::<Option<Vec<_>>>()?\n    };\n    let quats = if num_child == 0 {\n        Vec::new()\n    } else {\n        let arr = geometry.quats?;\n        (0..num_child)\n            .map(|i| {\n                let o = i * sz::XMODEL_QUAT;\n                Some([\n                    stream.i16_at(arr, o).ok()?,\n                    stream.i16_at(arr, o + 2).ok()?,\n                    stream.i16_at(arr, o + 4).ok()?,\n                    stream.i16_at(arr, o + 6).ok()?,\n                ])\n            })\n            .collect::<Option<Vec<_>>>()?\n    };\n    let trans = if num_child == 0 {\n        Vec::new()\n    } else {\n        let arr = geometry.trans?;\n        (0..num_child)\n            .map(|i| {\n                let o = i * 12;\n                Some([\n                    stream.f32_at(arr, o).ok()?,\n                    stream.f32_at(arr, o + 4).ok()?,\n                    stream.f32_at(arr, o + 8).ok()?,\n                ])\n            })\n            .collect::<Option<Vec<_>>>()?\n    };\n    let base_mat = bones\n        .iter()\n        .map(|b| {\n            (\n                Quat::from_xyzw(b.quat[0], b.quat[1], b.quat[2], b.quat[3]),\n                Vec3::from_array(b.trans),\n            )\n        })\n        .collect();\n    Some(ModelPoseSrc {\n        name: geometry\n            .name\n            .and_then(|p| stream.cstr(p).ok())\n            .unwrap_or("")\n            .to_owned(),\n        num_bones: geometry.num_bones,\n        num_root_bones: geometry.num_root_bones,\n        scale: geometry.scale,\n        no_scale_part_bits: geometry.no_scale_part_bits,\n        bone_names: bone_names.to_vec(),\n        parent_list,\n        quats,\n        trans,\n        base_mat,\n        root_rest: None,\n    })\n}\n\nfn decode_surface_skin(\n    stream: &ZoneStream<\'_>,\n    surface: fastfile_iw4::Ptr,\n    vertex_count: usize,\n    vert_list_count: usize,\n    num_bones: usize,\n) -> Option<Vec<VertSkin>> {\n    let mut skins = vec![VertSkin::default(); vertex_count];\n    let bone_at = |raw: u16| -> Option<u8> {\n        if raw % BONE_STRIDE != 0 {\n            return None;\n        }\n        let bone = raw / BONE_STRIDE;\n        ((bone as usize) < num_bones)\n            .then(|| u8::try_from(bone).ok())\n            .flatten()\n    };\n\n    if vert_list_count > 0 {\n        if let Ok(ZonePtr::Offset(list_ptr)) = stream.ptr_at(surface, stream.layout(36, 56)) {\n            let list = stream.resolve_alias(list_ptr);\n            let mut vertex = 0usize;\n            for i in 0..vert_list_count {\n                let entry = list.at(i * stream.layout(sz::XRIGID_VERT_LIST, 16));\n                let bone_offset = stream.u16_at(entry, 0).ok()?;\n                let run = stream.u16_at(entry, 2).ok()? as usize;\n                let bone = bone_at(bone_offset)?;\n                for _ in 0..run {\n                    if vertex >= vertex_count {\n                        break;\n                    }\n                    skins[vertex] = VertSkin::rigid(bone);\n                    vertex += 1;\n                }\n            }\n            if vertex == vertex_count {\n                return Some(skins);\n            }\n        }\n    }\n\n    let vi = surface.at(stream.layout(16, 24));\n    let counts = [\n        stream.i16_at(vi, 0).ok()?.max(0) as usize,\n        stream.i16_at(vi, 2).ok()?.max(0) as usize,\n        stream.i16_at(vi, 4).ok()?.max(0) as usize,\n        stream.i16_at(vi, 6).ok()?.max(0) as usize,\n    ];\n    let blend_ptr = match stream.ptr_at(vi, 8).ok()? {\n        ZonePtr::Offset(p) => stream.resolve_alias(p),\n        ZonePtr::Null if counts.iter().all(|&c| c == 0) => {\n            if num_bones > 1 {\n                diag::warn!(\n                    Zone,\n                    "xsurface skin: {vertex_count} verts, vertListCount={vert_list_count}, \\\n                     no blend buckets, {num_bones} bones — cannot resolve ownership (typed gap)"\n                );\n            }\n            for skin in &mut skins {\n                *skin = VertSkin::rigid(0);\n            }\n            return Some(skins);\n        }\n        _ => return None,\n    };\n\n    let mut cursor = 0usize;\n    let mut vertex = 0usize;\n    let take = |cursor: &mut usize, n: usize| -> Option<()> {\n        *cursor = cursor.checked_add(n)?;\n        Some(())\n    };\n    for (bucket, count) in counts.iter().enumerate() {\n        let influences = bucket + 1;\n        for _ in 0..*count {\n            let words = 1 + (influences - 1) * 2;\n            let start = cursor;\n            take(&mut cursor, words)?;\n            let mut skin = VertSkin::default();\n            let b0 = stream.u16_at(blend_ptr, start * 2).ok()?;\n            skin.bones[0] = bone_at(b0)?;\n            let mut remaining = dpvs_iw4::SKIN_BLEND_WEIGHT_ONE as f32;\n            for extra in 1..influences {\n                let off = start + 1 + (extra - 1) * 2;\n                let b = stream.u16_at(blend_ptr, off * 2).ok()?;\n                let raw = stream.u16_at(blend_ptr, off * 2 + 2).ok()?;\n                let w = dpvs_iw4::skin_blend_weight(raw);\n                skin.bones[extra] = bone_at(b)?;\n                skin.set_weight(extra, w);\n                skin.set_extra_weight(extra, raw);\n                remaining -= w;\n            }\n            skin.set_weight(0, remaining);\n            if vertex >= vertex_count {\n                return None;\n            }\n            skins[vertex] = skin;\n            vertex += 1;\n        }\n    }\n    if vertex != vertex_count {\n        return None;\n    }\n    Some(skins)\n}\n\npub fn capture_fpv_skel_t5(\n    stream: &fastfile_t5::ZoneStream<\'_>,\n    strings: &fastfile_t5::ScriptStrings,\n    geometry: fastfile_t5::XModelGeometry,\n    materials: Option<&MaterialCatalog>,\n) -> Option<ModelSkel> {\n    let name = geometry.name.and_then(|p| stream.cstr(p).ok())?.to_owned();\n    if model_kind(&name) != Some(ModelKind::Fpv) {\n        return None;\n    }\n    capture_model_skel_t5(stream, strings, geometry, name, materials)\n}\n\npub fn capture_body_skel_t5(\n    stream: &fastfile_t5::ZoneStream<\'_>,\n    strings: &fastfile_t5::ScriptStrings,\n    geometry: fastfile_t5::XModelGeometry,\n    materials: Option<&MaterialCatalog>,\n) -> Option<ModelSkel> {\n    let name = geometry.name.and_then(|p| stream.cstr(p).ok())?.to_owned();\n    if model_kind(&name) != Some(ModelKind::Soldier) {\n        return None;\n    }\n    capture_model_skel_t5(stream, strings, geometry, name, materials)\n}\n\npub fn capture_world_weapon_skel_t5(\n    stream: &fastfile_t5::ZoneStream<\'_>,\n    strings: &fastfile_t5::ScriptStrings,\n    geometry: fastfile_t5::XModelGeometry,\n    materials: Option<&MaterialCatalog>,\n) -> Option<ModelSkel> {\n    let name = geometry.name.and_then(|p| stream.cstr(p).ok())?.to_owned();\n    if model_kind(&name) != Some(ModelKind::WorldWeapon) {\n        return None;\n    }\n    capture_model_skel_t5(stream, strings, geometry, name, materials)\n}\n\npub fn capture_xmodel_skel_t5(\n    stream: &fastfile_t5::ZoneStream<\'_>,\n    strings: &fastfile_t5::ScriptStrings,\n    geometry: fastfile_t5::XModelGeometry,\n    materials: &MaterialCatalog,\n) -> Option<ModelSkel> {\n    let name = geometry.name.and_then(|p| stream.cstr(p).ok())?.to_owned();\n    capture_model_skel_t5(stream, strings, geometry, name, Some(materials))\n}\n\nfn capture_model_skel_t5(\n    stream: &fastfile_t5::ZoneStream<\'_>,\n    strings: &fastfile_t5::ScriptStrings,\n    geometry: fastfile_t5::XModelGeometry,\n    name: String,\n    materials: Option<&MaterialCatalog>,\n) -> Option<ModelSkel> {\n    const XSURFACE: usize = 68;\n    const DOBJ_ANIM_MAT: usize = 32;\n    const GFX_PACKED_VERTEX: usize = 32;\n    const XRIGID_VERT_LIST: usize = 12;\n\n    let surfaces = geometry.surfaces?;\n    let bone_names = geometry.bone_names?;\n    let base_mat = geometry.base_mat?;\n\n    let mut bones = Vec::with_capacity(geometry.num_bones);\n    let mut bone_name_strs = Vec::with_capacity(geometry.num_bones);\n    let mut tag_view = None;\n    let mut tag_weapon = None;\n    for i in 0..geometry.num_bones {\n        let id = stream.u16_at(bone_names, i * 2).ok()?;\n        let bone_name = strings.get(stream, id).unwrap_or("").to_owned();\n        if bone_name == "tag_view" && tag_view.is_none() {\n            tag_view = Some(i);\n        }\n        if bone_name == "tag_weapon" && tag_weapon.is_none() {\n            tag_weapon = Some(i);\n        }\n        bone_name_strs.push(bone_name);\n        let m = base_mat.at(i * DOBJ_ANIM_MAT);\n        bones.push(BoneBind {\n            quat: [\n                stream.f32_at(m, 0).ok()?,\n                stream.f32_at(m, 4).ok()?,\n                stream.f32_at(m, 8).ok()?,\n                stream.f32_at(m, 12).ok()?,\n            ],\n            trans: [\n                stream.f32_at(m, 16).ok()?,\n                stream.f32_at(m, 20).ok()?,\n                stream.f32_at(m, 24).ok()?,\n            ],\n        });\n    }\n\n    let num_child = geometry.num_bones.saturating_sub(geometry.num_root_bones);\n    let pose = capture_pose_src_t5(stream, &geometry, &bone_name_strs, &bones, num_child);\n\n    let mut positions = Vec::new();\n    let mut indices = Vec::new();\n    let mut surface_materials = Vec::with_capacity(geometry.surface_count);\n    let mut surface_vertex_ranges = Vec::with_capacity(geometry.surface_count);\n    let mut surface_index_ranges = Vec::with_capacity(geometry.surface_count);\n    let mut vert_skin = Vec::new();\n    let mut rigid_verts = 0usize;\n    let mut blend_verts = 0usize;\n    let mut packed_vertices = Vec::new();\n    let mut surface_part_bits = Vec::with_capacity(geometry.surface_count);\n    let mut surface_deformed = Vec::with_capacity(geometry.surface_count);\n    let mut surface_vert_list_count = Vec::with_capacity(geometry.surface_count);\n\n    for surface_index in 0..geometry.surface_count {\n        let surface = surfaces.at(surface_index * XSURFACE);\n        let vert_list_count = stream.u8_at(surface, 1).ok()? as usize;\n\n        surface_deformed.push(Some(stream.u16_at(surface, 2).ok()? & 0x80 != 0));\n        surface_vert_list_count.push(Some(vert_list_count as u32));\n        let vertex_count = stream.u16_at(surface, 4).ok()? as usize;\n        let tri_count = stream.u16_at(surface, 6).ok()? as usize;\n        let vertices = match stream.ptr_at(surface, 32).ok()? {\n            fastfile_t5::ZonePtr::Offset(p) => stream.resolve_alias(p),\n            _ => return None,\n        };\n        let triangles = match stream.ptr_at(surface, 12).ok()? {\n            fastfile_t5::ZonePtr::Offset(p) => stream.resolve_alias(p),\n            _ => return None,\n        };\n        let mut part_bits = [0u32; 6];\n        for i in 0..fastfile_t5::size::XSURFACE_PART_BITS_WORDS {\n            part_bits[i] = stream\n                .u32_at(surface, fastfile_t5::size::XSURFACE_PART_BITS_OFF + i * 4)\n                .ok()?;\n        }\n\n        let base = positions.len();\n        let index_start = indices.len();\n        let surface_skins = decode_surface_skin_t5(\n            stream,\n            surface,\n            vertex_count,\n            vert_list_count,\n            geometry.num_bones,\n            XRIGID_VERT_LIST,\n        )?;\n\n        for vertex_index in 0..vertex_count {\n            let vertex = vertices.at(vertex_index * GFX_PACKED_VERTEX);\n            packed_vertices.push(copy_packed_vertex_t5(stream, vertex)?);\n            positions.push([\n                stream.f32_at(vertex, 0).ok()?,\n                stream.f32_at(vertex, 4).ok()?,\n                stream.f32_at(vertex, 8).ok()?,\n            ]);\n\n            let skin = surface_skins[vertex_index];\n            if skin.is_rigid() {\n                rigid_verts += 1;\n            } else {\n                blend_verts += 1;\n            }\n            vert_skin.push(skin);\n        }\n        for index_offset in 0..tri_count * 3 {\n            let index = stream.u16_at(triangles, index_offset * 2).ok()?;\n            if usize::from(index) >= vertex_count {\n                return None;\n            }\n            indices.push(base as u32 + u32::from(index));\n        }\n        surface_vertex_ranges.push((base, vertex_count));\n        surface_index_ranges.push((index_start, indices.len() - index_start));\n        surface_part_bits.push(part_bits);\n        surface_materials.push(geometry.material_handles.and_then(|handles| {\n            materials?.material_index(Ptr {\n                block: handles.block,\n                offset: handles.offset + (surface_index * 4) as u32,\n            })\n        }));\n    }\n\n    let (bone_collision, coll_surfs) = capture_collision_t5(stream, geometry).or_else(|| {\n        diag::warn!(Zone, "T5 XModel {name}: malformed collision payload");\n        None\n    })?;\n    Some(ModelSkel {\n        name,\n        bones,\n        bone_collision,\n        bone_names: bone_name_strs,\n        tag_view,\n        tag_weapon,\n        pose,\n        positions: positions.into(),\n        indices: indices.into(),\n        surface_materials,\n        surface_vertex_ranges,\n        surface_index_ranges,\n        surface_part_bits,\n        surface_deformed,\n        surface_vert_list_count,\n        vert_skin: vert_skin.into(),\n        rigid_verts,\n        blend_verts,\n        packed_vertices: packed_vertices.into(),\n        radius: geometry.radius,\n        bounds: None,\n        contents: Some(geometry.contents),\n        coll_lod: geometry.coll_lod,\n        coll_surfs,\n        movement_brushes: capture_movement_brushes_t5(stream, geometry)?,\n\n        mount_tag: None,\n        lod: Some(crate::ModelLodSelector::T5 {\n            num_lods: geometry.num_lods,\n            lod_dist: geometry.lod_dist,\n        }),\n        lod_smc: None,\n        lod_part_bits: None,\n        lod_surf_span: geometry.lod_surf_span,\n    })\n}\n\nfn capture_movement_brushes_t5(\n    stream: &fastfile_t5::ZoneStream<\'_>,\n    geometry: fastfile_t5::XModelGeometry,\n) -> Option<Vec<xmodel_runtime::ModelMovementBrush>> {\n    use fastfile_t5::{Ptr, ZonePtr, size};\n    let pointer = |p: Ptr, offset| match stream.ptr_at(p, offset).ok()? {\n        ZonePtr::Offset(p) => Some(stream.resolve_alias(p)),\n        _ => None,\n    };\n    if geometry.collision_map_count == 0 {\n        return Some(Vec::new());\n    }\n    let maps = geometry.collision_maps?;\n    if stream.ptr_at(maps, 0).ok()? == ZonePtr::Null {\n        return Some(Vec::new());\n    }\n    let list = pointer(maps, 0)?;\n    let count = stream.u32_at(list, 0).ok()? as usize;\n    if count == 0 {\n        return Some(Vec::new());\n    }\n    let geoms = pointer(list, 4)?;\n    let mut brushes = Vec::new();\n    for i in 0..count {\n        let geom = geoms.at(i * size::PHYS_GEOM_INFO);\n        if stream.ptr_at(geom, 0).ok()? == ZonePtr::Null {\n            continue;\n        }\n        let brush = pointer(geom, 0)?;\n        let mut planes = Vec::new();\n        let mut plane_surface_flags = Vec::new();\n        for side in 0..2 {\n            for axis in 0..3 {\n                let mut plane = [0.0; 4];\n                plane[axis] = if side == 0 { -1.0 } else { 1.0 };\n                plane[3] = stream.f32_at(brush, side * 16 + axis * 4).ok()? * plane[axis];\n                planes.push(plane);\n                plane_surface_flags.push(stream.u32_at(brush, 60 + (side * 3 + axis) * 4).ok()?);\n            }\n        }\n        let side_count = stream\n            .u32_at(brush, size::BRUSH_WRAPPER_NUMSIDES_OFF)\n            .ok()? as usize;\n        if side_count != 0 {\n            let sides = pointer(brush, size::BRUSH_WRAPPER_SIDES_OFF)?;\n            for j in 0..side_count {\n                let side = sides.at(j * size::CBRUSH_SIDE);\n                let plane = pointer(side, 0)?;\n                planes.push([\n                    stream.f32_at(plane, 0).ok()?,\n                    stream.f32_at(plane, 4).ok()?,\n                    stream.f32_at(plane, 8).ok()?,\n                    stream.f32_at(plane, 12).ok()?,\n                ]);\n                plane_surface_flags.push(stream.u32_at(side, 8).ok()?);\n            }\n        }\n        brushes.push(xmodel_runtime::ModelMovementBrush {\n            planes,\n            contents: stream.u32_at(brush, 12).ok()?,\n            plane_surface_flags,\n        });\n    }\n    Some(brushes)\n}\n\n#[allow(clippy::type_complexity)]\nfn capture_collision_t5(\n    stream: &fastfile_t5::ZoneStream<\'_>,\n    geometry: fastfile_t5::XModelGeometry,\n) -> Option<(\n    Vec<Option<BoneCollision>>,\n    Vec<xmodel_runtime::CollSurfCollision>,\n)> {\n    use fastfile_t5::{Ptr, ZonePtr, size as t5sz};\n    let bounds = |row: Ptr, off| {\n        let mut midpoint = [0.0; 3];\n        let mut half_size = [0.0; 3];\n        for axis in 0..3 {\n            let min = stream.f32_at(row, off + axis * 4).ok()?;\n            let max = stream.f32_at(row, off + 12 + axis * 4).ok()?;\n            if !min.is_finite() || !max.is_finite() || min > max {\n                return None;\n            }\n            midpoint[axis] = (min + max) * 0.5;\n            half_size[axis] = (max - min) * 0.5;\n        }\n        Some((midpoint, half_size))\n    };\n    let mut bones = Vec::new();\n    if let Some(info) = geometry.bone_info {\n        let classes = geometry.part_classification?;\n        for bone in 0..geometry.num_bones {\n            let row = info.at(bone * t5sz::XBONE_INFO);\n\n            let radius_sq = stream.f32_at(row, 36).ok()?;\n            if radius_sq == 0.0 {\n                bones.push(None);\n                continue;\n            }\n            if !radius_sq.is_finite() || radius_sq < 0.0 {\n                return None;\n            }\n            let (midpoint, half_size) = bounds(row, 0)?;\n            bones.push(Some(BoneCollision {\n                midpoint,\n                half_size,\n                radius_sq,\n                part_classification: stream.u8_at(classes, bone).ok()?,\n            }));\n        }\n    }\n    let mut surfs = Vec::with_capacity(geometry.num_coll_surfs);\n    if geometry.num_coll_surfs != 0 {\n        let arr = geometry.coll_surfs?;\n        for i in 0..geometry.num_coll_surfs {\n            let row = arr.at(i * t5sz::XMODEL_COLL_SURF);\n            let (midpoint, half_size) = bounds(row, 8)?;\n            let bone = u16::try_from(stream.i32_at(row, 32).ok()?).ok()?;\n            if usize::from(bone) >= geometry.num_bones {\n                return None;\n            }\n            let num = usize::try_from(stream.i32_at(row, 4).ok()?).ok()?;\n            let mut tris = Vec::with_capacity(num);\n            if num != 0 {\n                let ZonePtr::Offset(arr) = stream.ptr_at(row, 0).ok()? else {\n                    return None;\n                };\n                let arr = stream.resolve_alias(arr);\n                for i in 0..num {\n                    let tri = arr.at(i * t5sz::XMODEL_COLL_TRI);\n                    let vec4 = |off| {\n                        let mut v = [0.0; 4];\n                        for (j, value) in v.iter_mut().enumerate() {\n                            *value = stream.f32_at(tri, off + j * 4).ok()?;\n                            if !value.is_finite() {\n                                return None;\n                            }\n                        }\n                        Some(v)\n                    };\n                    tris.push(xmodel_runtime::CollTri {\n                        plane: vec4(0)?,\n                        svec: vec4(16)?,\n                        tvec: vec4(32)?,\n                    });\n                }\n            }\n            surfs.push(xmodel_runtime::CollSurfCollision {\n                bone,\n                contents: stream.u32_at(row, 36).ok()?,\n                surf_flags: stream.u32_at(row, 40).ok()?,\n                midpoint,\n                half_size,\n                tris,\n            });\n        }\n    }\n    Some((bones, surfs))\n}\n\nfn capture_pose_src_t5(\n    stream: &fastfile_t5::ZoneStream<\'_>,\n    geometry: &fastfile_t5::XModelGeometry,\n    bone_names: &[String],\n    bones: &[BoneBind],\n    num_child: usize,\n) -> Option<ModelPoseSrc> {\n    use fastfile_t5::size as t5sz;\n\n    let parent_list = if num_child == 0 {\n        Vec::new()\n    } else {\n        let arr = geometry.parent_list?;\n        (0..num_child)\n            .map(|i| stream.u8_at(arr, i).ok())\n            .collect::<Option<Vec<_>>>()?\n    };\n    let quats = if num_child == 0 {\n        Vec::new()\n    } else {\n        let arr = geometry.quats?;\n        (0..num_child)\n            .map(|i| {\n                let o = i * t5sz::XMODEL_QUAT;\n                Some([\n                    stream.i16_at(arr, o).ok()?,\n                    stream.i16_at(arr, o + 2).ok()?,\n                    stream.i16_at(arr, o + 4).ok()?,\n                    stream.i16_at(arr, o + 6).ok()?,\n                ])\n            })\n            .collect::<Option<Vec<_>>>()?\n    };\n    let trans = if num_child == 0 {\n        Vec::new()\n    } else {\n        let arr = geometry.trans?;\n        (0..num_child)\n            .map(|i| {\n                let o = i * t5sz::XMODEL_TRANS_STRIDE;\n                Some([\n                    stream.f32_at(arr, o).ok()?,\n                    stream.f32_at(arr, o + 4).ok()?,\n                    stream.f32_at(arr, o + 8).ok()?,\n                ])\n            })\n            .collect::<Option<Vec<_>>>()?\n    };\n    let base_mat: Vec<(Quat, Vec3)> = bones\n        .iter()\n        .map(|b| {\n            (\n                Quat::from_xyzw(b.quat[0], b.quat[1], b.quat[2], b.quat[3]),\n                Vec3::from_array(b.trans),\n            )\n        })\n        .collect();\n\n    Some(ModelPoseSrc {\n        name: geometry\n            .name\n            .and_then(|p| stream.cstr(p).ok())\n            .unwrap_or("")\n            .to_owned(),\n        num_bones: geometry.num_bones,\n        num_root_bones: geometry.num_root_bones,\n        scale: 1.0,\n        no_scale_part_bits: [0; 6],\n        bone_names: bone_names.to_vec(),\n        parent_list,\n        quats,\n        trans,\n        base_mat,\n        root_rest: None,\n    })\n}\n\nfn decode_surface_skin_t5(\n    stream: &fastfile_t5::ZoneStream<\'_>,\n    surface: fastfile_t5::Ptr,\n    vertex_count: usize,\n    vert_list_count: usize,\n    num_bones: usize,\n    rigid_stride: usize,\n) -> Option<Vec<VertSkin>> {\n    let mut skins = vec![VertSkin::default(); vertex_count];\n    let bone_at = |raw: u16| -> Option<u8> {\n        if raw % BONE_STRIDE != 0 {\n            return None;\n        }\n        let bone = raw / BONE_STRIDE;\n        ((bone as usize) < num_bones)\n            .then(|| u8::try_from(bone).ok())\n            .flatten()\n    };\n\n    if vert_list_count > 0 {\n        if let Ok(fastfile_t5::ZonePtr::Offset(list_ptr)) = stream.ptr_at(surface, 40) {\n            let list = stream.resolve_alias(list_ptr);\n            let mut vertex = 0usize;\n            for i in 0..vert_list_count {\n                let entry = list.at(i * rigid_stride);\n                let bone_offset = stream.u16_at(entry, 0).ok()?;\n                let run = stream.u16_at(entry, 2).ok()? as usize;\n                let bone = bone_at(bone_offset)?;\n                for _ in 0..run {\n                    if vertex >= vertex_count {\n                        break;\n                    }\n                    skins[vertex] = VertSkin::rigid(bone);\n                    vertex += 1;\n                }\n            }\n            if vertex == vertex_count {\n                return Some(skins);\n            }\n        }\n    }\n\n    let vi = surface.at(16);\n    let counts = [\n        stream.i16_at(vi, 0).ok()?.max(0) as usize,\n        stream.i16_at(vi, 2).ok()?.max(0) as usize,\n        stream.i16_at(vi, 4).ok()?.max(0) as usize,\n        stream.i16_at(vi, 6).ok()?.max(0) as usize,\n    ];\n    let blend_ptr = match stream.ptr_at(vi, 8).ok()? {\n        fastfile_t5::ZonePtr::Offset(p) => stream.resolve_alias(p),\n        fastfile_t5::ZonePtr::Null if counts.iter().all(|&c| c == 0) => {\n            for skin in &mut skins {\n                *skin = VertSkin::rigid(0);\n            }\n            return Some(skins);\n        }\n        _ => return None,\n    };\n\n    let mut cursor = 0usize;\n    let mut vertex = 0usize;\n    let take = |cursor: &mut usize, n: usize| -> Option<()> {\n        *cursor = cursor.checked_add(n)?;\n        Some(())\n    };\n    for (bucket, count) in counts.iter().enumerate() {\n        let influences = bucket + 1;\n        for _ in 0..*count {\n            let words = 1 + (influences - 1) * 2;\n            let start = cursor;\n            take(&mut cursor, words)?;\n            let mut skin = VertSkin::default();\n            let b0 = stream.u16_at(blend_ptr, start * 2).ok()?;\n            skin.bones[0] = bone_at(b0)?;\n            let mut remaining = 1.0f32;\n            for extra in 1..influences {\n                let off = start + 1 + (extra - 1) * 2;\n                let b = stream.u16_at(blend_ptr, off * 2).ok()?;\n                let raw = stream.u16_at(blend_ptr, off * 2 + 2).ok()?;\n                let w = dpvs_iw4::skin_blend_weight(raw);\n                skin.bones[extra] = bone_at(b)?;\n                skin.set_weight(extra, w);\n                skin.set_extra_weight(extra, raw);\n                remaining -= w;\n            }\n            skin.set_weight(0, remaining);\n            if vertex >= vertex_count {\n                return None;\n            }\n            skins[vertex] = skin;\n            vertex += 1;\n        }\n    }\n    if vertex != vertex_count {\n        return None;\n    }\n    Some(skins)\n}\n\npub fn capture_fpv_skel_iw5(\n    stream: &fastfile_iw5::ZoneStream<\'_>,\n    strings: &fastfile_iw5::ScriptStrings,\n    geometry: fastfile_iw5::XModelGeometry,\n    materials: Option<&MaterialCatalog>,\n) -> Option<FpvSkel> {\n    let name = geometry.name.and_then(|p| stream.cstr(p).ok())?.to_owned();\n    if model_kind(&name) != Some(ModelKind::Fpv) {\n        return None;\n    }\n    capture_model_skel_iw5(stream, strings, geometry, name, materials, None)\n}\n\npub fn capture_world_weapon_skel_iw5(\n    stream: &fastfile_iw5::ZoneStream<\'_>,\n    strings: &fastfile_iw5::ScriptStrings,\n    geometry: fastfile_iw5::XModelGeometry,\n    materials: Option<&MaterialCatalog>,\n) -> Option<ModelSkel> {\n    let name = geometry.name.and_then(|p| stream.cstr(p).ok())?.to_owned();\n    if model_kind(&name) != Some(ModelKind::WorldWeapon) {\n        return None;\n    }\n    capture_model_skel_iw5(stream, strings, geometry, name, materials, None)\n}\n\npub fn capture_xmodel_skel_iw5(\n    stream: &fastfile_iw5::ZoneStream<\'_>,\n    strings: &fastfile_iw5::ScriptStrings,\n    geometry: fastfile_iw5::XModelGeometry,\n    materials: &MaterialCatalog,\n) -> Option<ModelSkel> {\n    let name = geometry.name.and_then(|p| stream.cstr(p).ok())?.to_owned();\n    capture_model_skel_iw5(stream, strings, geometry, name, Some(materials), None)\n}\n\npub fn capture_xmodel_skel_iw5_with_shared(\n    stream: &fastfile_iw5::ZoneStream<\'_>,\n    strings: &fastfile_iw5::ScriptStrings,\n    geometry: fastfile_iw5::XModelGeometry,\n    materials: &MaterialCatalog,\n    shared: &SharedXModelSurfaces,\n) -> Option<ModelSkel> {\n    let name = geometry.name.and_then(|p| stream.cstr(p).ok())?.to_owned();\n    capture_model_skel_iw5(\n        stream,\n        strings,\n        geometry,\n        name,\n        Some(materials),\n        Some(shared),\n    )\n}\n\npub fn capture_body_skel_iw5(\n    stream: &fastfile_iw5::ZoneStream<\'_>,\n    strings: &fastfile_iw5::ScriptStrings,\n    geometry: fastfile_iw5::XModelGeometry,\n    materials: Option<&MaterialCatalog>,\n) -> Option<ModelSkel> {\n    let name = geometry.name.and_then(|p| stream.cstr(p).ok())?.to_owned();\n    if model_kind(&name) != Some(ModelKind::Soldier) {\n        return None;\n    }\n    capture_model_skel_iw5(stream, strings, geometry, name, materials, None)\n}\n\nfn capture_model_skel_iw5(\n    stream: &fastfile_iw5::ZoneStream<\'_>,\n    strings: &fastfile_iw5::ScriptStrings,\n    geometry: fastfile_iw5::XModelGeometry,\n    name: String,\n    materials: Option<&MaterialCatalog>,\n    shared: Option<&SharedXModelSurfaces>,\n) -> Option<ModelSkel> {\n    use fastfile_iw5::size as iw5sz;\n\n    let bone_names = geometry.bone_names?;\n    let base_mat = geometry.base_mat?;\n\n    let mut bones = Vec::with_capacity(geometry.num_bones);\n    let mut bone_name_strs = Vec::with_capacity(geometry.num_bones);\n    let mut tag_view = None;\n    let mut tag_weapon = None;\n    for i in 0..geometry.num_bones {\n        let id = stream.u16_at(bone_names, i * 2).ok()?;\n        let bone_name = strings.get(stream, id).unwrap_or("").to_owned();\n        if bone_name == "tag_view" && tag_view.is_none() {\n            tag_view = Some(i);\n        }\n        if bone_name == "tag_weapon" && tag_weapon.is_none() {\n            tag_weapon = Some(i);\n        }\n        bone_name_strs.push(bone_name);\n        let m = base_mat.at(i * iw5sz::DOBJ_ANIM_MAT);\n        bones.push(BoneBind {\n            quat: [\n                stream.f32_at(m, 0).ok()?,\n                stream.f32_at(m, 4).ok()?,\n                stream.f32_at(m, 8).ok()?,\n                stream.f32_at(m, 12).ok()?,\n            ],\n            trans: [\n                stream.f32_at(m, 16).ok()?,\n                stream.f32_at(m, 20).ok()?,\n                stream.f32_at(m, 24).ok()?,\n            ],\n        });\n    }\n\n    let num_child = geometry.num_bones.saturating_sub(geometry.num_root_bones);\n    let pose = capture_pose_src_iw5(stream, &geometry, &bone_name_strs, &bones, num_child);\n    let bone_collision = capture_bone_collision_iw5(stream, geometry);\n    let material_at = |surface_index: usize| {\n        geometry.material_handles.and_then(|handles| {\n            materials?.material_index(Ptr {\n                block: handles.block,\n                offset: handles.offset + (surface_index * stream.pointer_bytes()) as u32,\n            })\n        })\n    };\n\n    let Some(surfaces) = geometry.surfaces else {\n        let surfaces_name = stream\n            .cstr(geometry.surfaces_name?)\n            .ok()?\n            .trim_start_matches(\',\');\n        let (source, _) = shared?.0.get(surfaces_name)?;\n        if source.surface_vertex_ranges.len() != geometry.surface_count\n            || source.vert_skin.iter().any(|skin| {\n                skin.bones.iter().enumerate().any(|(index, bone)| {\n                    skin.weight_is_nonzero(index) && usize::from(*bone) >= geometry.num_bones\n                })\n            })\n        {\n            return None;\n        }\n        return Some(ModelSkel {\n            name,\n            bones,\n            bone_names: bone_name_strs,\n            tag_view,\n            tag_weapon,\n            pose,\n            bone_collision,\n            surface_materials: (0..geometry.surface_count).map(material_at).collect(),\n            radius: geometry.radius,\n            ..(**source).clone()\n        });\n    };\n\n    let mut positions = Vec::new();\n    let mut indices = Vec::new();\n    let mut packed_vertices = Vec::new();\n    let mut surface_materials = Vec::with_capacity(geometry.surface_count);\n    let mut surface_vertex_ranges = Vec::with_capacity(geometry.surface_count);\n    let mut surface_index_ranges = Vec::with_capacity(geometry.surface_count);\n    let mut surface_part_bits = Vec::with_capacity(geometry.surface_count);\n    let mut surface_deformed = Vec::with_capacity(geometry.surface_count);\n    let mut surface_vert_list_count = Vec::with_capacity(geometry.surface_count);\n    let mut vert_skin = Vec::new();\n    let mut rigid_verts = 0usize;\n    let mut blend_verts = 0usize;\n\n    for surface_index in 0..geometry.surface_count {\n        let surface = surfaces.at(surface_index * stream.layout(iw5sz::XSURFACE, 88));\n        let vertex_count = stream.u16_at(surface, 2).ok()? as usize;\n        let tri_count = stream.u16_at(surface, 4).ok()? as usize;\n        let vert_list_count = stream\n            .u32_at(\n                surface,\n                stream.layout(iw5sz::XSURFACE_VERT_LIST_COUNT_OFF, 48),\n            )\n            .ok()? as usize;\n        let flags = stream.u8_at(surface, iw5sz::XSURFACE_FLAGS_OFF).ok()?;\n        surface_deformed.push(Some(flags & iw5sz::XSURFACE_FLAG_DEFORMED != 0));\n        surface_vert_list_count.push(Some(u32::try_from(vert_list_count).ok()?));\n\n        let part_bits_off = stream.layout(44, 64);\n        let mut part_bits = [0u32; 6];\n        for (i, word) in part_bits.iter_mut().enumerate() {\n            *word = stream.u32_at(surface, part_bits_off + i * 4).ok()?;\n        }\n        surface_part_bits.push(part_bits);\n        let vertices = match stream\n            .ptr_at(surface, stream.layout(iw5sz::XSURFACE_VERTS0_OFF, 40))\n            .ok()?\n        {\n            fastfile_iw5::ZonePtr::Offset(p) => stream.resolve_alias(p),\n            _ => return None,\n        };\n        let triangles = match stream\n            .ptr_at(surface, iw5sz::XSURFACE_TRI_INDICES_OFF)\n            .ok()?\n        {\n            fastfile_iw5::ZonePtr::Offset(p) => stream.resolve_alias(p),\n            _ => return None,\n        };\n\n        let base = positions.len();\n        let index_start = indices.len();\n        let surface_skins = decode_surface_skin_iw5(\n            stream,\n            surface,\n            vertex_count,\n            vert_list_count,\n            geometry.num_bones,\n        )?;\n\n        for vertex_index in 0..vertex_count {\n            let vertex = vertices.at(vertex_index * iw5sz::GFX_PACKED_VERTEX);\n            positions.push([\n                stream.f32_at(vertex, 0).ok()?,\n                stream.f32_at(vertex, 4).ok()?,\n                stream.f32_at(vertex, 8).ok()?,\n            ]);\n            packed_vertices.push(copy_packed_vertex_iw5(stream, vertex)?);\n\n            let skin = surface_skins[vertex_index];\n            if skin.is_rigid() {\n                rigid_verts += 1;\n            } else {\n                blend_verts += 1;\n            }\n            vert_skin.push(skin);\n        }\n        for index_offset in 0..tri_count * 3 {\n            let index = stream.u16_at(triangles, index_offset * 2).ok()?;\n            if usize::from(index) >= vertex_count {\n                return None;\n            }\n            indices.push(base as u32 + u32::from(index));\n        }\n        surface_vertex_ranges.push((base, vertex_count));\n        surface_index_ranges.push((index_start, indices.len() - index_start));\n        surface_materials.push(material_at(surface_index));\n    }\n\n    Some(ModelSkel {\n        name,\n        bones,\n        bone_collision,\n        bone_names: bone_name_strs,\n        tag_view,\n        tag_weapon,\n        pose,\n        positions: positions.into(),\n        indices: indices.into(),\n        surface_materials,\n        surface_vertex_ranges,\n        surface_index_ranges,\n        surface_part_bits,\n        surface_deformed,\n        surface_vert_list_count,\n        vert_skin: vert_skin.into(),\n        rigid_verts,\n        blend_verts,\n        packed_vertices: packed_vertices.into(),\n        radius: geometry.radius,\n        bounds: None,\n        contents: None,\n        coll_lod: 0,\n        coll_surfs: Vec::new(),\n        movement_brushes: Vec::new(),\n\n        mount_tag: None,\n\n        lod: None,\n        lod_smc: None,\n        lod_part_bits: None,\n        lod_surf_span: [(0, 0); 4],\n    })\n}\n\nfn capture_bone_collision_iw5(\n    stream: &fastfile_iw5::ZoneStream<\'_>,\n    geometry: fastfile_iw5::XModelGeometry,\n) -> Vec<Option<BoneCollision>> {\n    let (Some(info), Some(classes)) = (geometry.bone_info, geometry.part_classification) else {\n        return Vec::new();\n    };\n    (0..geometry.num_bones)\n        .map(|bone| {\n            let row = info.at(bone * fastfile_iw5::size::XBONE_INFO);\n            let radius_sq = stream.f32_at(row, 24).ok()?;\n            let midpoint = [\n                stream.f32_at(row, 0).ok()?,\n                stream.f32_at(row, 4).ok()?,\n                stream.f32_at(row, 8).ok()?,\n            ];\n            let half_size = [\n                stream.f32_at(row, 12).ok()?,\n                stream.f32_at(row, 16).ok()?,\n                stream.f32_at(row, 20).ok()?,\n            ];\n            let finite = radius_sq.is_finite()\n                && radius_sq > 0.0\n                && midpoint.iter().all(|value| value.is_finite())\n                && half_size\n                    .iter()\n                    .all(|value| value.is_finite() && *value >= 0.0);\n            let part_classification = stream.u8_at(classes, bone).ok()?;\n            finite.then_some(BoneCollision {\n                midpoint,\n                half_size,\n                radius_sq,\n                part_classification,\n            })\n        })\n        .collect()\n}\n\nfn capture_pose_src_iw5(\n    stream: &fastfile_iw5::ZoneStream<\'_>,\n    geometry: &fastfile_iw5::XModelGeometry,\n    bone_names: &[String],\n    bones: &[BoneBind],\n    num_child: usize,\n) -> Option<ModelPoseSrc> {\n    use fastfile_iw5::size as iw5sz;\n\n    let parent_list = if num_child == 0 {\n        Vec::new()\n    } else {\n        let arr = geometry.parent_list?;\n        (0..num_child)\n            .map(|i| stream.u8_at(arr, i).ok())\n            .collect::<Option<Vec<_>>>()?\n    };\n    let quats = if num_child == 0 {\n        Vec::new()\n    } else {\n        let arr = geometry.quats?;\n        (0..num_child)\n            .map(|i| {\n                let o = i * iw5sz::XMODEL_QUAT;\n                Some([\n                    stream.i16_at(arr, o).ok()?,\n                    stream.i16_at(arr, o + 2).ok()?,\n                    stream.i16_at(arr, o + 4).ok()?,\n                    stream.i16_at(arr, o + 6).ok()?,\n                ])\n            })\n            .collect::<Option<Vec<_>>>()?\n    };\n    let trans = if num_child == 0 {\n        Vec::new()\n    } else {\n        let arr = geometry.trans?;\n        (0..num_child)\n            .map(|i| {\n                let o = i * 12;\n                Some([\n                    stream.f32_at(arr, o).ok()?,\n                    stream.f32_at(arr, o + 4).ok()?,\n                    stream.f32_at(arr, o + 8).ok()?,\n                ])\n            })\n            .collect::<Option<Vec<_>>>()?\n    };\n    let base_mat = bones\n        .iter()\n        .map(|b| {\n            (\n                Quat::from_xyzw(b.quat[0], b.quat[1], b.quat[2], b.quat[3]),\n                Vec3::from_array(b.trans),\n            )\n        })\n        .collect();\n    Some(ModelPoseSrc {\n        name: geometry\n            .name\n            .and_then(|p| stream.cstr(p).ok())\n            .unwrap_or("")\n            .to_owned(),\n        num_bones: geometry.num_bones,\n        num_root_bones: geometry.num_root_bones,\n        scale: geometry.scale,\n        no_scale_part_bits: geometry.no_scale_part_bits,\n        bone_names: bone_names.to_vec(),\n        parent_list,\n        quats,\n        trans,\n        base_mat,\n        root_rest: None,\n    })\n}\n\nfn decode_surface_skin_iw5(\n    stream: &fastfile_iw5::ZoneStream<\'_>,\n    surface: fastfile_iw5::Ptr,\n    vertex_count: usize,\n    vert_list_count: usize,\n    num_bones: usize,\n) -> Option<Vec<VertSkin>> {\n    use fastfile_iw5::size as iw5sz;\n\n    let mut skins = vec![VertSkin::default(); vertex_count];\n    let bone_at = |raw: u16| -> Option<u8> {\n        if raw % BONE_STRIDE != 0 {\n            return None;\n        }\n        let bone = raw / BONE_STRIDE;\n        ((bone as usize) < num_bones)\n            .then(|| u8::try_from(bone).ok())\n            .flatten()\n    };\n\n    let mut rigid_assigned = 0usize;\n    if vert_list_count > 0 {\n        if let Ok(fastfile_iw5::ZonePtr::Offset(list_ptr)) =\n            stream.ptr_at(surface, stream.layout(iw5sz::XSURFACE_VERT_LIST_OFF, 56))\n        {\n            let list = stream.resolve_alias(list_ptr);\n            let mut vertex = 0usize;\n            for i in 0..vert_list_count {\n                let entry = list.at(i * stream.layout(iw5sz::XRIGID_VERT_LIST, 16));\n                let bone_offset = stream.u16_at(entry, 0).ok()?;\n                let run = stream.u16_at(entry, 2).ok()? as usize;\n                let bone = bone_at(bone_offset)?;\n                for _ in 0..run {\n                    if vertex >= vertex_count {\n                        break;\n                    }\n                    skins[vertex] = VertSkin::rigid(bone);\n                    vertex += 1;\n                }\n            }\n            rigid_assigned = vertex;\n            if vertex == vertex_count {\n                return Some(skins);\n            }\n        }\n    }\n\n    let vi = surface.at(stream.layout(iw5sz::XSURFACE_VERT_INFO_OFF, 24));\n    let counts = [\n        stream.i16_at(vi, 0).ok()?.max(0) as usize,\n        stream.i16_at(vi, 2).ok()?.max(0) as usize,\n        stream.i16_at(vi, 4).ok()?.max(0) as usize,\n        stream.i16_at(vi, 6).ok()?.max(0) as usize,\n    ];\n    let blend_ptr = match stream.ptr_at(vi, 8).ok()? {\n        fastfile_iw5::ZonePtr::Offset(p) => stream.resolve_alias(p),\n        fastfile_iw5::ZonePtr::Null if counts.iter().all(|&c| c == 0) => {\n            if rigid_assigned > 0 {\n                return Some(skins);\n            }\n            if num_bones > 1 {\n                diag::warn!(\n                    Zone,\n                    "iw5 xsurface skin: {vertex_count} verts, vertListCount={vert_list_count}, \\\n                     no blend buckets, {num_bones} bones — cannot resolve ownership (typed gap)"\n                );\n            }\n            for skin in &mut skins {\n                *skin = VertSkin::rigid(0);\n            }\n            return Some(skins);\n        }\n        _ => return None,\n    };\n\n    let mut cursor = 0usize;\n    let mut vertex = rigid_assigned;\n    let take = |cursor: &mut usize, n: usize| -> Option<()> {\n        *cursor = cursor.checked_add(n)?;\n        Some(())\n    };\n    for (bucket, count) in counts.iter().enumerate() {\n        let influences = bucket + 1;\n        for _ in 0..*count {\n            let words = 1 + (influences - 1) * 2;\n            let start = cursor;\n            take(&mut cursor, words)?;\n            let mut skin = VertSkin::default();\n            let b0 = stream.u16_at(blend_ptr, start * 2).ok()?;\n            skin.bones[0] = bone_at(b0)?;\n            let mut remaining = 1.0f32;\n            for extra in 1..influences {\n                let off = start + 1 + (extra - 1) * 2;\n                let b = stream.u16_at(blend_ptr, off * 2).ok()?;\n                let raw = stream.u16_at(blend_ptr, off * 2 + 2).ok()?;\n                let w = dpvs_iw4::skin_blend_weight(raw);\n                skin.bones[extra] = bone_at(b)?;\n                skin.set_weight(extra, w);\n                skin.set_extra_weight(extra, raw);\n                remaining -= w;\n            }\n            skin.set_weight(0, remaining);\n            if vertex >= vertex_count {\n                return None;\n            }\n            skins[vertex] = skin;\n            vertex += 1;\n        }\n    }\n    if vertex != vertex_count {\n        return None;\n    }\n    Some(skins)\n}\n',encoding='utf-8')
          (target/'crates/assets/src/lane/helpers.rs').write_text('use std::collections::HashMap;\n\nuse bevy::prelude::{Mat3, Quat, Transform, Vec3};\nuse fastfile_iw4::{Ptr, ZoneStream};\n\nuse asset_material::MaterialCatalog;\nuse asset_world::{\n    MapXModelAssetKey, MapXModelSceneAsset, MapXModelSceneCatalog, ModelMesh, PreparedMapModels,\n    ScriptModelMetadata, ScriptModelPlacement, ScriptModelSceneInstance, StaticModelDraw,\n    StaticModelDrawError, StaticModelInstance, StaticModelPlacement,\n    build_iw5_static_model_instances, build_iw5_xmodel_mesh, build_static_model_instances,\n    build_t5_static_model_instances, build_t5_xmodel_mesh, build_xmodel_mesh, flag_descriptors,\n    flag_descriptors_iw5, flag_descriptors_t5, map_script_structs, map_script_structs_iw5,\n    map_script_structs_t5, map_use_triggers_iw5, map_use_triggers_t5,\n    script_brush_model_placements, script_brush_model_placements_iw5,\n    script_brush_model_placements_t5, script_model_placements, script_model_placements_iw5,\n    script_model_placements_t5,\n};\n\n#[derive(Default)]\npub(crate) struct MapXModelCatalog {\n    pub shared_surfaces: asset_model::SharedXModelSurfaces,\n    meshes: Vec<ModelMesh>,\n    direct: HashMap<Ptr, usize>,\n    aliases: HashMap<Ptr, Ptr>,\n    failed: usize,\n    scene_assets: MapXModelSceneCatalog,\n\n    t5_destructibles: HashMap<String, Result<T5DestructibleInitial, &\'static str>>,\n}\n\nstruct T5DestructibleInitial {\n    definition: std::sync::Arc<xmodel_runtime::T5DestructibleDef>,\n    model: MapXModelAssetKey,\n    hide_parts: xmodel_runtime::HidePartBits,\n}\n\nimpl MapXModelCatalog {\n    pub(crate) fn take_named_mesh(&mut self, name: &str) -> Option<ModelMesh> {\n        let index = self.meshes.iter().position(|mesh| mesh.name == name)?;\n        self.direct.retain(|_, slot| *slot != index);\n        for slot in self.direct.values_mut() {\n            if *slot > index {\n                *slot -= 1;\n            }\n        }\n        Some(self.meshes.remove(index))\n    }\n\n    pub(crate) fn set_capture_zone(&mut self, zone: asset_core::ZoneOwner) {\n        self.scene_assets.set_capture_zone(zone);\n    }\n\n    pub(crate) fn capture(\n        &mut self,\n        stream: &ZoneStream<\'_>,\n        materials: &MaterialCatalog,\n        slot: Ptr,\n        insert_slot: Option<Ptr>,\n        strings: &fastfile_iw4::ScriptStrings,\n        phys_presets: &asset_world::PhysPresetCatalog,\n    ) {\n        let Some(geometry) = stream.xmodel() else {\n            self.failed += 1;\n            return;\n        };\n        let slot_live = geometry.phys_preset.is_some();\n        let named = geometry\n            .phys_preset\n            .and_then(|preset_slot| phys_presets.at_slot(preset_slot))\n            .is_some();\n        self.scene_assets.note_xmodel_phys_preset(slot_live, named);\n        let Some(name) = geometry.name.and_then(|p| stream.cstr(p).ok()) else {\n            self.failed += 1;\n            return;\n        };\n        let scene_key = MapXModelAssetKey(name.to_owned());\n        let scene_asset = asset_model::capture_xmodel_skel_with_shared(\n            stream,\n            strings,\n            geometry,\n            Some(materials),\n            &self.shared_surfaces,\n        )\n        .map(|skel| MapXModelSceneAsset::Iw4(self.shared_surfaces.share_geometry(skel)))\n        .unwrap_or(MapXModelSceneAsset::Unavailable {\n            reason: "IW4 XModel scene skeleton capture failed",\n        });\n        self.scene_assets.insert(scene_key, scene_asset);\n        let Ok(mesh) = build_xmodel_mesh(stream, geometry, Some(materials)) else {\n            self.failed += 1;\n            return;\n        };\n        let index = self.meshes.len();\n        self.meshes.push(mesh);\n        self.direct.insert(slot, index);\n        if let Some(insert_slot) = insert_slot {\n            self.direct.insert(insert_slot, index);\n        }\n    }\n\n    pub(crate) fn capture_t5(\n        &mut self,\n        stream: &fastfile_t5::ZoneStream<\'_>,\n        materials: &MaterialCatalog,\n        slot: fastfile_t5::Ptr,\n        insert_slot: Option<fastfile_t5::Ptr>,\n        strings: &fastfile_t5::ScriptStrings,\n    ) {\n        let Some(geometry) = stream.latest_xmodel() else {\n            self.failed += 1;\n            return;\n        };\n        let Ok(mesh) = build_t5_xmodel_mesh(stream, geometry, Some(materials)) else {\n            self.failed += 1;\n            return;\n        };\n        let scene_key = MapXModelAssetKey(mesh.name.clone());\n        let scene_asset = asset_model::capture_xmodel_skel_t5(stream, strings, geometry, materials)\n            .map(|skel| MapXModelSceneAsset::T5(std::sync::Arc::new(skel)))\n            .unwrap_or(MapXModelSceneAsset::Unavailable {\n                reason: "T5 XModel scene skeleton capture failed",\n            });\n        self.scene_assets.insert(scene_key, scene_asset);\n        let index = self.meshes.len();\n        self.meshes.push(mesh);\n        let slot = Ptr {\n            block: slot.block,\n            offset: slot.offset,\n        };\n        self.direct.insert(slot, index);\n        if let Some(insert_slot) = insert_slot {\n            self.direct.insert(\n                Ptr {\n                    block: insert_slot.block,\n                    offset: insert_slot.offset,\n                },\n                index,\n            );\n        }\n    }\n\n    pub(crate) fn capture_t5_destructible(\n        &mut self,\n        stream: &fastfile_t5::ZoneStream<\'_>,\n        header: fastfile_t5::Ptr,\n        strings: &fastfile_t5::ScriptStrings,\n        fx: &asset_game::FxCatalog,\n    ) -> fastfile_t5::Result<()> {\n        use fastfile_t5::ZonePtr;\n        let ZonePtr::Offset(name) = stream.ptr_at(header, 0)? else {\n            return Ok(());\n        };\n        let name = stream.cstr(stream.resolve_alias(name))?.to_owned();\n        let initial = (|| {\n            let pristine = stream.ptr_at(header, 8).ok()? != ZonePtr::Null;\n            let model_slot = header.at(if pristine { 8 } else { 4 });\n            let model = self\n                .name_at_slot(Ptr {\n                    block: model_slot.block,\n                    offset: model_slot.offset,\n                })?\n                .to_owned();\n            let read_string = |p, offset| -> Option<Option<String>> {\n                match stream.ptr_at(p, offset).ok()? {\n                    ZonePtr::Null => Some(None),\n                    ZonePtr::Offset(p) => {\n                        Some(Some(stream.cstr(stream.resolve_alias(p)).ok()?.to_owned()))\n                    }\n                    _ => None,\n                }\n            };\n            let count = usize::try_from(stream.i32_at(header, 12).ok()?).ok()?;\n            let ZonePtr::Offset(pieces_ptr) = stream.ptr_at(header, 16).ok()? else {\n                return None;\n            };\n            let pieces_ptr = stream.resolve_alias(pieces_ptr);\n            let mut pieces = Vec::with_capacity(count);\n            for i in 0..count {\n                let p = pieces_ptr.at(i * 0x138);\n                let mut stages = Vec::with_capacity(5);\n                for j in 0..5 {\n                    let st = p.at(j * 0x30);\n                    let bone = stream.u16_at(st, 0).ok()?;\n                    let break_effect = if stream.ptr_at(st, 16).ok()? == ZonePtr::Null {\n                        None\n                    } else {\n                        Some(\n                            fx.name_at_slot(Ptr {\n                                block: st.block,\n                                offset: st.offset + 16,\n                            })?\n                            .to_owned(),\n                        )\n                    };\n                    let mut spawn_models = [None, None, None];\n                    for (k, value) in spawn_models.iter_mut().enumerate() {\n                        if stream.ptr_at(st, 32 + k * 4).ok()? != ZonePtr::Null {\n                            *value = Some(\n                                self.name_at_slot(Ptr {\n                                    block: st.block,\n                                    offset: st.at(32 + k * 4).offset,\n                                })?\n                                .to_owned(),\n                            );\n                        }\n                    }\n                    stages.push(xmodel_runtime::T5DestructibleStage {\n                        show_bone: if bone == 0 {\n                            None\n                        } else {\n                            Some(strings.get(stream, bone)?.to_owned())\n                        },\n                        break_health: stream.f32_at(st, 4).ok()?,\n                        max_time: stream.f32_at(st, 8).ok()?,\n                        flags: stream.u32_at(st, 12).ok()?,\n                        break_effect_looping: break_effect\n                            .as_deref()\n                            .and_then(|name| fx.get_in(asset_core::FamilyId::T5, name))\n                            .is_some_and(|effect| effect.view.msec_looping_life == i32::MAX),\n                        break_effect,\n                        break_sound: read_string(st, 20)?.map(|name| format!("t5:{name}")),\n                        break_notify: read_string(st, 24)?,\n                        loop_sound: read_string(st, 28)?.map(|name| format!("t5:{name}")),\n                        has_phys_preset: stream.ptr_at(st, 44).ok()? != ZonePtr::Null,\n                        spawn_models,\n                    });\n                }\n                let mut hide_bones = [0; 5];\n                for (j, word) in hide_bones.iter_mut().enumerate() {\n                    *word = stream.u32_at(p, 0x124 + j * 4).ok()?;\n                }\n                pieces.push(xmodel_runtime::T5DestructiblePiece {\n                    stages: stages.try_into().ok()?,\n                    parent_piece: stream.slice_at(p, 0xf0, 1).ok()?[0],\n                    parent_damage_percent: stream.f32_at(p, 0xf4).ok()?,\n                    bullet_damage_scale: stream.f32_at(p, 0xf8).ok()?,\n                    explosive_damage_scale: stream.f32_at(p, 0xfc).ok()?,\n                    health: stream.i32_at(p, 0x110).ok()?,\n                    launch: match stream.ptr_at(p, 0x10c).ok()? {\n                        ZonePtr::Offset(c) => {\n                            let c = stream.resolve_alias(c);\n                            let data = c.at(8);\n                            if stream.u32_at(c, 4).ok()? > 0 && stream.i32_at(data, 4).ok()? == 7 {\n                                Some((\n                                    [\n                                        stream.f32_at(data, 116).ok()?,\n                                        stream.f32_at(data, 120).ok()?,\n                                        stream.f32_at(data, 124).ok()?,\n                                    ],\n                                    stream.f32_at(data, 112).ok()?,\n                                ))\n                            } else {\n                                None\n                            }\n                        }\n                        _ => None,\n                    },\n                    hide_bones,\n                });\n            }\n            let base_slot = header.at(4);\n            let definition = std::sync::Arc::new(xmodel_runtime::T5DestructibleDef {\n                name: name.clone(),\n                model: self\n                    .name_at_slot(Ptr {\n                        block: base_slot.block,\n                        offset: base_slot.offset,\n                    })?\n                    .to_owned(),\n                pieces,\n                client_only: stream.i32_at(header, 20).ok()? != 0,\n            });\n            let hide_parts = if pristine {\n                xmodel_runtime::HidePartBits::from_words([0; 6])\n            } else {\n                let MapXModelSceneAsset::T5(skel) = self.scene_assets.get_name(&model)? else {\n                    return None;\n                };\n                let health: Vec<_> = definition.pieces.iter().map(|p| p.health as i16).collect();\n                definition.hide_parts(&health, &skel.bone_names)\n            };\n            Some(T5DestructibleInitial {\n                definition,\n                model: MapXModelAssetKey(model),\n                hide_parts,\n            })\n        })()\n        .ok_or("T5 DestructibleDef initial model/parts capture failed");\n        self.t5_destructibles.insert(name, initial);\n        Ok(())\n    }\n\n    pub(crate) fn capture_iw5(\n        &mut self,\n        stream: &fastfile_iw5::ZoneStream<\'_>,\n        materials: &MaterialCatalog,\n        slot: fastfile_iw5::Ptr,\n        insert_slot: Option<fastfile_iw5::Ptr>,\n        strings: &fastfile_iw5::ScriptStrings,\n    ) {\n        let Some(geometry) = stream.latest_xmodel() else {\n            self.failed += 1;\n            return;\n        };\n        let Some(name) = geometry.name.and_then(|p| stream.cstr(p).ok()) else {\n            self.failed += 1;\n            return;\n        };\n        let scene_key = MapXModelAssetKey(name.to_owned());\n        let scene_asset = asset_model::capture_xmodel_skel_iw5_with_shared(\n            stream,\n            strings,\n            geometry,\n            materials,\n            &self.shared_surfaces,\n        )\n        .map(|skel| MapXModelSceneAsset::Iw5(std::sync::Arc::new(skel)))\n        .unwrap_or(MapXModelSceneAsset::Unavailable {\n            reason: "IW5 XModel scene skeleton capture failed",\n        });\n        self.scene_assets.insert(scene_key, scene_asset);\n        let Ok(mesh) = build_iw5_xmodel_mesh(stream, geometry, Some(materials)) else {\n            self.failed += 1;\n            return;\n        };\n        let index = self.meshes.len();\n        self.meshes.push(mesh);\n        let slot = Ptr {\n            block: slot.block,\n            offset: slot.offset,\n        };\n        self.direct.insert(slot, index);\n        if let Some(insert_slot) = insert_slot {\n            self.direct.insert(\n                Ptr {\n                    block: insert_slot.block,\n                    offset: insert_slot.offset,\n                },\n                index,\n            );\n        }\n    }\n\n    pub(crate) fn alias(&mut self, slot: Ptr, target: Ptr) {\n        self.aliases.insert(slot, target);\n    }\n\n    pub(crate) fn mesh_index(&self, slot: Ptr) -> Option<usize> {\n        let mut current = slot;\n        for _ in 0..self.aliases.len().saturating_add(1) {\n            if let Some(&index) = self.direct.get(&current) {\n                return Some(index);\n            }\n            current = *self.aliases.get(&current)?;\n        }\n        None\n    }\n\n    pub(crate) fn name_at_slot(&self, slot: Ptr) -> Option<&str> {\n        let index = self.mesh_index(slot)?;\n        Some(self.meshes[index].name.as_str())\n    }\n\n    pub(crate) fn attach_t5_clip_models(\n        &self,\n        stream: &fastfile_t5::ZoneStream<\'_>,\n        geometry: fastfile_t5::ClipMapGeometry,\n        clip: &mut asset_world::ClipCollision,\n    ) -> Result<(), asset_world::ClipCollisionError> {\n        use asset_world::ClipCollisionError::{MissingTables, Truncated};\n        let Some(rows) = geometry.static_models else {\n            return if geometry.static_model_count == 0 {\n                Ok(())\n            } else {\n                Err(MissingTables)\n            };\n        };\n        for index in 0..geometry.static_model_count {\n            let row = rows.at(index * fastfile_t5::size::C_STATIC_MODEL);\n            let slot = row.at(fastfile_t5::size::C_STATIC_MODEL_XMODEL_OFF);\n            let name = self\n                .name_at_slot(Ptr {\n                    block: slot.block,\n                    offset: slot.offset,\n                })\n                .ok_or(MissingTables)?;\n            let Some(MapXModelSceneAsset::T5(skel)) = self.scene_assets.get_name(name) else {\n                return Err(MissingTables);\n            };\n            let read = |offset| stream.f32_at(row, offset).map_err(|_| Truncated);\n            let origin = [read(8)?, read(12)?, read(16)?];\n            let mut inv_scaled_axis = [[0.0; 3]; 3];\n            let mut bounds_mid = [0.0; 3];\n            let mut bounds_half = [0.0; 3];\n\n            for axis in 0..3 {\n                for (column, value) in inv_scaled_axis[axis].iter_mut().enumerate() {\n                    *value = read(20 + (axis * 3 + column) * 4)?;\n                }\n                let min = read(56 + axis * 4)?;\n                let max = read(68 + axis * 4)?;\n                if !min.is_finite() || !max.is_finite() || min > max {\n                    return Err(Truncated);\n                }\n                bounds_mid[axis] = (min + max) * 0.5;\n                bounds_half[axis] = (max - min) * 0.5;\n            }\n            let coll = clipmap_iw4::XModelColl {\n                coll_lod: skel.coll_lod,\n                contents: skel.contents.ok_or(MissingTables)?,\n                surfs: skel\n                    .coll_surfs\n                    .iter()\n                    .map(|surf| clipmap_iw4::XModelCollSurf {\n                        midpoint: surf.midpoint,\n                        half_size: surf.half_size,\n                        bone_idx: i32::from(surf.bone),\n                        contents: surf.contents,\n                        surf_flags: surf.surf_flags,\n                        tris: surf\n                            .tris\n                            .iter()\n                            .map(|tri| clipmap_iw4::XModelCollTri {\n                                plane: tri.plane,\n                                svec: tri.svec,\n                                tvec: tri.tvec,\n                            })\n                            .collect(),\n                    })\n                    .collect(),\n            };\n            clip.static_models.push(asset_world::ClipPlacedStaticModel {\n                index: index as u32,\n                name: name.to_owned(),\n                model: clipmap_iw4::ClipStaticModel {\n                    origin,\n                    inv_scaled_axis,\n                    bounds_mid,\n                    bounds_half,\n                    coll,\n                },\n            });\n        }\n        Ok(())\n    }\n\n    pub(crate) fn phys_preset_slot_n(&self) -> usize {\n        self.scene_assets.phys_preset_slot_n()\n    }\n\n    pub(crate) fn phys_preset_name_hint_n(&self) -> usize {\n        self.scene_assets.phys_preset_name_hint_n()\n    }\n\n    pub(crate) fn captured_model_n(&self) -> usize {\n        self.scene_assets.len()\n    }\n\n    pub(crate) fn set_dynent_phys_preset_n(&mut self, n: usize) {\n        self.scene_assets.set_dynent_phys_preset_n(n);\n    }\n}\n\npub(crate) fn build_static_model_draw(\n    stream: &ZoneStream<\'_>,\n    geometry: fastfile_iw4::GfxWorldGeometry,\n    catalog: MapXModelCatalog,\n) -> PreparedMapModels {\n    let (placements, static_error) = match build_static_model_instances(stream, geometry) {\n        Ok(placements) => (placements, None),\n        Err(_) => (\n            Vec::new(),\n            Some(StaticModelDrawError::InstancesUnavailable {\n                smodel_count: geometry.smodel_count,\n            }),\n        ),\n    };\n    let scripts = script_model_placements(stream);\n    let brushes = script_brush_model_placements(stream);\n    let descriptors = flag_descriptors(stream);\n    let structs = map_script_structs(stream);\n    link_model_placements(\n        placements,\n        static_error,\n        &scripts,\n        brushes,\n        descriptors,\n        structs,\n        catalog,\n        geometry.smodel_count,\n    )\n}\n\npub(crate) fn build_t5_static_model_draw(\n    stream: &fastfile_t5::ZoneStream<\'_>,\n    geometry: fastfile_t5::GfxWorldGeometry,\n    catalog: MapXModelCatalog,\n) -> PreparedMapModels {\n    let (placements, static_error) = match build_t5_static_model_instances(stream, geometry) {\n        Ok(placements) => (placements, None),\n        Err(_) => (\n            Vec::new(),\n            Some(StaticModelDrawError::InstancesUnavailable {\n                smodel_count: geometry.smodel_count,\n            }),\n        ),\n    };\n    let mut scripts = script_model_placements_t5(stream);\n    let mut brushes = script_brush_model_placements_t5(stream);\n    normalize_bomb_sites(\n        &mut scripts,\n        &mut brushes,\n        &map_use_triggers_t5(stream),\n        "bombzone_dem",\n    );\n    let descriptors = flag_descriptors_t5(stream);\n    let structs = map_script_structs_t5(stream);\n    link_model_placements(\n        placements,\n        static_error,\n        &scripts,\n        brushes,\n        descriptors,\n        structs,\n        catalog,\n        geometry.smodel_count,\n    )\n}\n\npub(crate) fn build_iw5_static_model_draw(\n    stream: &fastfile_iw5::ZoneStream<\'_>,\n    geometry: fastfile_iw5::GfxWorldGeometry,\n    catalog: MapXModelCatalog,\n) -> PreparedMapModels {\n    let (placements, static_error) = match build_iw5_static_model_instances(stream, geometry) {\n        Ok(placements) => (placements, None),\n        Err(_) => (\n            Vec::new(),\n            Some(StaticModelDrawError::InstancesUnavailable {\n                smodel_count: geometry.smodel_count,\n            }),\n        ),\n    };\n    let mut scripts = script_model_placements_iw5(stream);\n    let mut brushes = script_brush_model_placements_iw5(stream);\n    normalize_bomb_sites(\n        &mut scripts,\n        &mut brushes,\n        &map_use_triggers_iw5(stream),\n        "dd_bombzone",\n    );\n    let descriptors = flag_descriptors_iw5(stream);\n    let structs = map_script_structs_iw5(stream);\n    link_model_placements(\n        placements,\n        static_error,\n        &scripts,\n        brushes,\n        descriptors,\n        structs,\n        catalog,\n        geometry.smodel_count,\n    )\n}\n\nfn normalize_bomb_sites(\n    scripts: &mut [asset_world::ScriptModelPlacement],\n    brushes: &mut [asset_world::ScriptBrushModelPlacement],\n    triggers: &[asset_world::MapUseTrigger],\n    demolition_tag: &str,\n) {\n    let has_dedicated_sites = ["a", "b"].into_iter().all(|label| {\n        triggers.iter().any(|trigger| {\n            trigger.targetname == demolition_tag\n                && trigger.script_label.trim_start_matches(\'_\') == label\n        })\n    });\n    let normalize = |value: &mut String| {\n        *value = value\n            .split_ascii_whitespace()\n            .map(|token| {\n                if token == demolition_tag {\n                    "bombzone"\n                } else if token == "bombzone" && has_dedicated_sites {\n                    "sd_bombzone"\n                } else {\n                    token\n                }\n            })\n            .collect::<Vec<_>>()\n            .join(" ");\n    };\n    for script in scripts {\n        normalize(&mut script.gameobject);\n    }\n    for brush in brushes {\n        normalize(&mut brush.gameobject);\n    }\n}\n\npub(crate) fn link_model_placements(\n    placements: Vec<StaticModelInstance>,\n    mut static_error: Option<StaticModelDrawError>,\n    scripts: &[ScriptModelPlacement],\n    script_brush_models: Vec<asset_world::ScriptBrushModelPlacement>,\n    flag_descriptors: Vec<asset_world::FlagDescriptor>,\n    script_structs: Vec<asset_world::MapScriptStruct>,\n    mut catalog: MapXModelCatalog,\n    smodel_count: usize,\n) -> PreparedMapModels {\n    if static_error.is_none() && placements.len() != smodel_count {\n        static_error = Some(StaticModelDrawError::PlacementCountMismatch {\n            decoded: placements.len(),\n            smodel_count,\n        });\n    }\n    let mut remap = vec![None; catalog.meshes.len()];\n    let mut used = Vec::new();\n    let mut gaps = catalog.failed;\n    let mut instances: Vec<Option<StaticModelPlacement>> = vec![None; smodel_count];\n    let mut script_instances = Vec::with_capacity(scripts.len());\n\n    let mut take_mesh = |source_mesh: usize| -> usize {\n        match remap[source_mesh] {\n            Some(mesh) => mesh,\n            None => {\n                let mesh = used.len();\n                remap[source_mesh] = Some(mesh);\n                used.push(source_mesh);\n                mesh\n            }\n        }\n    };\n\n    if static_error.is_none() {\n        for (slot, placement) in placements.into_iter().enumerate() {\n            let Some(source_mesh) = catalog.mesh_index(placement.model_slot) else {\n                gaps += 1;\n                continue;\n            };\n            let mesh = take_mesh(source_mesh);\n            let basis = Mat3::from_cols(\n                Vec3::from_array(placement.axis[0]),\n                Vec3::from_array(placement.axis[1]),\n                Vec3::from_array(placement.axis[2]),\n            );\n            instances[slot] = Some(StaticModelPlacement {\n                mesh,\n                transform: Transform {\n                    translation: Vec3::from_array(placement.origin),\n                    rotation: Quat::from_mat3(&basis),\n                    scale: Vec3::splat(placement.scale),\n                },\n                origin: placement.origin,\n                axis: placement.axis,\n                scale: placement.scale,\n                cull_dist: placement.cull_dist,\n                reflection_probe_index: placement.reflection_probe_index,\n                primary_light_index: placement.primary_light_index,\n                flags: placement.flags,\n            });\n        }\n    } else {\n        gaps = gaps.saturating_add(smodel_count);\n    }\n\n    let mut script_gaps = 0usize;\n    for placement in scripts {\n        let initial = catalog.t5_destructibles.get(&placement.destructible_def);\n        let current_model = match initial {\n            Some(Ok(initial)) => initial.model.clone(),\n            _ if !placement.destructible_def.is_empty() => {\n                MapXModelAssetKey(placement.destructible_def.clone())\n            }\n            _ => MapXModelAssetKey(placement.model.clone()),\n        };\n        if catalog.scene_assets.get(&current_model).is_none() {\n            script_gaps += 1;\n            catalog.scene_assets.insert(\n                current_model.clone(),\n                MapXModelSceneAsset::Unavailable {\n                    reason: "map XModel was not captured as a scene asset",\n                },\n            );\n        }\n        let mut dobj_state =\n            xmodel_runtime::DObjSemanticState::bind_pose(current_model.0.clone(), 1, 1);\n        match initial {\n            Some(Ok(initial)) => dobj_state.hide_part_bits = initial.hide_parts,\n            Some(Err(reason)) => {\n                catalog.scene_assets.insert(\n                    current_model.clone(),\n                    MapXModelSceneAsset::Unavailable { reason },\n                );\n            }\n            None if !placement.destructible_def.is_empty() => {\n                catalog.scene_assets.insert(\n                    current_model.clone(),\n                    MapXModelSceneAsset::Unavailable {\n                        reason: "T5 MapEnts DestructibleDef was not captured",\n                    },\n                );\n            }\n            None => {}\n        }\n        let [pitch, yaw, roll] = placement.angles.map(f32::to_radians);\n        script_instances.push(ScriptModelSceneInstance {\n            id: placement.id,\n            dobj_state,\n            current_model,\n            transform: Transform {\n                translation: Vec3::from_array(placement.origin),\n                rotation: Quat::from_euler(bevy::math::EulerRot::ZYX, yaw, pitch, roll),\n                scale: Vec3::ONE,\n            },\n            lighting_origin: placement.lighting_origin.unwrap_or(placement.origin),\n            metadata: ScriptModelMetadata {\n                gameobject: placement.gameobject.clone(),\n                targetname: placement.targetname.clone(),\n                script_noteworthy: placement.script_noteworthy.clone(),\n                destructible_type: placement.destructible_type.clone(),\n                destructible_def: placement.destructible_def.clone(),\n                t5_destructible: initial\n                    .and_then(|row| row.as_ref().ok())\n                    .map(|row| row.definition.clone()),\n                target: placement.target.clone(),\n                script_exploder: placement.script_exploder.clone(),\n                brush_link: placement.brush_link.clone(),\n                script_accumulate: placement.script_accumulate,\n                script_threshold: placement.script_threshold,\n                script_destructable_area: placement.script_destructable_area.clone(),\n                script_fxid: placement.script_fxid.clone(),\n            },\n        });\n    }\n\n    let mut meshes = catalog.meshes.into_iter().map(Some).collect::<Vec<_>>();\n    let meshes = used\n        .into_iter()\n        .filter_map(|index| meshes.get_mut(index).and_then(Option::take))\n        .collect();\n    PreparedMapModels {\n        static_draw: StaticModelDraw {\n            meshes,\n            placements: instances,\n            gaps,\n        },\n        static_error,\n        scene_assets: catalog.scene_assets,\n        script_instances,\n        script_brush_models,\n        flag_descriptors,\n        script_structs,\n        script_gaps,\n    }\n}\n\npub(super) fn report_map_models(\n    report: &mut Vec<String>,\n    models: &PreparedMapModels,\n    authored_slots: impl std::fmt::Display,\n) {\n    if let Some(error) = models.static_error.as_ref() {\n        report.push(format!("static models: {error}"));\n    }\n    let smodels = &models.static_draw;\n    report.push(format!(\n        "static models: {}/{authored_slots} authored slots resolved to {} unique meshes ({} unresolved)",\n        smodels.resolved_count(),\n        smodels.meshes.len(),\n        smodels.gaps\n    ));\n    report.push(format!(\n        "script_model: {} placements linked (MapEnts props; separate visibility owner)",\n        models.script_instances.len()\n    ));\n    report.push(format!(\n        "script_brushmodel: {} *N placements (SP_script_brushmodel, not DrawInst)",\n        models.script_brush_models.len()\n    ));\n}\n\npub(super) fn report_ffa_spawns(report: &mut Vec<String>, spawns: &[asset_world::SpawnPoint]) {\n    report.push(format!(\n        "ffa spawns: {} mp_dm_spawn* ({} start)",\n        spawns.len(),\n        spawns.iter().filter(|p| p.is_initial()).count()\n    ));\n}\n\npub(super) fn report_intermission(\n    report: &mut Vec<String>,\n    view: Option<&asset_world::IntermissionView>,\n) {\n    report.push(match view {\n        Some(view) => format!(\n            "camera: mp_global_intermission origin={:?} angles={:?}",\n            view.origin, view.angles\n        ),\n        None => "camera: mp_global_intermission not found".into(),\n    });\n}\n\npub(super) fn report_world_batches(report: &mut Vec<String>, draw: &asset_world::WorldDraw) {\n    let lightmapped = draw.surface_lightmapped.iter().filter(|&&lit| lit).count();\n    report.push(format!(\n        "world batches: {lightmapped} lightmapped, {} fallback surfaces",\n        draw.surface_lightmapped.len() - lightmapped\n    ));\n}\n\npub(super) fn report_dpvs(report: &mut Vec<String>, draw: &asset_world::WorldDraw) {\n    report.push(format!(\n        "dpvs: cells={} planes={} nodes={} sorted={} portal_verts={} cleared_boxes={}",\n        draw.dpvs.cell_count,\n        draw.dpvs.planes.len(),\n        draw.dpvs.nodes.len(),\n        draw.dpvs.sorted_surf_index.len(),\n        draw.dpvs.portal_verts.len(),\n        draw.dpvs.cleared_boxes\n    ));\n}\n\npub(super) fn decode_reflection_probes(\n    report: &mut Vec<String>,\n    draw: &asset_world::WorldDraw,\n    materials: &MaterialCatalog,\n) -> Vec<Option<bevy::prelude::Image>> {\n    let images: Vec<_> = draw\n        .reflection_probes\n        .iter()\n        .map(|probe| {\n            let source = materials.images.get(probe.image?)?;\n            if let Some(decoded) = &source.decoded {\n                return Some(decoded.as_ref().clone());\n            }\n            asset_material::decode_reflection_probe_cubemap(source)\n                .map_err(|error| {\n                    report.push(format!("reflection probe {} gap: {error}", source.name))\n                })\n                .ok()\n        })\n        .collect();\n    report.push(format!(\n        "reflection probes: {}/{} cubemaps decoded",\n        images.iter().flatten().count(),\n        images.len()\n    ));\n    images\n}\n\npub(super) fn smodel_lighting_samples(\n    report: &mut Vec<String>,\n    grid: &asset_model::OwnedLightGrid,\n    origins: Vec<(usize, [f32; 3])>,\n    placements: &[Option<StaticModelPlacement>],\n    clip: Option<&asset_world::ClipCollision>,\n) -> Vec<asset_model::SmodelLightingSample> {\n    use asset_model::model_lighting::{\n        build_smodel_lighting_samples_with_sight, census_lit_fragment_tiles,\n    };\n    use lighting_iw4::LIGHT_GRID_SIGHT_CONTENT_MASK as MASK;\n    let origins: Vec<_> = origins\n        .into_iter()\n        .filter(|(slot, _)| placements.get(*slot).is_some_and(Option::is_some))\n        .collect();\n    let tiles = match clip {\n        Some(clip_map) => {\n            let clear = |start, end| clip_map.box_sight_clear(start, end, MASK);\n            let (tiles, census) =\n                build_smodel_lighting_samples_with_sight(&grid.view(), &origins, Some(&clear));\n            report.push(format!(\n                "smodel lighting: lit={} / candidates={} (blocked row={} trunc={} empty={}; CM sight mask=0x{MASK:x} corners need={} cleared={} suppressed={})",\n                census.lit,\n                census.candidates,\n                census.blocked_unmodelled_row,\n                census.blocked_truncated,\n                census.blocked_no_live_corner,\n                census.corners_needing_sight,\n                census.corners_needing_sight.saturating_sub(census.corners_sight_suppressed),\n                census.corners_sight_suppressed,\n            ));\n            tiles\n        }\n        None => {\n            let (tiles, census) =\n                build_smodel_lighting_samples_with_sight(&grid.view(), &origins, None);\n            report.push(format!(\n                "smodel lighting: lit={} / candidates={} (no clipmap — needsTrace corners suppressed; blocked row={} trunc={} empty={})",\n                census.lit,\n                census.candidates,\n                census.blocked_unmodelled_row,\n                census.blocked_truncated,\n                census.blocked_no_live_corner,\n            ));\n            tiles\n        }\n    };\n    if let Some(frag) = census_lit_fragment_tiles(&tiles) {\n        report.push(format!(\n            "smodel lit_fragment mid-grey: tiles={} lum min={:.4} max={:.4} mean={:.4} (specular=0)",\n            frag.tiles, frag.lum_min, frag.lum_max, frag.lum_mean\n        ));\n    }\n    tiles\n}\n',encoding='utf-8')

          # IW4C: adapt the earlier Pocket Metal keep-alive optimization to wgpu 30.0.1.
          # The exact official crate archive is verified before extracting or patching it.
          import hashlib,io,tarfile,urllib.request
          wgpu_archive=urllib.request.urlopen('https://static.crates.io/crates/wgpu-core/wgpu-core-30.0.1.crate',timeout=60).read()
          assert hashlib.sha256(wgpu_archive).hexdigest()=='14c018fce9b6270aa203c2fdd56f3cce996713534bd757e4ea58c8560b121f14'
          (target/'vendor').mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(wgpu_archive),mode='r:gz') as archive:
              archive.extractall(target/'vendor',filter='data')
          core=target/'vendor/wgpu-core-30.0.1'
          p=core/'src/device/resource.rs';core_source=p.read_text()
          anchor='        let shader_modules = {\n'
          assert core_source.count(anchor)==1
          core_source=core_source.replace(anchor,'        let mut shader_modules = {\n')
          anchor='        let pipeline = pipeline::RenderPipeline {\n'
          assert core_source.count(anchor)==1
          core_source=core_source.replace(anchor,'''        // IW4C iPhone/Metal: the native pipeline is complete and owns its
                  // MTLLibrary handles. Do not retain Naga compiler IR through core's
                  // otherwise unused shader-module keep-alive. Compute is unchanged.
                  if !crate::iw4c_shader_retention::keep_shader_ir(
                      cfg!(target_os = "ios"), self.backend() == wgt::Backend::Metal,
                  ) {
                      shader_modules.clear();
                  }

          '''+anchor)
          p.write_text(core_source)
          p=core/'src/lib.rs';p.write_text(p.read_text()+'\nmod iw4c_shader_retention;\n')
          (core/'src/iw4c_shader_retention.rs').write_text('//! Keep other platforms unchanged; Metal pipelines retain their own native libraries.\npub(crate) const fn keep_shader_ir(ios: bool, metal: bool) -> bool { !(ios && metal) }\n#[cfg(test)] mod tests {\n    use super::*;\n    #[test] fn release_only_ios_metal_compiler_ir() {\n        assert!(!keep_shader_ir(true,true));\n        assert!(keep_shader_ir(false,true));\n        assert!(keep_shader_ir(true,false));\n        assert!(keep_shader_ir(false,false));\n    }\n}\n')
          p=target/'Cargo.toml';manifest=p.read_text();assert '[patch.crates-io]' in manifest
          manifest=manifest.replace('[patch.crates-io]','[patch.crates-io]\nwgpu-core = { path = "vendor/wgpu-core-30.0.1" }',1);p.write_text(manifest)
          p=target/'NOTICE';p.write_text(p.read_text()+'''\nIW4C iPhone memory adaptation: wgpu-core 30.0.1 (gfx-rs, MIT OR Apache-2.0),
          verified official crate SHA256 14c018fce9b6270aa203c2fdd56f3cce996713534bd757e4ea58c8560b121f14.
          Changes: src/device/resource.rs releases completed render-pipeline compiler
