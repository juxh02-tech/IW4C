          (p/'lib.rs').write_text("use bevy_ecs::prelude::*;\n#[derive(Message)] struct Touch(f32);\n#[derive(Resource, Default)] struct Seen(Vec<f32>);\nfn fixed(mut touches: MessageMutator<Touch>) {\n    for touch in touches.read() { touch.0 *= 0.5; }\n}\nfn broken(mut touches: ResMut<Messages<Touch>>) {\n    let pending: Vec<_> = touches.drain().collect();\n    for mut touch in pending { touch.0 *= 0.5; touches.write(touch); }\n}\nfn observe(mut touches: MessageReader<Touch>, mut seen: ResMut<Seen>) {\n    seen.0.extend(touches.read().map(|touch| touch.0));\n}\nfn world() -> World {\n    let mut world = World::new();\n    world.init_resource::<Messages<Touch>>(); world.init_resource::<Seen>(); world\n}\n#[test]\nfn a_gesture_is_remapped_once_and_does_not_repeat_without_new_input() {\n    let mut world = world(); let mut schedule = Schedule::default();\n    schedule.add_systems((fixed, observe).chain());\n    world.write_message(Touch(8.0)); schedule.run(&mut world);\n    assert_eq!(world.resource::<Seen>().0, [4.0]);\n    world.resource_mut::<Messages<Touch>>().update(); schedule.run(&mut world);\n    assert_eq!(world.resource::<Seen>().0, [4.0]);\n    world.write_message(Touch(10.0)); schedule.run(&mut world);\n    assert_eq!(world.resource::<Seen>().0, [4.0,5.0]);\n    for _ in 0..4 { world.resource_mut::<Messages<Touch>>().update(); schedule.run(&mut world); }\n    assert_eq!(world.resource::<Seen>().0, [4.0,5.0]);\n}\n#[test]\nfn previous_drain_rewrite_reproduces_input_without_a_new_gesture() {\n    let mut world = world(); let mut schedule = Schedule::default();\n    schedule.add_systems((broken, observe).chain());\n    world.write_message(Touch(8.0)); schedule.run(&mut world);\n    world.resource_mut::<Messages<Touch>>().update(); schedule.run(&mut world);\n    world.resource_mut::<Messages<Touch>>().update(); schedule.run(&mut world);\n    assert_eq!(world.resource::<Seen>().0, [4.0,2.0,1.0]);\n}\n")
