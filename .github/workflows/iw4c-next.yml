          policy; src/lib.rs declares it. Native Metal pipeline libraries and layouts
          remain retained. Other backends and compute pipelines are unchanged.
          Adapted from IW4 Pocket's IW4L_LEAN_SHADERS work credited to treuenten.
          Original dependency licenses remain in vendor/wgpu-core-30.0.1.\n''')
          (target/'ios/Info.plist').write_bytes(plistlib.dumps(info))
          out=Path('outputs/IW4C-next'); out.mkdir(parents=True,exist_ok=True)
          report=dict(basis='jesaias1/IW4LJ ios-v0.2.0',bundle_identifier=info['CFBundleIdentifier'],display_name=info['CFBundleDisplayName'],workspace_members_checked=len(config['workspace']['members']),dependency_paths_checked=True,compiled=False,installed=False,gameplay_verified=False,existing_app_modified=False)
          (out/'preparation.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
