name: IW4C alternative engine
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: branding
      - uses: actions/checkout@v4
        with:
          repository: jesaias1/IW4LJ
          ref: 72d7154c3a447aa14afba340f27e9ca4a539f450
          path: upstream
      - name: Prepare IW4C source and preserve attribution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import plistlib
          import tomllib
          import json
          
          source=Path('upstream')
          target=Path('candidate')
          assert not target.exists(), 'Refuse to overwrite an existing candidate'
          shutil.copytree(source/'IW4LJ-iOS',target)
          shared=source/'IW4LJ-Android'
          for name in ['Cargo.toml','Cargo.lock','LICENSE','NOTICE','THIRD-PARTY-LICENSES.txt']:
              shutil.copyfile(shared/name,target/name)
          if (shared/'vendor').exists(): shutil.copytree(shared/'vendor',target/'vendor',dirs_exist_ok=True)
          shutil.copytree(shared/'xtask',target/'xtask',dirs_exist_ok=True)
          manifest=target/'Cargo.toml'
          text=manifest.read_text().replace('members = [','members = [\n    "crates/ios",\n    "crates/mobile",',1)
          manifest.write_text(text)
          config=tomllib.loads(text)
          for member in config['workspace']['members']:
              assert (target/member/'Cargo.toml').exists(), f'Missing workspace member: {member}'
          for name,dependency in config['workspace']['dependencies'].items():
              if isinstance(dependency,dict) and 'path' in dependency:
                  assert (target/dependency['path']/'Cargo.toml').exists(), f'Missing dependency: {name}'
          # Preserve the existing game-data path so a future trial can reuse this user's
          # IW4C container without migrating/deleting its six gigabytes of assets.
          entry=target/'crates/ios/src/lib.rs'
          entry.write_text(entry.read_text().replace('dirs.files.join("mw2")','dirs.files.join("Games").join("MW2")'))
          mobile=target/'crates/mobile/src/lib.rs'
          text=mobile.read_text()
          needle='    for base in [media, files] {\n        let candidate = base.join("mw2");'
          replacement='    for base in [media, files] {\n        let candidate = base.join("Games").join("MW2");\n        if candidate.join("zone").is_dir() { return candidate; }\n        let candidate = base.join("mw2");'
          assert needle in text
          text=text.replace(needle,replacement,1)
          mobile.write_text(text)
          if 'dirs.files.join("mw2")' in text:
              text=text.replace('dirs.files.join("mw2")','dirs.files.join("Games").join("MW2")')
              mobile.write_text(text)
          menu=target/'crates/touch/src/menu.rs'
          text=menu.read_text()
          assert 'IW4LJ  //  MENU' in text
          menu.write_text(text.replace('IW4LJ  //  MENU','IW4C  //  CUPIDON',1))
          
          # Read each native iOS gesture once; preserve its message ID and lifetime.
          ios_touch=target/'crates/touch/src/ios.rs'
          text=ios_touch.read_text()
          text=text.replace('use bevy::ecs::system::NonSendMarker;', 'use bevy::ecs::system::NonSendMarker;\nuse bevy::ecs::message::MessageMutator;')
          text=text.replace('mut touches: ResMut<Messages<TouchInput>>,', 'mut touches: MessageMutator<TouchInput>,')
          text=text.replace('    let pending: Vec<TouchInput> = touches.drain().collect();\n    for mut touch in pending {', '    // Preserve event identity: never requeue old gestures.\n    for touch in touches.read() {')
          text=text.replace('        touches.write(touch);\n','')
          assert 'touches.drain()' not in text
          ios_touch.write_text(text)
          
          
          # Native text entry for all scripted menu edit fields.
          (target/'crates/frame/src/ui/native_text.rs').write_text('//! Text-field handoff between the game loop and the native iOS main thread.\n//! Values (especially passwords) must never be logged.\nuse std::sync::Mutex;\n#[derive(Clone)]\npub struct Request { pub id: u64, pub title: String, pub value: String, pub max_chars: usize, pub masked: bool }\npub struct Reply { pub id: u64, pub value: Option<String> }\nstruct State { serial: u64, pending: Option<Request>, reply: Option<Reply> }\nstatic STATE: Mutex<State> = Mutex::new(State { serial: 0, pending: None, reply: None });\npub fn request(title: String, value: String, max_chars: usize, masked: bool) -> u64 {\n    let mut state = STATE.lock().unwrap_or_else(|e| e.into_inner());\n    state.serial += 1;\n    let id = state.serial;\n    state.reply = None;\n    state.pending = Some(Request { id, title, value, max_chars, masked });\n    id\n}\npub fn take_request() -> Option<Request> { STATE.lock().ok()?.pending.take() }\npub fn finish(id: u64, value: Option<String>) {\n    if let Ok(mut state) = STATE.lock() {\n        if state.serial == id { state.reply = Some(Reply { id, value }); }\n    }\n}\npub fn take_reply(id: u64) -> Option<Reply> {\n    let mut state = STATE.lock().ok()?;\n    if state.reply.as_ref().is_some_and(|reply| reply.id == id) { state.reply.take() } else { None }\n}\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn reply_is_delivered_once_to_its_own_field_and_cancel_preserves_absence() {\n        let old = request("Name".into(), "Before".into(), 15, false);\n        let request1 = take_request().unwrap();\n        assert_eq!(request1.value, "Before"); assert!(take_request().is_none());\n        let current = request("Password".into(), String::new(), 64, true);\n        assert!(take_request().unwrap().masked);\n        finish(old, Some("stale".into())); assert!(take_reply(current).is_none());\n        finish(current, Some("valid".into())); assert!(take_reply(old).is_none());\n        assert_eq!(take_reply(current).unwrap().value.as_deref(), Some("valid"));\n        assert!(take_reply(current).is_none());\n        let cancel = request("Name".into(), "Before".into(), 15, false);\n        finish(cancel, None); assert!(take_reply(cancel).unwrap().value.is_none());\n    }\n}\n')
          (target/'crates/frame/src/ui/mod.rs').write_text('use bevy::prelude::*;\n\npub mod audio;\npub mod input;\npub mod menu;\npub mod native_text;\n\npub use audio::{UiPlayMusic, UiPlaySound, UiStopMusic};\npub use input::{UiBindRequest, UiBindingCapture};\npub use menu::{\n    FrontendContentLoading, HostMatchRules, UiExecCommand, UiMenuDvars, UiMenuKey, UiMenuRequest,\n    UiPartyState,\n};\n\npub fn register_ui_contracts(app: &mut App) {\n    app.init_resource::<UiMenuDvars>()\n        .init_resource::<UiBindingCapture>()\n        .init_resource::<UiPartyState>()\n        .add_message::<UiBindRequest>()\n        .add_message::<UiPlaySound>()\n        .add_message::<UiPlayMusic>()\n        .add_message::<UiStopMusic>()\n        .add_message::<UiExecCommand>()\n        .add_message::<UiMenuRequest>();\n}\n')
          (target/'crates/hud/src/menus/state.rs').write_text('use bevy::prelude::*;\nuse frame::AppScreen;\n\n#[derive(Clone, Debug, Default)]\npub(crate) struct ItemState {\n    pub(crate) hidden: bool,\n    pub(crate) fore: Option<[f32; 4]>,\n    pub(crate) back: Option<[f32; 4]>,\n}\n\n#[derive(Clone, Debug)]\npub(crate) struct OpenMenu {\n    pub(crate) name: String,\n    pub(crate) captures_input: bool,\n    pub(crate) focus: Option<usize>,\n    pub(crate) hover: Option<usize>,\n    pub(crate) items: Vec<ItemState>,\n}\n\n#[derive(Clone, Debug)]\npub(crate) struct EditState {\n    pub(crate) native_prompt: Option<u64>,\n    pub(crate) menu: String,\n    pub(crate) item: usize,\n    pub(crate) buffer: Vec<char>,\n    pub(crate) cursor: usize,\n    pub(crate) max_chars: usize,\n}\n\n#[derive(Resource, Default)]\npub struct ScriptMenus {\n    pub(crate) stack: Vec<OpenMenu>,\n    pub(crate) applied_serial: u32,\n    pub(crate) responses: Vec<(String, String)>,\n    pub(crate) exec: Vec<String>,\n    pub(crate) sounds: Vec<String>,\n    pub(crate) reported: std::collections::HashSet<String>,\n    pub(crate) screen: Option<AppScreen>,\n    pub(crate) cursor: Option<Vec2>,\n    pub(crate) editing: Option<EditState>,\n    pub(crate) slider_drag: Option<(String, usize)>,\n    pub(crate) binding_menu: Option<String>,\n    pub(crate) bind_requests: Vec<String>,\n}\n\nimpl ScriptMenus {\n    pub fn captures_input(&self) -> bool {\n        self.input_menu().is_some()\n    }\n\n    pub(crate) fn input_menu(&self) -> Option<&OpenMenu> {\n        self.stack.iter().rev().find(|menu| menu.captures_input)\n    }\n\n    pub fn open_names(&self) -> Vec<String> {\n        self.stack.iter().map(|m| m.name.clone()).collect()\n    }\n\n    pub fn focused_item(&self) -> Option<(&str, usize)> {\n        let menu = self.input_menu()?;\n        Some((&menu.name, menu.focus?))\n    }\n\n    pub fn focused_item_in(&self, name: &str) -> Option<usize> {\n        self.stack.get(self.position(name)?)?.focus\n    }\n\n    pub(crate) fn position(&self, name: &str) -> Option<usize> {\n        self.stack\n            .iter()\n            .position(|m| m.name.eq_ignore_ascii_case(name))\n    }\n\n    pub(crate) fn get_mut(&mut self, name: &str) -> Option<&mut OpenMenu> {\n        let pos = self.position(name)?;\n        self.stack.get_mut(pos)\n    }\n}\n')
          (target/'crates/hud/src/menus/runtime.rs').write_text('use asset_game::{MenuCatalog, MenuDef, MenuEvent};\nuse bevy::prelude::*;\n\nuse super::host::{MenuHost, MenuWorld};\nuse super::script::{self, Command};\nuse super::state::{EditState, ItemState, OpenMenu, ScriptMenus};\nuse super::{DVAR_FOCUS, MAX_SCRIPT_DEPTH, choice_index, is_focusable, item_rect};\nuse crate::expr_cache::MenuExprCache;\nuse crate::playercard::UiLocalVars;\npub(crate) struct Runner<\'a, \'w> {\n    pub(crate) catalog: &\'a MenuCatalog,\n    pub(crate) world: &\'a MenuWorld<\'w>,\n    pub(crate) menus: &\'a mut ScriptMenus,\n    pub(crate) locals: &\'a mut UiLocalVars,\n    pub(crate) exprs: &\'a mut MenuExprCache,\n    pub(crate) dvars: &\'a mut frame::UiMenuDvars,\n    pub(crate) depth: u32,\n    pub(crate) binding: &\'a mut frame::UiBindingCapture,\n}\n\nimpl Runner<\'_, \'_> {\n    pub(crate) fn def(&self, name: &str) -> Option<&MenuDef> {\n        self.catalog.get(name)\n    }\n\n    pub(crate) fn eval(&mut self, menu: &str, dump: &str) -> Option<hud_iw4::Operand> {\n        let def = self.catalog.get(menu)?;\n        let open = self.menus.open_names();\n        let focus_rect = self\n            .menus\n            .stack\n            .iter()\n            .find(|m| m.name.eq_ignore_ascii_case(menu))\n            .and_then(|m| m.focus)\n            .and_then(|i| def.items.get(i))\n            .map(item_rect);\n        let host = MenuHost {\n            world: self.world,\n            dvars: self.dvars,\n            menu: def,\n            locals: self.locals,\n            open: &open,\n            focus_rect,\n        };\n        match self.exprs.evaluate(dump, &host) {\n            Ok(value) => Some(value),\n            Err(err) => {\n                diag::debug!(Ui, "menu {menu}: expression failed {err:?}");\n                None\n            }\n        }\n    }\n\n    pub(crate) fn run_events(&mut self, menu: &str, item: Option<usize>, events: &[MenuEvent]) {\n        if self.depth >= MAX_SCRIPT_DEPTH {\n            diag::warn!(Ui, "menu {menu}: script nesting too deep");\n            return;\n        }\n        self.depth += 1;\n        let mut last_if: Option<bool> = None;\n        for event in events {\n            match event {\n                MenuEvent::Script(text) => {\n                    last_if = None;\n                    for command in script::parse(text) {\n                        self.command(menu, item, command);\n                    }\n                }\n                MenuEvent::If { condition, then } => {\n                    let pass = self\n                        .eval(menu, condition)\n                        .is_some_and(|v| hud_iw4::expr::source_int(&v) != 0);\n                    last_if = Some(pass);\n                    if pass {\n                        self.run_events(menu, item, then);\n                    }\n                }\n                MenuEvent::Else(body) => {\n                    if last_if == Some(false) {\n                        self.run_events(menu, item, body);\n                    }\n                    last_if = None;\n                }\n                MenuEvent::SetLocalVar { kind, name, expr } => {\n                    last_if = None;\n                    let Some(value) = self.eval(menu, expr) else {\n                        continue;\n                    };\n                    match kind {\n                        3 | 4 => self.locals.set_int(name, hud_iw4::expr::source_int(&value)),\n                        5 => self\n                            .locals\n                            .set_float(name, hud_iw4::expr::source_float(&value)),\n                        _ => self\n                            .locals\n                            .set_string(name, hud_iw4::expr::source_str(&value)),\n                    }\n                }\n            }\n        }\n        self.depth -= 1;\n    }\n\n    pub(crate) fn command(&mut self, menu: &str, item: Option<usize>, command: Command) {\n        let target = |name: &str| {\n            if name.eq_ignore_ascii_case("self") {\n                menu.to_owned()\n            } else {\n                name.to_owned()\n            }\n        };\n        match command {\n            Command::Open(name) => self.open(&name),\n            Command::Close(name) => self.close(&target(&name)),\n            Command::Escape(name) => self.escape(&target(&name)),\n            Command::SetFocus(name) => {\n                let Some(def) = self.def(menu) else {\n                    return;\n                };\n                if let Some(index) = def\n                    .items\n                    .iter()\n                    .position(|i| i.name.eq_ignore_ascii_case(&name) && is_focusable(i))\n                {\n                    self.set_focus(menu, index);\n                }\n            }\n            Command::FocusFirst => self.focus_step(menu, 1, true),\n            Command::SetItemColor {\n                item: name,\n                field,\n                color,\n            } => {\n                self.each_item(menu, item, &name, |state| match field.as_str() {\n                    "backcolor" => state.back = Some(color),\n                    "forecolor" => state.fore = Some(color),\n                    _ => {}\n                });\n            }\n            Command::Show(name) => self.each_item(menu, item, &name, |state| state.hidden = false),\n            Command::Hide(name) => self.each_item(menu, item, &name, |state| state.hidden = true),\n            Command::Play(alias) => self.menus.sounds.push(alias),\n            Command::ScriptMenuResponse(response) => {\n                self.menus.responses.push((menu.to_owned(), response));\n            }\n            Command::Exec(text) => self.exec(text),\n            Command::CopyDvar(name, source) => {\n                let value = self.dvar(&source).unwrap_or_default().to_owned();\n                self.dvars.set(&name, value);\n            }\n            Command::SetDvar(name, value) => self.set_dvar(&name, &value),\n            Command::ExecOnDvarIntValue {\n                dvar,\n                value,\n                command,\n            } => {\n                let current = self\n                    .dvar(&dvar)\n                    .and_then(|s| s.parse::<f32>().ok())\n                    .unwrap_or(0.0) as i32;\n                if current == value {\n                    self.exec(command);\n                }\n            }\n            Command::ExecOnDvarStringValue {\n                dvar,\n                value,\n                command,\n            } => {\n                let current = self.dvar(&dvar);\n                if current.is_some_and(|c| c.eq_ignore_ascii_case(&value)) {\n                    self.exec(command);\n                }\n            }\n            Command::OpenForGameType(format) => {\n                let name = self.for_game_type(menu, item, &format);\n                self.open(&name);\n            }\n            Command::CloseForGameType(format) => {\n                let name = self.for_game_type(menu, item, &format);\n                self.close(&name);\n            }\n            Command::SetFocusByDvar(dvar) => {\n                let Some(def) = self.def(menu) else {\n                    return;\n                };\n                let found = def.items.iter().position(|i| {\n                    i.dvar_flags & DVAR_FOCUS != 0\n                        && i.dvar_test.eq_ignore_ascii_case(&dvar)\n                        && self.enable_via_dvar(i, DVAR_FOCUS)\n                        && is_focusable(i)\n                });\n                if let Some(index) = found {\n                    self.set_focus(menu, index);\n                }\n            }\n            Command::MenuOnDvar {\n                open,\n                want_match,\n                dvar,\n                value,\n                menu: target_menu,\n            } => {\n                let Some(current) = self.dvar(&dvar) else {\n                    diag::debug!(Ui, "menu {menu}: menu-on-dvar cannot find dvar {dvar}");\n                    return;\n                };\n                if current.eq_ignore_ascii_case(&value) == want_match {\n                    if open {\n                        self.open(&target_menu);\n                    } else {\n                        self.close(&target(&target_menu));\n                    }\n                }\n            }\n            Command::Unhandled(name) => {\n                diag::debug!(Ui, "menu {menu}: script command `{name}` not run");\n            }\n        }\n    }\n\n    /// `toggle` and cfg `exec` land in the menu dvars before the next script\n    /// command runs, so a following `execNowOnDvarIntValue` sees the result.\n    pub(crate) fn exec(&mut self, text: String) {\n        let words: Vec<&str> = text\n            .split_whitespace()\n            .map(|word| word.trim_matches(\'"\'))\n            .collect();\n        match words.as_slice() {\n            ["toggle", name, values @ ..] => {\n                let current = self.dvar(name).unwrap_or("0");\n                let next = match values {\n                    [] => {\n                        if current.parse::<f32>().is_ok_and(|n| n != 0.0) {\n                            "0"\n                        } else {\n                            "1"\n                        }\n                    }\n                    _ => {\n                        let choices: Vec<_> = values\n                            .iter()\n                            .map(|v| (String::new(), (*v).to_owned()))\n                            .collect();\n                        values\n                            [choice_index(&choices, current).map_or(0, |i| (i + 1) % values.len())]\n                    }\n                };\n                self.set_dvar(name, next);\n            }\n            ["exec", file] if file.ends_with(".cfg") => {\n                let Some(config) = self.catalog.rawfile_text(file) else {\n                    self.menus.exec.push(text);\n                    return;\n                };\n                let defaults = self\n                    .catalog\n                    .rawfile_text("default_xboxlive.cfg")\n                    .unwrap_or("");\n                for line in config.lines() {\n                    let mut words = line.split_whitespace();\n                    match (words.next(), words.next(), words.next()) {\n                        (Some("set" | "seta"), Some(name), value) => {\n                            self.set_dvar(name, value.unwrap_or("").trim_matches(\'"\'));\n                        }\n                        (Some("reset"), Some(name), _) => {\n                            if let Some(value) = defaults.lines().find_map(|line| {\n                                let mut words = line.split_whitespace();\n                                (words.next() == Some("set")\n                                    && words.next().is_some_and(|n| n.eq_ignore_ascii_case(name)))\n                                .then(|| words.next().unwrap_or("").trim_matches(\'"\'))\n                            }) {\n                                self.set_dvar(name, value);\n                            }\n                        }\n                        _ => {}\n                    }\n                }\n            }\n            _ => self.menus.exec.push(text),\n        }\n    }\n\n    pub(crate) fn set_dvar(&mut self, name: &str, value: &str) {\n        self.dvars.set(name, value);\n        self.menus.exec.push(format!("set {name} \\"{value}\\""));\n    }\n\n    pub(crate) fn dvar(&self, name: &str) -> Option<&str> {\n        self.dvars\n            .get(name)\n            .or_else(|| self.world.dvars.as_ref().and_then(|d| d.string(name)))\n    }\n\n    pub(crate) fn for_game_type(&self, menu: &str, item: Option<usize>, format: &str) -> String {\n        let value = item\n            .and_then(|i| self.def(menu)?.items.get(i))\n            .and_then(|i| self.dvar(&i.dvar))\n            .unwrap_or("");\n        format.replacen("%s", value, 1)\n    }\n\n    pub(crate) fn enable_via_dvar(&self, item: &asset_game::MenuItem, flag: i32) -> bool {\n        if item.enable_dvar.is_empty() || item.dvar_test.is_empty() {\n            return true;\n        }\n        let value = self.dvar(&item.dvar_test).unwrap_or("");\n        let listed = script::tokens(&item.enable_dvar)\n            .iter()\n            .any(|v| v.eq_ignore_ascii_case(value));\n        listed == (item.dvar_flags & flag != 0)\n    }\n\n    pub(crate) fn each_item(\n        &mut self,\n        menu: &str,\n        current: Option<usize>,\n        name: &str,\n        mut apply: impl FnMut(&mut ItemState),\n    ) {\n        let Some(def) = self.catalog.get(menu) else {\n            return;\n        };\n        let Some(open) = self.menus.get_mut(menu) else {\n            return;\n        };\n        if name.eq_ignore_ascii_case("self") {\n            if let Some(state) = current.and_then(|i| open.items.get_mut(i)) {\n                apply(state);\n            }\n            return;\n        }\n        for (index, item) in def.items.iter().enumerate() {\n            if item.name.eq_ignore_ascii_case(name)\n                && let Some(state) = open.items.get_mut(index)\n            {\n                apply(state);\n            }\n        }\n    }\n\n    pub(crate) fn open(&mut self, name: &str) {\n        let catalog = self.catalog;\n        let Some(def) = catalog.get(name) else {\n            diag::warn!(Ui, "menu open: `{name}` is not loaded");\n            return;\n        };\n        if let Some(pos) = self.menus.position(name) {\n            let open = self.menus.stack.remove(pos);\n            self.menus.stack.push(open);\n            return;\n        }\n        self.menus.stack.push(OpenMenu {\n            name: def.name.clone(),\n            captures_input: def.static_flags & super::WINDOW_DECORATION == 0,\n            focus: None,\n            hover: None,\n            items: vec![ItemState::default(); def.items.len()],\n        });\n        diag::info!(Ui, "menu open: {}", def.name);\n        let name = def.name.clone();\n        self.run_events(&name, None, &def.handlers.open);\n        if self\n            .menus\n            .get_mut(&name)\n            .is_some_and(|open| open.focus.is_none())\n        {\n            self.focus_step(&name, 1, true);\n        }\n    }\n\n    pub(crate) fn close(&mut self, name: &str) {\n        if self\n            .menus\n            .editing\n            .as_ref()\n            .is_some_and(|edit| edit.menu.eq_ignore_ascii_case(name))\n        {\n            self.menus.editing = None;\n        }\n        let catalog = self.catalog;\n        if self.menus.position(name).is_none() {\n            return;\n        }\n        if let Some(def) = catalog.get(name) {\n            self.run_events(name, None, &def.handlers.close);\n        }\n        if let Some(pos) = self.menus.position(name) {\n            self.menus.stack.remove(pos);\n            diag::info!(Ui, "menu close: {name}");\n        }\n    }\n\n    pub(crate) fn close_all(&mut self) {\n        while let Some(top) = self.menus.stack.last().map(|m| m.name.clone()) {\n            self.close(&top);\n        }\n    }\n\n    pub(crate) fn escape(&mut self, name: &str) {\n        let catalog = self.catalog;\n        let Some(def) = catalog.get(name) else {\n            return;\n        };\n        if def.handlers.esc.is_empty() {\n            self.close(name);\n        } else {\n            self.run_events(name, None, &def.handlers.esc);\n        }\n    }\n\n    pub(crate) fn set_focus(&mut self, menu: &str, index: usize) {\n        let catalog = self.catalog;\n        let Some(def) = catalog.get(menu) else {\n            return;\n        };\n        let Some(open) = self.menus.get_mut(menu) else {\n            return;\n        };\n        let old = open.focus;\n        if old == Some(index) {\n            return;\n        }\n        open.focus = Some(index);\n        if let Some(old) = old.and_then(|i| def.items.get(i).map(|item| (i, item))) {\n            self.run_events(menu, Some(old.0), &old.1.handlers.leave_focus);\n        }\n        if let Some(item) = def.items.get(index) {\n            if !item.focus_sound.is_empty() {\n                self.menus.sounds.push(item.focus_sound.clone());\n            }\n            self.run_events(menu, Some(index), &item.handlers.focus);\n        }\n    }\n\n    pub(crate) fn set_hover(&mut self, menu: &str, index: Option<usize>) {\n        let catalog = self.catalog;\n        let Some(def) = catalog.get(menu) else {\n            return;\n        };\n        let Some(open) = self.menus.get_mut(menu) else {\n            return;\n        };\n        let old = open.hover;\n        if old == index {\n            if let Some(index) = index {\n                self.set_focus(menu, index);\n            }\n            return;\n        }\n        open.hover = index;\n        if let Some(old) = old.and_then(|i| def.items.get(i).map(|item| (i, item))) {\n            self.run_events(menu, Some(old.0), &old.1.handlers.mouse_exit);\n        }\n        if let Some(index) = index {\n            if let Some(item) = def.items.get(index) {\n                self.run_events(menu, Some(index), &item.handlers.mouse_enter);\n            }\n            self.set_focus(menu, index);\n        }\n    }\n\n    pub(crate) fn focus_step(&mut self, menu: &str, step: i32, first: bool) {\n        let catalog = self.catalog;\n        let Some(def) = catalog.get(menu) else {\n            return;\n        };\n        let visible = self.visible_items(menu);\n        let candidates: Vec<usize> = (0..def.items.len())\n            .filter(|&i| is_focusable(&def.items[i]) && visible.contains(&i))\n            .collect();\n        if candidates.is_empty() {\n            return;\n        }\n        let current = self.menus.get_mut(menu).and_then(|m| m.focus);\n        let next = match (\n            first,\n            current.and_then(|c| candidates.iter().position(|&i| i == c)),\n        ) {\n            (false, Some(at)) => {\n                let n = candidates.len() as i32;\n                candidates[((at as i32 + step).rem_euclid(n)) as usize]\n            }\n            _ => {\n                if step < 0 {\n                    candidates[candidates.len() - 1]\n                } else {\n                    candidates[0]\n                }\n            }\n        };\n        self.set_focus(menu, next);\n    }\n\n    pub(crate) fn focus_nav(&mut self, menu: &str, dx: i32, dy: i32) -> bool {\n        let catalog = self.catalog;\n        let Some(def) = catalog.get(menu) else {\n            return false;\n        };\n        let current = self.menus.get_mut(menu).and_then(|m| m.focus);\n        let visible = self.visible_items(menu);\n        let candidates: Vec<(usize, [f32; 4])> = (0..def.items.len())\n            .filter(|&i| is_focusable(&def.items[i]) && visible.contains(&i))\n            .map(|i| (i, nav_rect(&def.items[i])))\n            .collect();\n        let Some(&(at, here)) = current.and_then(|c| candidates.iter().find(|(i, _)| *i == c))\n        else {\n            if dx != 0 {\n                return false;\n            }\n            self.focus_step(menu, dy, true);\n            return true;\n        };\n        let centre = |r: [f32; 4]| [(r[0] + r[2]) * 0.5, (r[1] + r[3]) * 0.5];\n        let c = centre(here);\n        let same_column = |r: [f32; 4]| {\n            let o = centre(r);\n            (r[0] <= c[0] && c[0] <= r[2]) || (here[0] <= o[0] && o[0] <= here[2])\n        };\n        let others = candidates.iter().filter(|(i, _)| *i != at);\n        let next = if dy != 0 {\n            let dir = dy.signum() as f32;\n            let column: Vec<_> = others.filter(|(_, r)| same_column(*r)).collect();\n            let ahead = column\n                .iter()\n                .filter(|(_, r)| (centre(*r)[1] - c[1]) * dir > 0.5)\n                .min_by(|a, b| {\n                    let da = (centre(a.1)[1] - c[1]).abs();\n                    let db = (centre(b.1)[1] - c[1]).abs();\n                    da.total_cmp(&db)\n                });\n            let wrapped = || {\n                column\n                    .iter()\n                    .min_by(|a, b| (centre(a.1)[1] * dir).total_cmp(&(centre(b.1)[1] * dir)))\n            };\n            match ahead.or_else(wrapped) {\n                Some((index, _)) => *index,\n                None => {\n                    self.focus_step(menu, dy, false);\n                    return true;\n                }\n            }\n        } else {\n            let dir = dx.signum() as f32;\n            let Some((index, _)) = others\n                .filter(|(_, r)| !same_column(*r) && (centre(*r)[0] - c[0]) * dir > 0.0)\n                .min_by(|a, b| {\n                    let score = |r: [f32; 4]| {\n                        let o = centre(r);\n                        (o[1] - c[1]).abs() * 4.0 + (o[0] - c[0]).abs()\n                    };\n                    score(a.1).total_cmp(&score(b.1))\n                })\n            else {\n                return false;\n            };\n            *index\n        };\n        self.set_focus(menu, next);\n        true\n    }\n\n    pub(crate) fn visible_items(&mut self, menu: &str) -> Vec<usize> {\n        let Some(def) = self.catalog.get(menu) else {\n            return Vec::new();\n        };\n        let hidden: Vec<bool> = self\n            .menus\n            .stack\n            .iter()\n            .find(|m| m.name.eq_ignore_ascii_case(menu))\n            .map(|m| m.items.iter().map(|s| s.hidden).collect())\n            .unwrap_or_default();\n        let (def, _) = crate::killcam_skip::inherit_shared_vis(def);\n        let open = self.menus.open_names();\n        let host = MenuHost {\n            world: self.world,\n            dvars: self.dvars,\n            menu: &def,\n            locals: self.locals,\n            open: &open,\n            focus_rect: None,\n        };\n        let mut out = Vec::new();\n        for (index, item) in def.items.iter().enumerate() {\n            if hidden.get(index).copied().unwrap_or(false) {\n                continue;\n            }\n            let enabled = item.disabled_exp.is_empty()\n                || matches!(self.exprs.is_true(&item.disabled_exp, &host), Ok(false));\n            if enabled && matches!(self.exprs.is_true(&item.vis_exp, &host), Ok(true)) {\n                out.push(index);\n            }\n        }\n        out\n    }\n\n    pub(crate) fn adjust(&mut self, menu: &str, index: usize, step: i32) -> bool {\n        if !self.visible_items(menu).contains(&index) {\n            return false;\n        }\n        let Some(item) = self.catalog.get(menu).and_then(|d| d.items.get(index)) else {\n            return false;\n        };\n        if item.dvar.is_empty() {\n            return false;\n        }\n        let current = self.dvar(&item.dvar).unwrap_or_default();\n        let value = if let Some(slider) = &item.slider {\n            let current = current.parse::<f32>().unwrap_or(slider.min);\n            (current + step as f32 * slider.step)\n                .clamp(slider.min, slider.max)\n                .to_string()\n        } else if !item.choices.is_empty() {\n            let at = choice_index(&item.choices, current).unwrap_or(0);\n            let next = (at as i32 + step).rem_euclid(item.choices.len() as i32) as usize;\n            item.choices[next].1.clone()\n        } else {\n            return false;\n        };\n        self.dvars.set(&item.dvar, &value);\n        self.menus\n            .exec\n            .push(format!("set {} \\"{}\\"", item.dvar, value));\n        self.run_events(menu, Some(index), &item.handlers.action);\n        true\n    }\n\n    pub(crate) fn slide(&mut self, menu: &str, index: usize, fraction: f32) -> bool {\n        if !self.visible_items(menu).contains(&index) {\n            return false;\n        }\n        let Some(item) = self.catalog.get(menu).and_then(|d| d.items.get(index)) else {\n            return false;\n        };\n        let Some(slider) = &item.slider else {\n            return false;\n        };\n        let value = slider.min + fraction.clamp(0.0, 1.0) * (slider.max - slider.min);\n        let value = (slider.min + ((value - slider.min) / slider.step).round() * slider.step)\n            .clamp(slider.min, slider.max)\n            .to_string();\n        self.dvars.set(&item.dvar, &value);\n        self.menus\n            .exec\n            .push(format!("set {} \\"{}\\"", item.dvar, value));\n        true\n    }\n\n    pub(crate) fn activate(&mut self, menu: &str, index: usize, accept: bool) {\n        if self\n            .catalog\n            .get(menu)\n            .and_then(|def| def.items.get(index))\n            .is_some_and(|item| super::class_unavailable(menu, item, self.dvars).is_some())\n        {\n            return;\n        }\n        if self.adjust(menu, index, 1) {\n            return;\n        }\n        if !self.visible_items(menu).contains(&index) {\n            return;\n        }\n        let catalog = self.catalog;\n        let Some(item) = catalog.get(menu).and_then(|d| d.items.get(index)) else {\n            return;\n        };\n        if item.item_type == 14 && !item.dvar.is_empty() {\n            self.binding.command = Some(item.dvar.clone());\n            self.menus.binding_menu = Some(menu.to_owned());\n            self.menus.bind_requests.push(item.dvar.clone());\n            self.run_events(menu, Some(index), &item.handlers.action);\n            return;\n        }\n        if item.item_type == 4 && !item.dvar.is_empty() {\n            let max_chars = item\n                .edit_field\n                .as_ref()\n                .map_or(32, |field| field.max_chars)\n                .min(4096);\n            let buffer: Vec<char> = self\n                .dvars\n                .get(&item.dvar)\n                .unwrap_or_default()\n                .chars()\n                .take(max_chars)\n                .collect();\n            let native_prompt = if cfg!(target_os = "ios") {\n                let masked = item.edit_field.as_ref().is_some_and(|field| field.masked);\n                let title = if masked { "Mot de passe" }\n                    else if item.dvar.contains("name") { "Modifier le nom" }\n                    else { "Modifier le texte" };\n                Some(frame::ui::native_text::request(title.into(), buffer.iter().collect(), max_chars, masked))\n            } else { None };\n            self.menus.editing = Some(EditState {\n                native_prompt,\n                menu: menu.to_owned(),\n                item: index,\n                cursor: buffer.len(),\n                buffer,\n                max_chars,\n            });\n            return;\n        }\n        let events = if accept && !item.handlers.accept.is_empty() {\n            &item.handlers.accept\n        } else {\n            &item.handlers.action\n        };\n        self.run_events(menu, Some(index), events);\n    }\n}\n\nfn nav_rect(item: &asset_game::MenuItem) -> [f32; 4] {\n    let r = &item.rect;\n    let ox = match r.horz_align {\n        2 => 320.0,\n        3 => 640.0,\n        _ => 0.0,\n    };\n    let oy = match r.vert_align {\n        2 => 240.0,\n        3 => 480.0,\n        _ => 0.0,\n    };\n    let (x0, x1) = (r.x + ox, r.x + ox + r.w);\n    let (y0, y1) = (r.y + oy, r.y + oy + r.h);\n    [x0.min(x1), y0.min(y1), x0.max(x1), y0.max(y1)]\n}\n')
          (target/'crates/hud/src/menus/mod.rs').write_text('mod host;\nmod runtime;\nmod script;\nmod state;\n\nuse runtime::Runner;\nuse state::OpenMenu;\npub use state::ScriptMenus;\n\n#[derive(bevy::prelude::Resource, Default)]\npub struct FrontendMenus {\n    menus: ScriptMenus,\n    restore_lobby: bool,\n}\n\n#[derive(bevy::ecs::system::SystemParam)]\npub struct MenuState<\'w> {\n    scoped: Option<bevy::prelude::Res<\'w, ScriptMenus>>,\n    frontend: Option<bevy::prelude::Res<\'w, FrontendMenus>>,\n}\nimpl MenuState<\'_> {\n    pub fn as_ref(&self) -> Option<&ScriptMenus> {\n        self.scoped\n            .as_deref()\n            .or_else(|| self.frontend.as_deref().map(|menus| &menus.menus))\n    }\n    pub fn as_deref(&self) -> Option<&ScriptMenus> {\n        self.as_ref()\n    }\n    pub fn is_some(&self) -> bool {\n        self.as_ref().is_some()\n    }\n    pub fn is_some_and(&self, predicate: impl FnOnce(&ScriptMenus) -> bool) -> bool {\n        self.as_ref().is_some_and(predicate)\n    }\n    pub fn open_names(&self) -> Vec<String> {\n        self.as_ref().map_or_else(Vec::new, ScriptMenus::open_names)\n    }\n    pub fn focused_item(&self) -> Option<(&str, usize)> {\n        self.as_ref().and_then(ScriptMenus::focused_item)\n    }\n}\n\nuse std::collections::HashMap;\n\nuse asset_game::{MenuCatalog, MenuDef, SessionTeamSettings};\nuse assets::PreparedLocalizedStrings;\nuse bevy::prelude::*;\nuse bevy::ui::FocusPolicy;\nuse frame::{AppScreen, RuntimeRole, UiExecCommand, UiMenuKey, UiMenuRequest, UiPlaySound};\nuse net::{\n    ActionRequestIds, ClientActionInbox, ClientActionInput, LocalPresentClient, PresentedSnapshot,\n};\n\nuse crate::chrome::{\n    ChromeAssets, ChromeFrame, ChromeGapKind, ChromeMenuAnim, MenuVisOnError, OwnerDrawArgs,\n    OwnerDrawPaint, execute_chrome_menu_ex, item_screen_rects, push_owner_pic,\n};\nuse crate::draw2d::{Draw2dList, Draw2dOp, tessellate_fonts};\nuse crate::expr_cache::MenuExprCache;\nuse crate::gpu_list::{HudTessPass, TessJob};\nuse crate::images::HudImages;\nuse crate::playercard::UiLocalVars;\nuse host::{MenuHost, MenuWorld};\nconst WINDOW_DECORATION: i32 = 0x0010_0000;\npub(super) const DVAR_FOCUS: i32 = 0x10;\npub(super) const MAX_SCRIPT_DEPTH: u32 = 16;\nconst MAIN_MENU_DVAR: &str = "g_scriptMainMenu";\nconst FALLBACK_MAIN_MENU: &str = "class";\nconst SCOREBOARD_MENU: &str = "scoreboard";\nconst FRONTEND_LOADING_MENU: &str = "iw4l_frontend_loading";\n\npub(super) fn is_focusable(item: &asset_game::MenuItem) -> bool {\n    if item.static_flags & WINDOW_DECORATION != 0 {\n        return false;\n    }\n    let h = &item.handlers;\n    item.item_type != 0\n        || !h.action.is_empty()\n        || !h.accept.is_empty()\n        || !h.focus.is_empty()\n        || !h.mouse_enter.is_empty()\n}\n\npub(super) fn item_rect(item: &asset_game::MenuItem) -> [f32; 4] {\n    [item.rect.x, item.rect.y, item.rect.w, item.rect.h]\n}\n\npub(super) fn choice_index(choices: &[(String, String)], value: &str) -> Option<usize> {\n    let number = value.trim().parse::<f32>().ok();\n    choices.iter().position(|(_, choice)| {\n        choice == value || number.is_some_and(|n| choice.trim().parse::<f32>() == Ok(n))\n    })\n}\n\nfn painted_def(def: &MenuDef, open: &OpenMenu) -> MenuDef {\n    let (mut out, _) = crate::killcam_skip::inherit_shared_vis(def);\n    for (item, state) in out.items.iter_mut().zip(&open.items) {\n        if state.hidden {\n            item.vis_exp = String::from("0");\n        }\n        if let Some(color) = state.fore {\n            item.fore_color = color;\n        }\n        if let Some(color) = state.back {\n            item.back_color = color;\n        }\n    }\n    if let Some(color) = def.focus_color.filter(|color| color[3] > 0.0)\n        && let Some(item) = open.focus.and_then(|index| out.items.get_mut(index))\n        && (!item.text_key.is_empty() || !item.text_exp.is_empty())\n    {\n        item.fore_color = color;\n    }\n    out\n}\n\nfn custom_class_slot(item: &asset_game::MenuItem) -> Option<usize> {\n    fn response(events: &[asset_game::MenuEvent]) -> Option<usize> {\n        events.iter().find_map(|event| match event {\n            asset_game::MenuEvent::Script(text) => {\n                script::parse(text).into_iter().find_map(|cmd| {\n                    let script::Command::ScriptMenuResponse(value) = cmd else {\n                        return None;\n                    };\n                    value\n                        .strip_prefix("custom")?\n                        .parse::<usize>()\n                        .ok()?\n                        .checked_sub(1)\n                        .filter(|&slot| slot < sim::match_state::PERSONAL_CLASS_SLOTS)\n                })\n            }\n            asset_game::MenuEvent::If { then, .. } | asset_game::MenuEvent::Else(then) => {\n                response(then)\n            }\n            _ => None,\n        })\n    }\n    response(&item.handlers.action).or_else(|| response(&item.handlers.accept))\n}\n\nfn class_unavailable<\'a>(\n    menu: &str,\n    item: &asset_game::MenuItem,\n    dvars: &\'a frame::UiMenuDvars,\n) -> Option<&\'a str> {\n    let key = if menu.eq_ignore_ascii_case("class_picker") || menu.eq_ignore_ascii_case("class_samples_picker") {\n        let slot = item.name.strip_prefix("choice_")?.parse::<usize>().ok()?;\n        format!("ui_class_choice_unavailable_{slot}")\n    } else if menu.eq_ignore_ascii_case("iw4l_main") && item.name == "classes"\n        || menu.eq_ignore_ascii_case("game_lobby") && item.handlers.action.iter().any(|event| {\n            matches!(event, asset_game::MenuEvent::Script(text) if text.contains("ui_class_setup"))\n        })\n    {\n        "ui_class_feature_lock".to_owned()\n    } else if menu.to_ascii_lowercase().starts_with("changeclass") {\n        let slot = custom_class_slot(item)?;\n        format!("ui_class_unavailable_{slot}")\n    } else {\n        return None;\n    };\n    dvars.get(&key).filter(|reason| !reason.is_empty())\n}\n\n#[derive(Component)]\npub(crate) struct ScriptMenuRaster;\n\npub(crate) fn spawn_script_menus(root: &mut ChildSpawnerCommands) {\n    root.spawn((\n        ScriptMenuRaster,\n        crate::gpu_list::GpuListLatch::default(),\n        Node {\n            position_type: PositionType::Absolute,\n            display: Display::None,\n            width: Val::Percent(100.0),\n            height: Val::Percent(100.0),\n            ..default()\n        },\n        FocusPolicy::Pass,\n    ));\n}\n\n#[derive(bevy::ecs::system::SystemParam)]\npub(crate) struct MenuInputs<\'w, \'s> {\n    keys: Res<\'w, ButtonInput<KeyCode>>,\n    overlay: Res<\'w, frame::UiOverlayInput>,\n    keyboard: MessageReader<\'w, \'s, bevy::input::keyboard::KeyboardInput>,\n    mouse: Res<\'w, ButtonInput<MouseButton>>,\n    windows: Query<\'w, \'s, &\'static Window, With<bevy::window::PrimaryWindow>>,\n    hud_input: Option<ResMut<\'w, frame::HudInputView>>,\n    screen: Res<\'w, AppScreen>,\n    actions: Option<Res<\'w, ClientActionInput>>,\n    requests: MessageReader<\'w, \'s, UiMenuRequest>,\n    classes: Option<Res<\'w, frame::HostClassLoadouts>>,\n    weapons: Option<Res<\'w, assets::PreparedWeapons>>,\n    compass: Option<Res<\'w, assets::SessionCompass>>,\n    party: Res<\'w, frame::UiPartyState>,\n    frontend_strings: Option<Res<\'w, asset_game::LocalizeCatalog>>,\n    player_data: Option<Res<\'w, sim::LocalPlayerData>>,\n    content_loading: Option<Res<\'w, frame::FrontendContentLoading>>,\n}\n\n#[derive(Default)]\nstruct Pressed {\n    escape: bool,\n    enter: bool,\n    up: bool,\n    down: bool,\n    left: bool,\n    right: bool,\n    home: bool,\n    end: bool,\n    backspace: bool,\n    delete: bool,\n    text: Vec<String>,\n}\n\n#[derive(bevy::ecs::system::SystemParam)]\npub(crate) struct MenuOutputs<\'w> {\n    dvars: ResMut<\'w, frame::UiMenuDvars>,\n    binding: ResMut<\'w, frame::UiBindingCapture>,\n    binds: MessageWriter<\'w, frame::UiBindRequest>,\n    sounds: MessageWriter<\'w, UiPlaySound>,\n    music: MessageWriter<\'w, frame::UiPlayMusic>,\n    stop_music: MessageWriter<\'w, frame::UiStopMusic>,\n    exec: MessageWriter<\'w, UiExecCommand>,\n    inbox: Option<ResMut<\'w, ClientActionInbox>>,\n    ids: Option<ResMut<\'w, ActionRequestIds>>,\n}\n\n#[allow(clippy::too_many_arguments)]\npub(crate) fn update_script_menus(\n    surface: Res<crate::surface::Hud2dSurface>,\n    catalog: Option<Res<MenuCatalog>>,\n    strings: Option<Res<PreparedLocalizedStrings>>,\n    teams: Option<Res<SessionTeamSettings>>,\n    presented: Res<PresentedSnapshot>,\n    local: Res<LocalPresentClient>,\n    role: Option<Res<RuntimeRole>>,\n    mut input: MenuInputs,\n    mut transitions: MessageReader<StateTransitionEvent<frame::MatchScope>>,\n    mut menu_states: (Option<ResMut<ScriptMenus>>, ResMut<FrontendMenus>),\n    mut local_states: (\n        Option<ResMut<UiLocalVars>>,\n        ResMut<crate::playercard::FrontendLocalVars>,\n    ),\n    mut exprs: ResMut<MenuExprCache>,\n    mut out: MenuOutputs,\n    mut hud_images: ResMut<HudImages>,\n    mut images: ResMut<Assets<Image>>,\n    mut pass: ResMut<HudTessPass>,\n) {\n    let requests: Vec<UiMenuRequest> = input.requests.read().cloned().collect();\n    let FrontendMenus {\n        menus: frontend_menus,\n        restore_lobby,\n    } = &mut *menu_states.1;\n    for request in &requests {\n        match request {\n            UiMenuRequest::RestoreLobby => *restore_lobby = true,\n            UiMenuRequest::Close(name) if name == "game_lobby" => *restore_lobby = false,\n            _ => {}\n        }\n    }\n    let mut menus = menu_states.0.as_deref_mut().unwrap_or(frontend_menus);\n    let mut locals = local_states\n        .0\n        .as_deref_mut()\n        .unwrap_or(&mut local_states.1.0);\n    pass.script_menus = TessJob::Hide;\n    if transitions\n        .read()\n        .any(|event| event.exited == Some(frame::MatchScope::Live))\n    {\n        out.binding.command = None;\n        *menus = ScriptMenus::default();\n    }\n    let Some(catalog) = catalog.as_deref() else {\n        return;\n    };\n    let snapshot = presented.snapshot();\n    let meta = snapshot.and_then(|s| s.meta.for_client(local.0));\n    let in_game = matches!(*input.screen, AppScreen::InGame | AppScreen::ClassSelect);\n    let frontend = *input.screen == AppScreen::MainMenu;\n    if (!in_game && !frontend) || (in_game && meta.is_none()) {\n        if menus.screen.is_some() {\n            out.stop_music.write(frame::UiStopMusic);\n            out.binding.command = None;\n            *menus = ScriptMenus::default();\n        }\n        if let Some(view) = input.hud_input.as_mut()\n            && view.script_menu_open\n        {\n            view.script_menu_open = false;\n        }\n        return;\n    }\n    let screen_changed = menus.screen.map(|s| s == AppScreen::MainMenu) != Some(frontend);\n    if screen_changed {\n        out.binding.command = None;\n        *menus = ScriptMenus {\n            screen: Some(*input.screen),\n            ..default()\n        };\n        out.stop_music.write(frame::UiStopMusic);\n    }\n    let localize = if in_game {\n        strings.as_ref().map(|s| &s.0)\n    } else {\n        input.frontend_strings.as_deref()\n    };\n    let world = MenuWorld {\n        player_data: input.player_data.as_deref(),\n        ms: crate::scorebar::milliseconds() as i32,\n        in_game,\n        party: &input.party,\n        dvars: snapshot\n            .filter(|_| in_game)\n            .map(|s| s.meta.script_dvars(local.0)),\n        sv_running: in_game && role.is_some_and(|r| r.runs_authority()),\n        catalog: Some(catalog),\n        localize,\n        kind: snapshot.map(|s| s.meta.kind),\n        team: meta.map_or(0, |m| m.client_state_team),\n        team_scores: snapshot.map_or([0; 3], |s| s.meta.objectives.scores),\n        player_score: meta.map_or(0, |m| m.score),\n        time_left_s: snapshot.map_or(0, |s| {\n            let now_ms = s.tick.0.saturating_mul(sim::MATCH_TICK_MS) as i32;\n            s.meta.objectives.time_left_ms(now_ms).div_euclid(1000)\n        }),\n        teams: teams.as_ref().map(|t| &t.0),\n        scores_open: in_game\n            && input\n                .actions\n                .as_ref()\n                .is_some_and(|a| a.client.kb.scores.active),\n        classes: input.classes.as_deref(),\n        weapons: input.weapons.as_ref().map(|w| w.registry().as_ref()),\n        emp_jammed: in_game\n            && presented\n                .player(local.0)\n                .is_some_and(|ps| ps.other_flags & playerstate_iw4::other_flags::EMP_JAMMED != 0),\n        radar_blocked: in_game\n            && presented\n                .snapshot()\n                .and_then(|snap| snap.meta.for_client(local.0))\n                .is_some_and(|meta| meta.radar_blocked),\n    };\n\n    let mut runner = Runner {\n        catalog,\n        world: &world,\n        menus: &mut menus,\n        locals: &mut locals,\n        exprs: &mut exprs,\n        dvars: &mut out.dvars,\n        depth: 0,\n        binding: &mut out.binding,\n    };\n\n    let main_menu = if frontend && input.content_loading.is_some() {\n        FRONTEND_LOADING_MENU\n    } else {\n        "iw4l_main"\n    };\n    if frontend\n        && main_menu == "iw4l_main"\n        && let Some(at) = runner.menus.position(FRONTEND_LOADING_MENU)\n    {\n        let above: Vec<String> = runner.menus.stack[at + 1..]\n            .iter()\n            .map(|open| open.name.clone())\n            .collect();\n        runner.close(FRONTEND_LOADING_MENU);\n        runner.open(main_menu);\n        for name in above {\n            runner.open(&name);\n        }\n    }\n    if frontend && screen_changed {\n        runner.open(main_menu);\n        if let Some(def) = catalog.get("main")\n            && !def.sound_name.is_empty()\n        {\n            out.music.write(frame::UiPlayMusic {\n                alias: def.sound_name.clone(),\n            });\n        }\n    }\n\n    if frontend && main_menu == "iw4l_main" && *restore_lobby {\n        *restore_lobby = false;\n        if input.party.in_lobby && input.party.is_host {\n            runner.open("game_lobby");\n            diag::info!(Ui, "frontend: private lobby reopened");\n        }\n    }\n\n    for command in meta\n        .into_iter()\n        .filter(|_| in_game)\n        .flat_map(|m| &m.menu_commands)\n    {\n        if command.serial <= runner.menus.applied_serial {\n            continue;\n        }\n        runner.menus.applied_serial = command.serial;\n        match &command.kind {\n            sim::MenuCommandKind::Open(name) => runner.open(name),\n            sim::MenuCommandKind::ClosePopup => {\n                if let Some(top) = runner.menus.input_menu().map(|m| m.name.clone()) {\n                    runner.close(&top);\n                }\n            }\n            sim::MenuCommandKind::CloseInGame => runner.close_all(),\n        }\n    }\n\n    let console_open = input.hud_input.as_ref().is_some_and(|h| h.console_open);\n    let mut pressed = Pressed::default();\n    for request in requests {\n        match request {\n            UiMenuRequest::Toggle => pressed.escape = true,\n            UiMenuRequest::RestoreLobby => {}\n            UiMenuRequest::Open(name) => runner.open(&name),\n            UiMenuRequest::Close(name) => runner.close(&name),\n            UiMenuRequest::Focus { menu, item } => {\n                if let Some(index) = runner.catalog.get(&menu).and_then(|definition| {\n                    definition\n                        .items\n                        .iter()\n                        .position(|candidate| candidate.name == item)\n                }) {\n                    runner.set_focus(&menu, index);\n                }\n            }\n            UiMenuRequest::Key(UiMenuKey::Escape) => pressed.escape = true,\n            UiMenuRequest::Key(UiMenuKey::Enter) => pressed.enter = true,\n            UiMenuRequest::Key(UiMenuKey::Up) => pressed.up = true,\n            UiMenuRequest::Key(UiMenuKey::Down) => pressed.down = true,\n            UiMenuRequest::Key(UiMenuKey::Left) => pressed.left = true,\n            UiMenuRequest::Key(UiMenuKey::Right) => pressed.right = true,\n            UiMenuRequest::Key(UiMenuKey::Home) => pressed.home = true,\n            UiMenuRequest::Key(UiMenuKey::End) => pressed.end = true,\n            UiMenuRequest::Key(UiMenuKey::Backspace) => pressed.backspace = true,\n            UiMenuRequest::Key(UiMenuKey::Delete) => pressed.delete = true,\n            UiMenuRequest::Text(text) => pressed.text.push(text),\n        }\n    }\n    // Reopen after a teardown resets the stack; only acknowledgement clears\n    // the notice. Opening last also keeps keyboard/mouse focus on the dialog.\n    if frontend && runner.dvars.get("ui_connection_error") == Some("1") {\n        runner.open("iw4l_connection_error");\n    }\n    if frontend && runner.dvars.get("ui_map_error") == Some("1") {\n        runner.open("iw4l_map_error");\n    }\n    let pointer = !console_open && !input.overlay.0;\n    if pointer {\n        let keys = &input.keys;\n        pressed.escape |= keys.just_pressed(KeyCode::Escape);\n        pressed.enter |=\n            keys.just_pressed(KeyCode::Enter) || keys.just_pressed(KeyCode::NumpadEnter);\n        pressed.up |= keys.just_pressed(KeyCode::ArrowUp);\n        pressed.down |= keys.just_pressed(KeyCode::ArrowDown);\n        pressed.left |= keys.just_pressed(KeyCode::ArrowLeft);\n        pressed.right |= keys.just_pressed(KeyCode::ArrowRight);\n        pressed.home |= keys.just_pressed(KeyCode::Home);\n        pressed.end |= keys.just_pressed(KeyCode::End);\n        pressed.backspace |= keys.just_pressed(KeyCode::Backspace);\n        pressed.delete |= keys.just_pressed(KeyCode::Delete);\n    }\n    for event in input.keyboard.read() {\n        if pointer\n            && event.state.is_pressed()\n            && let Some(text) = &event.text\n        {\n            pressed.text.push(text.to_string());\n        }\n    }\n    if runner.menus.binding_menu.as_ref().is_some_and(|name| {\n        runner\n            .menus\n            .input_menu()\n            .is_none_or(|top| &top.name != name)\n    }) {\n        runner.binding.command = None;\n        runner.menus.binding_menu = None;\n    }\n    handle_input(&mut runner, &input, &surface, &pressed, pointer);\n\n    flush_outputs(&mut menus, &mut out, local.0);\n    if let Some(view) = input.hud_input.as_mut() {\n        let open = menus.captures_input();\n        if view.script_menu_open != open {\n            view.script_menu_open = open;\n        }\n    }\n\n    if input.overlay.0 && in_game {\n        return;\n    }\n\n    let scoreboard = snapshot\n        .filter(|s| in_game && crate::scoreboard::displayed(world.scores_open, s, local.0))\n        .and_then(|_| catalog.get(SCOREBOARD_MENU));\n    if (menus.stack.is_empty() && scoreboard.is_none()) || !surface.is_ready() {\n        return;\n    }\n    let open_names = menus.open_names();\n    let mut list = Draw2dList::default();\n    let mut reported = std::mem::take(&mut menus.reported);\n    let mut layers: Vec<(String, std::borrow::Cow<MenuDef>, Option<[f32; 4]>)> = Vec::new();\n    if let Some(def) = scoreboard {\n        layers.push((\n            SCOREBOARD_MENU.to_owned(),\n            std::borrow::Cow::Borrowed(def),\n            None,\n        ));\n    }\n    let paint_start = menus\n        .stack\n        .iter()\n        .rposition(|open| {\n            catalog\n                .get(&open.name)\n                .is_some_and(|def| def.fullscreen != 0)\n        })\n        .unwrap_or(0);\n    for open in &menus.stack[paint_start..] {\n        let Some(def) = catalog.get(&open.name) else {\n            continue;\n        };\n        let mut painted = painted_def(def, open);\n        let mut slider_parts = Vec::new();\n        for item in &mut painted.items {\n            if let Some(reason) = class_unavailable(&open.name, item, &out.dvars) {\n                if let Some(slot) = custom_class_slot(item) {\n                    let name = world\n                        .classes\n                        .and_then(|classes| classes.slots.get(slot))\n                        .map_or("Class", |class| class.name.as_str());\n                    item.text_key = format!("{name} — {reason}");\n                    item.text_literal = true;\n                    item.text_exp.clear();\n                }\n                item.fore_color = [0.5, 0.5, 0.5, 1.0];\n            }\n            if item.item_type == 14 && !item.dvar.is_empty() {\n                item.text_key = out\n                    .dvars\n                    .get(&format!("ui_bind_{}", item.dvar))\n                    .unwrap_or("UNBOUND")\n                    .to_owned();\n                if out.binding.command.as_deref() == Some(item.dvar.as_str()) {\n                    item.text_key = "... (ESC)".to_owned();\n                }\n                item.text_literal = true;\n                item.text_exp.clear();\n                item.text_align_mode = 10;\n                item.text_align_x = -8.0;\n                item.text_align_y = 0.0;\n            }\n            if item.item_type == 4 && !item.dvar.is_empty() {\n                item.text_key = out.dvars.get(&item.dvar).unwrap_or("").to_owned();\n                if item.edit_field.as_ref().is_some_and(|field| field.masked) {\n                    item.text_key = "*".repeat(item.text_key.chars().count());\n                }\n                item.text_literal = true;\n                item.text_exp.clear();\n            }\n            if let Some(slider) = &item.slider {\n                let value = out\n                    .dvars\n                    .get(&item.dvar)\n                    .and_then(|v| v.parse::<f32>().ok())\n                    .unwrap_or(slider.min);\n                let fraction = ((value - slider.min) / (slider.max - slider.min)).clamp(0.0, 1.0);\n                for (x, y, w, h, color) in [\n                    (0.0, 9.0, item.rect.w, 2.0, [0.6, 0.6, 0.6, 1.0]),\n                    (\n                        fraction * (item.rect.w - 6.0),\n                        3.0,\n                        6.0,\n                        14.0,\n                        [1.0, 1.0, 1.0, 1.0],\n                    ),\n                ] {\n                    let mut part = item.clone();\n                    part.slider = None;\n                    part.dvar.clear();\n                    part.text_key.clear();\n                    part.text_exp.clear();\n                    part.item_type = 0;\n                    part.static_flags |= WINDOW_DECORATION;\n                    part.style = 1;\n                    part.background = "white".into();\n                    part.back_color = color;\n                    part.rect.x += x;\n                    part.rect.y += y;\n                    part.rect.w = w;\n                    part.rect.h = h;\n                    slider_parts.push(part);\n                }\n                let mut label = item.clone();\n                label.slider = None;\n                label.dvar.clear();\n                label.item_type = 0;\n                label.static_flags |= WINDOW_DECORATION;\n                label.background.clear();\n                label.back_color = [0.0; 4];\n                label.text_exp.clear();\n                label.text_literal = true;\n                let displayed = slider\n                    .display_range\n                    .map_or(value, |[min, max]| min + fraction * (max - min));\n                let decimals = usize::from(slider.decimals.min(6));\n                label.text_key = format!("{displayed:.decimals$}{}", slider.suffix);\n                label.rect.x += item.rect.w + 8.0;\n                label.rect.w = 36.0;\n                slider_parts.push(label);\n                item.background.clear();\n                item.text_key.clear();\n                item.text_exp.clear();\n            }\n            if !item.choices.is_empty() {\n                let value = out.dvars.get(&item.dvar).unwrap_or_default();\n                item.text_key = choice_index(&item.choices, value)\n                    .map(|at| item.choices[at].0.clone())\n                    .unwrap_or_else(|| value.to_owned());\n                item.text_exp.clear();\n            }\n        }\n        painted.items.extend(slider_parts);\n        if let Some(edit) = &menus.editing\n            && edit.menu == open.name\n            && let Some(item) = painted.items.get_mut(edit.item)\n        {\n            let mut text = if item.edit_field.as_ref().is_some_and(|field| field.masked) {\n                vec![\'*\'; edit.buffer.len()]\n            } else {\n                edit.buffer.clone()\n            };\n            text.insert(edit.cursor.min(text.len()), \'|\');\n            item.text_key = text.into_iter().collect();\n            item.text_exp.clear();\n        }\n        let focus_rect = open.focus.and_then(|i| painted.items.get(i)).map(item_rect);\n        layers.push((\n            open.name.clone(),\n            std::borrow::Cow::Owned(painted),\n            focus_rect,\n        ));\n    }\n    for (name, painted, focus_rect) in &layers {\n        let host = MenuHost {\n            world: &world,\n            dvars: &out.dvars,\n            menu: painted,\n            locals: &locals,\n            open: &open_names,\n            focus_rect: *focus_rect,\n        };\n        let mut owner_draw = |args: OwnerDrawArgs<\'_>, frame: &mut ChromeFrame| {\n            if args.item.owner_draw == 181 {\n                if let Some(map_namespace) = hud_images.map_namespace()\n                    && let Some(image) = input\n                        .compass\n                        .as_ref()\n                        .and_then(|c| c.declaration.image.as_ref())\n                {\n                    push_owner_pic(\n                        &args,\n                        image.clone(),\n                        map_namespace,\n                        args.color,\n                        Draw2dOp::StretchPic,\n                        frame,\n                    );\n                    return OwnerDrawPaint::Painted;\n                }\n            }\n            OwnerDrawPaint::Gap(ChromeGapKind::OwnerDraw)\n        };\n        let frame = execute_chrome_menu_ex(\n            painted,\n            &host,\n            &surface,\n            ChromeAssets {\n                catalog: Some(catalog),\n                localize,\n            },\n            ChromeMenuAnim::IDENTITY,\n            &mut exprs,\n            MenuVisOnError::PaintAnyway,\n            Some(&mut owner_draw),\n        );\n        if frame.coverage.typed_gap > 0 && !reported.contains(name) {\n            reported.insert(name.clone());\n            let gaps: Vec<String> = frame\n                .coverage\n                .gap_ids\n                .iter()\n                .map(|(index, kind)| {\n                    let item = &painted.items[*index];\n                    let error = frame\n                        .vis_errors\n                        .iter()\n                        .find(|(i, _)| i == index)\n                        .map_or("", |(_, e)| e.as_str());\n                    let text = if item.text_exp.is_empty() {\n                        item.text_key.clone()\n                    } else {\n                        format!("{:?}", exprs.evaluate_string(&item.text_exp, &host))\n                    };\n                    format!("{index}:{}:{kind:?}{error}[{text}]", item.name)\n                })\n                .collect();\n            diag::info!(\n                Ui,\n                "menu {}: {} of {} items not painted: {}",\n                name,\n                gaps.len(),\n                painted.items.len(),\n                gaps.join(" ")\n            );\n        }\n        list.cmds.extend(frame.list.cmds);\n    }\n    menus.reported = reported;\n    let mut fonts: HashMap<String, &asset_game::FontDef> = HashMap::new();\n    for cmd in &list.cmds {\n        let _ = hud_images.get_native(cmd.material_namespace, &cmd.material, &mut images);\n        if let Draw2dOp::TextRun { font, .. } = &cmd.op\n            && !fonts.contains_key(font)\n            && let Some(def) = catalog.font(font)\n        {\n            fonts.insert(font.clone(), def);\n        }\n    }\n    let (quads, _) = tessellate_fonts(&list, &fonts);\n    if !quads.is_empty() {\n        pass.script_menus = TessJob::Quads(quads);\n    }\n}\n\nfn handle_input(\n    runner: &mut Runner<\'_, \'_>,\n    input: &MenuInputs,\n    surface: &crate::surface::Hud2dSurface,\n    pressed: &Pressed,\n    pointer: bool,\n) {\n    if runner.binding.command.is_some() || runner.binding.consumed_input {\n        if pressed.escape {\n            runner.binding.command = None;\n            runner.binding.consumed_input = true;\n        }\n        return;\n    }\n    if let Some(mut edit) = runner.menus.editing.take() {\n        let native_reply = edit.native_prompt.and_then(frame::ui::native_text::take_reply);\n        // UIKit owns input until its dialog is accepted or cancelled. Gamepad\n        // presses must not accidentally commit the old buffer underneath it.\n        if edit.native_prompt.is_some() && native_reply.is_none() {\n            runner.menus.editing = Some(edit);\n            return;\n        }\n        let native_accept = native_reply.as_ref().is_some_and(|reply| reply.value.is_some());\n        if native_reply.as_ref().is_some_and(|reply| reply.value.is_none()) || pressed.escape {\n            return;\n        }\n        if let Some(frame::ui::native_text::Reply { value: Some(text), .. }) = native_reply {\n            edit.buffer = text.chars().filter(|ch| !ch.is_control()).take(edit.max_chars).collect();\n            edit.cursor = edit.buffer.len();\n        }\n        if pressed.enter || native_accept {\n            if let Some(item) = runner\n                .catalog\n                .get(&edit.menu)\n                .and_then(|def| def.items.get(edit.item))\n            {\n                runner\n                    .dvars\n                    .set(&item.dvar, edit.buffer.iter().collect::<String>());\n                let value: String = edit.buffer.iter().collect();\n                let value = value.replace(\'\\\\\', "\\\\\\\\").replace(\'"\', "\\\\\\"");\n                if !item.edit_field.as_ref().is_some_and(|field| field.masked) {\n                    runner\n                        .menus\n                        .exec\n                        .push(format!("set {} \\"{}\\"", item.dvar, value));\n                }\n                runner.run_events(&edit.menu, Some(edit.item), &item.handlers.accept);\n            }\n            return;\n        }\n        if pressed.home {\n            edit.cursor = 0;\n        }\n        if pressed.end {\n            edit.cursor = edit.buffer.len();\n        }\n        if pressed.left {\n            edit.cursor = edit.cursor.saturating_sub(1);\n        }\n        if pressed.right {\n            edit.cursor = (edit.cursor + 1).min(edit.buffer.len());\n        }\n        if pressed.backspace && edit.cursor > 0 {\n            edit.cursor -= 1;\n            edit.buffer.remove(edit.cursor);\n        }\n        if pressed.delete && edit.cursor < edit.buffer.len() {\n            edit.buffer.remove(edit.cursor);\n        }\n        for text in &pressed.text {\n            for ch in text.chars().filter(|ch| !ch.is_control()) {\n                if edit.buffer.len() >= edit.max_chars {\n                    break;\n                }\n                edit.buffer.insert(edit.cursor, ch);\n                edit.cursor += 1;\n            }\n        }\n        runner.menus.editing = Some(edit);\n        return;\n    }\n    if pressed.escape {\n        match runner.menus.input_menu().map(|m| m.name.clone()) {\n            Some(top) => runner.escape(&top),\n            None if !runner.world.in_game => runner.open("iw4l_main"),\n            None => {\n                let main = runner\n                    .world\n                    .dvars\n                    .as_ref()\n                    .and_then(|d| d.string(MAIN_MENU_DVAR))\n                    .filter(|name| !name.is_empty() && runner.catalog.get(name).is_some())\n                    .map(str::to_owned);\n                let name = main.unwrap_or_else(|| {\n                    diag::warn!(\n                        Ui,\n                        "togglemenu: {MAIN_MENU_DVAR} names no loaded menu, opening {FALLBACK_MAIN_MENU}"\n                    );\n                    FALLBACK_MAIN_MENU.to_owned()\n                });\n                runner.open(&name);\n            }\n        }\n        return;\n    }\n    let Some(top) = runner.menus.input_menu().map(|m| m.name.clone()) else {\n        return;\n    };\n\n    if pressed.down {\n        runner.focus_nav(&top, 0, 1);\n    }\n    if pressed.up {\n        runner.focus_nav(&top, 0, -1);\n    }\n    if pressed.left || pressed.right {\n        let step = if pressed.left { -1 } else { 1 };\n        let focus = runner.menus.input_menu().and_then(|m| m.focus);\n        if !focus.is_some_and(|focus| runner.adjust(&top, focus, step)) {\n            runner.focus_nav(&top, step, 0);\n        }\n        return;\n    }\n    if pressed.enter {\n        if let Some(focus) = runner.menus.input_menu().and_then(|m| m.focus) {\n            runner.activate(&top, focus, true);\n        }\n        return;\n    }\n    if !pointer {\n        return;\n    }\n\n    let cursor = input\n        .windows\n        .single()\n        .ok()\n        .and_then(|w| w.cursor_position());\n    let Some(cursor) = cursor else {\n        return;\n    };\n    let moved = runner.menus.cursor.is_some_and(|old| old != cursor);\n    runner.menus.cursor = Some(cursor);\n    if !input.mouse.pressed(MouseButton::Left) {\n        runner.menus.slider_drag = None;\n    }\n    if !moved && !input.mouse.just_pressed(MouseButton::Left) {\n        return;\n    }\n    let Some(def) = runner.catalog.get(&top) else {\n        return;\n    };\n    let Some(open) = runner.menus.input_menu() else {\n        return;\n    };\n    let painted = painted_def(def, open);\n    let names = runner.menus.open_names();\n    let host = MenuHost {\n        world: runner.world,\n        dvars: runner.dvars,\n        menu: &painted,\n        locals: runner.locals,\n        open: &names,\n        focus_rect: None,\n    };\n    let rects = item_screen_rects(&painted, &host, surface, runner.exprs);\n    let visible = runner.visible_items(&top);\n    if let Some((menu, index)) = runner.menus.slider_drag.clone() {\n        if menu == top && input.mouse.pressed(MouseButton::Left) {\n            if let Some((_, [x0, _, x1, _])) = rects.iter().find(|(i, _)| *i == index) {\n                runner.slide(&top, index, (cursor.x - x0) / (x1 - x0));\n            }\n            return;\n        }\n        runner.menus.slider_drag = None;\n    }\n    let hit = rects.iter().rev().find_map(|&(index, [x0, y0, x1, y1])| {\n        let inside = cursor.x >= x0 && cursor.x < x1 && cursor.y >= y0 && cursor.y < y1;\n        (inside && is_focusable(&def.items[index]) && visible.contains(&index)).then_some(index)\n    });\n    runner.set_hover(&top, hit);\n    if input.mouse.just_pressed(MouseButton::Left)\n        && let Some(index) = hit\n    {\n        if let Some((_, [x0, _, x1, _])) = rects.iter().find(|(i, _)| *i == index)\n            && runner.slide(&top, index, (cursor.x - x0) / (x1 - x0))\n        {\n            runner.set_focus(&top, index);\n            runner.menus.slider_drag = Some((top.clone(), index));\n        } else {\n            runner.activate(&top, index, false);\n        }\n    }\n}\n\nfn flush_outputs(menus: &mut ScriptMenus, out: &mut MenuOutputs, local: sim::ClientId) {\n    for command in menus.bind_requests.drain(..) {\n        out.binds.write(frame::UiBindRequest { command });\n    }\n    for alias in menus.sounds.drain(..) {\n        out.sounds.write(UiPlaySound { alias });\n    }\n    for text in menus.exec.drain(..) {\n        diag::info!(Ui, "menu exec: {text}");\n        out.exec.write(UiExecCommand { text });\n    }\n    let private_host = out.dvars.get("ui_lobby_host") == Some("1")\n        && out.dvars.get("ui_lobby_public") != Some("1");\n    menus.responses.retain(|(menu, response)| {\n        let end_game = menu.eq_ignore_ascii_case("popup_endgame")\n            || menu.eq_ignore_ascii_case("popup_endgame_ranked");\n        if !end_game || !response.eq_ignore_ascii_case("endround") || private_host {\n            return true;\n        }\n        diag::info!(Ui, "menu exec: disconnect");\n        out.exec.write(UiExecCommand {\n            text: "disconnect".into(),\n        });\n        false\n    });\n    let (Some(inbox), Some(ids)) = (out.inbox.as_mut(), out.ids.as_mut()) else {\n        menus.responses.clear();\n        return;\n    };\n    for (menu, response) in menus.responses.drain(..) {\n        if menu.eq_ignore_ascii_case("changeclass")\n            && let Some(slot) = response\n                .strip_prefix("custom")\n                .and_then(|n| n.parse::<usize>().ok())\n                .and_then(|n| n.checked_sub(1))\n                .filter(|slot| *slot < sim::match_state::PERSONAL_CLASS_SLOTS)\n        {\n            out.exec.write(UiExecCommand {\n                text: format!("spawn {slot} &"),\n            });\n            continue;\n        }\n        let (Some(menu_field), Some(response_field)) = (\n            sim::menu_response_field(&menu),\n            sim::menu_response_field(&response),\n        ) else {\n            diag::warn!(\n                Ui,\n                "menu response `{menu}` `{response}` does not fit the wire"\n            );\n            continue;\n        };\n        let request_id = ids.allocate();\n        match inbox.push(\n            local,\n            sim::ClientAction::MenuResponse {\n                request_id,\n                menu: menu_field,\n                response: response_field,\n            },\n        ) {\n            Ok(_) => diag::info!(Ui, "menu response: {menu} {response}"),\n            Err(error) => diag::warn!(\n                Ui,\n                "menu response `{menu}` `{response}` not queued: {error}"\n            ),\n        }\n    }\n}\n')
          (target/'crates/ios/Cargo.toml').write_text('[package]\nname = "iw4l-ios"\nversion = "0.1.0"\nedition.workspace = true\nlicense.workspace = true\ndescription = "iOS entry: resolves the app\'s folders, wires the phone\'s controller, text prompts and audio, and hands off to the shared mobile launch."\n\n[lib]\nname = "iw4l_ios"\ncrate-type = ["lib", "staticlib"]\n\n[[bin]]\nname = "iw4lj"\npath = "src/main.rs"\n\n[dependencies]\nframe.workspace = true\nmobile = { path = "../mobile" }\ntouch = { path = "../touch" }\ndiag.workspace = true\n\n[target.\'cfg(target_os = "ios")\'.dependencies]\nlibc = "0.2"\nobjc2 = "0.6"\nblock2 = "0.6"\ndispatch2 = "0.3"\nobjc2-foundation = "0.3"\nobjc2-ui-kit = "0.3"\nobjc2-game-controller = { version = "0.3", features = ["objc2-core-haptics"] }\nobjc2-avf-audio = "0.3"\nobjc2-core-haptics = "0.3"\n\n[lints]\nworkspace = true\n')
          (target/'crates/ios/src/prompt.rs').write_text('#![allow(deprecated)]\n//! Text prompts: the game has no field a phone keyboard can type into, so when\n//! its menu wants text it raises a flag, and this shows an alert with a text\n//! field and sends the answer back a character at a time. The same arrangement\n//! as Android\'s dialog.\n\nuse std::ptr::NonNull;\nuse std::time::Duration;\n\nuse block2::RcBlock;\nuse dispatch2::DispatchQueue;\nuse objc2::MainThreadMarker;\nuse objc2::rc::Weak;\nuse objc2_foundation::NSString;\nuse objc2_ui_kit::{\n    UIAlertAction, UIAlertActionStyle, UIAlertController, UIAlertControllerStyle, UIApplication,\n    UIKeyboardType, UITextAutocorrectionType, UITextField, UITextInputTraits, UIViewController,\n};\n\nconst NAME: u32 = 1;\nconst HOST_IP: u32 = 2;\n\npub fn start() {\n    let spawned = std::thread::Builder::new()\n        .name("iw4l-prompt".into())\n        .spawn(|| {\n            loop {\n                std::thread::sleep(Duration::from_millis(300));\n                if let Some(request) = frame::ui::native_text::take_request() {\n                    DispatchQueue::main().exec_async(move || show_menu(request));\n                    continue;\n                }\n                let kind = touch::take_prompt();\n                if kind != 0 {\n                    DispatchQueue::main().exec_async(move || show(kind));\n                }\n            }\n        });\n    if let Err(error) = spawned {\n        eprintln!("prompt thread: {error}");\n    }\n}\n\n/// The view controller a new alert has to be presented from: the one on top.\nfn top(mtm: MainThreadMarker) -> Option<objc2::rc::Retained<UIViewController>> {\n    let windows = UIApplication::sharedApplication(mtm).windows();\n    let window = windows.iter().find(|window| window.isKeyWindow()).or_else(|| windows.firstObject())?;\n    let mut controller = window.rootViewController()?;\n    while let Some(next) = controller.presentedViewController() {\n        controller = next;\n    }\n    Some(controller)\n}\n\nfn show(kind: u32) {\n    let Some(mtm) = MainThreadMarker::new() else {\n        return;\n    };\n    let (title, max, address) = match kind {\n        NAME => ("Player name", 15, false),\n        HOST_IP => ("Host IP address (shown on the host\'s LAN tab)", 21, true),\n        _ => return,\n    };\n    let Some(presenter) = top(mtm) else {\n        return;\n    };\n    let alert = UIAlertController::alertControllerWithTitle_message_preferredStyle(\n        Some(&NSString::from_str(title)),\n        None,\n        UIAlertControllerStyle::Alert,\n        mtm,\n    );\n    let configure = RcBlock::new(move |field: NonNull<UITextField>| {\n        // SAFETY: UIKit passes a live text field.\n        let field = unsafe { field.as_ref() };\n        field.setAutocorrectionType(UITextAutocorrectionType::No);\n        field.setKeyboardType(if address {\n            UIKeyboardType::NumbersAndPunctuation\n        } else {\n            UIKeyboardType::ASCIICapable\n        });\n    });\n    alert.addTextFieldWithConfigurationHandler(Some(&configure));\n\n    // The alert holds its actions; an action holding the alert would never let\n    // either go.\n    let weak = Weak::from_retained(&alert);\n    let accept = RcBlock::new(move |_action: NonNull<UIAlertAction>| {\n        let Some(alert) = weak.load() else {\n            return;\n        };\n        let text = alert\n            .textFields()\n            .and_then(|fields| fields.firstObject())\n            .and_then(|field| field.text())\n            .map(|text| text.to_string())\n            .unwrap_or_default();\n        for character in text.chars().take(max) {\n            touch::typed_char(character as u32);\n        }\n        touch::typed_done(kind);\n    });\n    alert.addAction(&UIAlertAction::actionWithTitle_style_handler(\n        Some(&NSString::from_str("OK")),\n        UIAlertActionStyle::Default,\n        Some(&accept),\n        mtm,\n    ));\n    alert.addAction(&UIAlertAction::actionWithTitle_style_handler(\n        Some(&NSString::from_str("Cancel")),\n        UIAlertActionStyle::Cancel,\n        None,\n        mtm,\n    ));\n    presenter.presentViewController_animated_completion(&alert, true, None);\n}\n\n/// Every editable game-menu field shares this path, including masked passwords.\nfn show_menu(request: frame::ui::native_text::Request) {\n    let id = request.id;\n    let Some(mtm) = MainThreadMarker::new() else { frame::ui::native_text::finish(id, None); return; };\n    let Some(presenter) = top(mtm) else { frame::ui::native_text::finish(id, None); return; };\n    let alert = UIAlertController::alertControllerWithTitle_message_preferredStyle(\n        Some(&NSString::from_str(&request.title)), None, UIAlertControllerStyle::Alert, mtm);\n    let initial = request.value;\n    let masked = request.masked;\n    let max = request.max_chars;\n    let configure = RcBlock::new(move |field: NonNull<UITextField>| {\n        let field = unsafe { field.as_ref() };\n        field.setText(Some(&NSString::from_str(&initial)));\n        field.setAutocorrectionType(UITextAutocorrectionType::No);\n        field.setKeyboardType(UIKeyboardType::ASCIICapable);\n        field.setSecureTextEntry(masked);\n    });\n    alert.addTextFieldWithConfigurationHandler(Some(&configure));\n    let weak = Weak::from_retained(&alert);\n    let accept = RcBlock::new(move |_action: NonNull<UIAlertAction>| {\n        let value = weak.load().and_then(|alert| alert.textFields())\n            .and_then(|fields| fields.firstObject()).and_then(|field| field.text())\n            .map(|text| text.to_string().chars().filter(|ch| !ch.is_control()).take(max).collect());\n        frame::ui::native_text::finish(id, value);\n    });\n    let cancel = RcBlock::new(move |_action: NonNull<UIAlertAction>| frame::ui::native_text::finish(id, None));\n    alert.addAction(&UIAlertAction::actionWithTitle_style_handler(Some(&NSString::from_str("Valider")), UIAlertActionStyle::Default, Some(&accept), mtm));\n    alert.addAction(&UIAlertAction::actionWithTitle_style_handler(Some(&NSString::from_str("Annuler")), UIAlertActionStyle::Cancel, Some(&cancel), mtm));\n    let weak = Weak::from_retained(&alert);\n    let focus = RcBlock::new(move || {\n        if let Some(field) = weak.load().and_then(|alert| alert.textFields()).and_then(|fields| fields.firstObject()) {\n            field.becomeFirstResponder();\n        }\n    });\n    presenter.presentViewController_animated_completion(&alert, true, Some(&focus));\n}\n')
          
